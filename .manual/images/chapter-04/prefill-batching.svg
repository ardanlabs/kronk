<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The two stages of prefill and how the prefill batch size shapes compute</title>
  <desc id="desc">Prefill stage one restores reusable KV state from a compatible IMC session into an assigned slot. Prefill stage two computes KV tensors for CPU-side token slices held by assigned jobs. A before view shows that restored Slot 1 state does not enter the tray. Kronk stages generation rows first, then takes prompt tokens from one prefill owner. The cursor remains on that owner across decode iterations until its prefill completes. The GPU computes the missing KV tensors, and an after view shows the complete prompt state in Slot 1.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.4px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .eyebrow { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
      .token { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: middle; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="72" y="67">PREFILL: RESTORE WHAT EXISTS, COMPUTE WHAT IS MISSING</text>
  <text class="subtitle" x="72" y="105">Stage 1 restores reusable KV state. Stage 2 computes missing state in configured prefill contributions.</text>

  <!-- Prefill overview -->
  <g filter="url(#shadow)">
    <rect x="70" y="138" width="1778" height="318" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  </g>
  <rect x="70" y="138" width="1778" height="62" rx="26" fill="#dbeafe"/>
  <path d="M 70 174 Q 70 200 96 200 H 1822 Q 1848 200 1848 174" fill="#dbeafe"/>
  <text class="eyebrow" x="104" y="176" fill="#1d4ed8">PREFILL OVERVIEW</text>
  <text class="section" x="278" y="178">RESTORE REUSABLE STATE, THEN COMPUTE THE MISSING STATE</text>

  <!-- Complete prompt -->
  <rect x="105" y="224" width="490" height="196" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="140" y="263">Complete logical prompt</text>
  <text class="small" x="140" y="291">Token IDs are known before model execution.</text>
  <g>
    <rect x="140" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="194" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="248" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="302" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="356" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="410" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="464" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <rect x="518" y="314" width="45" height="45" rx="9" fill="#e2e8f0"/>
    <text class="token" x="162.5" y="336.5">5</text>
    <text class="token" x="216.5" y="336.5">2</text>
    <text class="token" x="270.5" y="336.5">8</text>
    <text class="token" x="324.5" y="336.5">1</text>
    <text class="token" x="378.5" y="336.5">7</text>
    <text class="token" x="432.5" y="336.5">4</text>
    <text class="token" x="486.5" y="336.5">9</text>
    <text class="token" x="540.5" y="336.5">3</text>
  </g>
  <text class="small" x="140" y="394">The full prompt is still tracked on the CPU.</text>

  <path d="M 610 322 H 674" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="eyebrow" x="616" y="284" fill="#1d4ed8">MATCH</text>

  <!-- Assigned sequence -->
  <rect x="695" y="224" width="530" height="196" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="heading" x="730" y="263">Stage 1 · Restore saved KV state</text>
  <text class="small" x="730" y="291">The session supplies the reusable prompt prefix.</text>
  <g>
    <rect x="730" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="784" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="838" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="892" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <text class="token white" x="752.5" y="336.5">5</text>
    <text class="token white" x="806.5" y="336.5">2</text>
    <text class="token white" x="860.5" y="336.5">8</text>
    <text class="token white" x="914.5" y="336.5">1</text>
  </g>
  <text class="small" x="730" y="391">Restored KV prefix</text>

  <path d="M 1240 322 H 1304" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="eyebrow" x="1244" y="284" fill="#b45309">STAGE 2</text>

  <!-- Complete KV -->
  <rect x="1325" y="224" width="488" height="196" rx="18" fill="#ecfeff" stroke="#2dd4bf" stroke-width="2"/>
  <text class="heading" x="1360" y="263">Stage 2 · Compute missing KV state</text>
  <text class="small" x="1360" y="291">Run only the uncached suffix through the model.</text>
  <g>
    <rect x="1360" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1414" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1468" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1522" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1576" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1630" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1684" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <rect x="1738" y="314" width="45" height="45" rx="9" fill="#22c55e"/>
    <text class="token white" x="1382.5" y="336.5">5</text>
    <text class="token white" x="1436.5" y="336.5">2</text>
    <text class="token white" x="1490.5" y="336.5">8</text>
    <text class="token white" x="1544.5" y="336.5">1</text>
    <text class="token white" x="1598.5" y="336.5">7</text>
    <text class="token white" x="1652.5" y="336.5">4</text>
    <text class="token white" x="1706.5" y="336.5">9</text>
    <text class="token white" x="1760.5" y="336.5">3</text>
  </g>
  <text class="small" x="1360" y="394">Complete prompt KV state · ready for generation</text>

  <!-- Lesson 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="486" width="1778" height="430" rx="26" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
  </g>
  <rect x="70" y="486" width="1778" height="62" rx="26" fill="#ede9fe"/>
  <path d="M 70 522 Q 70 548 96 548 H 1822 Q 1848 548 1848 522" fill="#ede9fe"/>
  <text class="eyebrow" x="104" y="524" fill="#6d28d9">STAGE 2 DETAIL</text>
  <text class="section" x="278" y="526">HOW MISSING PROMPT TOKENS BECOME KV STATE</text>

  <!-- Before: restored slot state (comparison only) -->
  <rect x="105" y="574" width="235" height="266" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="eyebrow" x="130" y="608" fill="#15803d">GPU KV · BEFORE</text>
  <text class="heading" x="130" y="642">Slot 1 after restore</text>
  <g>
    <rect x="130" y="666" width="38" height="44" rx="8" fill="#22c55e"/>
    <rect x="178" y="666" width="38" height="44" rx="8" fill="#22c55e"/>
    <rect x="226" y="666" width="38" height="44" rx="8" fill="#22c55e"/>
    <rect x="274" y="666" width="38" height="44" rx="8" fill="#22c55e"/>
    <text class="token white" x="149" y="688">5</text><text class="token white" x="197" y="688">2</text>
    <text class="token white" x="245" y="688">8</text><text class="token white" x="293" y="688">1</text>
  </g>
  <text class="small" x="130" y="750">Restored prefix remains</text>
  <text class="small" x="130" y="774">in the slot’s KV state.</text>
  <rect x="130" y="796" width="182" height="28" rx="8" fill="#dcfce7"/>
  <text class="small" x="145" y="816">Not added to the tray</text>

  <!-- CPU pending token slices -->
  <rect x="365" y="574" width="300" height="266" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="390" y="610">CPU - Missing Tokens</text>
  <text class="body" x="390" y="680">Job A</text>
  <g>
    <rect x="448" y="655" width="27" height="38" rx="7" fill="#3b82f6"/>
    <rect x="481" y="655" width="27" height="38" rx="7" fill="#3b82f6"/>
    <rect x="514" y="655" width="27" height="38" rx="7" fill="#3b82f6"/>
    <rect x="547" y="655" width="27" height="38" rx="7" fill="#3b82f6"/>
    <text class="token white" x="461.5" y="674">7</text><text class="token white" x="494.5" y="674">4</text>
    <text class="token white" x="527.5" y="674">9</text><text class="token white" x="560.5" y="674">3</text>
  </g>
  <text class="body" x="390" y="738">Job B</text>
  <g>
    <rect x="448" y="713" width="27" height="38" rx="7" fill="#8b5cf6"/>
    <rect x="481" y="713" width="27" height="38" rx="7" fill="#8b5cf6"/>
    <rect x="514" y="713" width="27" height="38" rx="7" fill="#8b5cf6"/>
    <rect x="547" y="713" width="27" height="38" rx="7" fill="#8b5cf6"/>
    <rect x="580" y="713" width="27" height="38" rx="7" fill="#c4b5fd"/>
    <rect x="613" y="713" width="27" height="38" rx="7" fill="#c4b5fd"/>
    <text class="token white" x="461.5" y="732">6</text><text class="token white" x="494.5" y="732">2</text>
    <text class="token white" x="527.5" y="732">5</text><text class="token white" x="560.5" y="732">8</text>
    <text class="token" x="593.5" y="732">1</text><text class="token" x="626.5" y="732">7</text>
  </g>
  <text class="body" x="390" y="796">Job C</text>
  <g>
    <rect x="448" y="771" width="27" height="38" rx="7" fill="#f97316"/>
    <rect x="481" y="771" width="27" height="38" rx="7" fill="#f97316"/>
    <text class="token white" x="461.5" y="790">4</text><text class="token white" x="494.5" y="790">6</text>
  </g>

  <!-- Prefill owner -->
  <text class="eyebrow" x="678" y="662" fill="#6d28d9">PREFILL</text>
  <text class="eyebrow" x="678" y="684" fill="#6d28d9">OWNER A</text>
  <path d="M 675 724 H 728" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Shared logical tray -->
  <rect x="745" y="574" width="550" height="266" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text class="heading" x="770" y="610">CPU · shared tray</text>
  <rect x="1000" y="586" width="125" height="44" rx="10" fill="#e0e7ff"/>
  <rect x="1138" y="586" width="125" height="44" rx="10" fill="#dbeafe"/>
  <text class="small" x="1062.5" y="614" text-anchor="middle">prefill = 4</text>
  <text class="small" x="1200.5" y="614" text-anchor="middle">NBatch = 7</text>
  <text class="eyebrow" x="770" y="658" fill="#6d28d9">GENERATION FIRST · THEN OWNER A</text>
  <g>
    <rect x="770" y="679" width="36" height="48" rx="8" fill="#22c55e"/>
    <rect x="812" y="679" width="36" height="48" rx="8" fill="#22c55e"/>
    <rect x="854" y="679" width="36" height="48" rx="8" fill="#bbf7d0"/>
    <rect x="896" y="679" width="36" height="48" rx="8" fill="#3b82f6"/>
    <rect x="938" y="679" width="36" height="48" rx="8" fill="#3b82f6"/>
    <rect x="980" y="679" width="36" height="48" rx="8" fill="#3b82f6"/>
    <rect x="1022" y="679" width="36" height="48" rx="8" fill="#3b82f6"/>
    <text class="token white" x="788" y="703">G</text><text class="token white" x="830" y="703">G</text>
    <text class="token" x="872" y="703">R</text><text class="token white" x="914" y="703">7</text>
    <text class="token white" x="956" y="703">4</text><text class="token white" x="998" y="703">9</text>
    <text class="token white" x="1040" y="703">3</text>
  </g>
  <text class="small" x="770" y="755">2 generation rows · 1 unused reserve · 4 prefill tokens from A</text>
  <text class="small" x="770" y="781">Next decode starts with A again unless A completed prefill</text>
  <rect x="770" y="798" width="498" height="30" rx="8" fill="#0f172a"/>
  <text class="small white" x="1019" y="819" text-anchor="middle">Submit logically; non-MTP may split it into physical ubatches.</text>

  <path d="M 1305 707 H 1334" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Simple GPU computation -->
  <rect x="1350" y="574" width="145" height="266" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow" x="1422.5" y="640" fill="#1d4ed8" text-anchor="middle">GPU</text>
  <text class="heading" x="1422.5" y="687" text-anchor="middle">Compute</text>
  <text class="heading" x="1422.5" y="719" text-anchor="middle">missing</text>
  <text class="heading" x="1422.5" y="751" text-anchor="middle">KV tensors</text>

  <path d="M 1505 707 H 1534" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- After: complete slot state -->
  <rect x="1550" y="574" width="263" height="266" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="eyebrow" x="1575" y="608" fill="#15803d">GPU KV · AFTER</text>
  <text class="heading" x="1575" y="642">Slot 1 complete</text>
  <g>
    <rect x="1575" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1604" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1633" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1662" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1691" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1720" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1749" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <rect x="1778" y="658" width="25" height="38" rx="7" fill="#22c55e"/>
    <text class="token white" x="1587.5" y="677">5</text><text class="token white" x="1616.5" y="677">2</text>
    <text class="token white" x="1645.5" y="677">8</text><text class="token white" x="1674.5" y="677">1</text>
    <text class="token white" x="1703.5" y="677">7</text><text class="token white" x="1732.5" y="677">4</text>
    <text class="token white" x="1761.5" y="677">9</text><text class="token white" x="1790.5" y="677">3</text>
  </g>
  <rect x="1575" y="711" width="213" height="44" rx="9" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="1575" y="769" width="213" height="44" rx="9" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text class="body" x="1623" y="739">Slot 2 updated</text>
  <text class="body" x="1623" y="797">Slot 3 updated</text>

  <!-- Initial-fill implementation note -->
  <rect x="105" y="858" width="1708" height="40" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="small" x="132" y="884">Admission only binds the job. Stage 2 always enters through the prefill owner after prioritized generation rows.</text>

  <!-- Definitions -->
  <rect x="70" y="946" width="548" height="94" rx="18" fill="#0f172a"/>
  <text class="heading white" x="100" y="980">Prefill batch size · user setting</text>
  <text class="small white" x="100" y="1011">Caps prompt tokens contributed by the current owner.</text>

  <rect x="636" y="946" width="548" height="94" rx="18" fill="#0f172a"/>
  <text class="heading white" x="666" y="980">Effective NBatch · internal</text>
  <text class="small white" x="666" y="1011">Prefill size plus generation reserve for every slot.</text>

  <rect x="1202" y="946" width="646" height="94" rx="18" fill="#0f172a"/>
  <text class="heading white" x="1232" y="980">Effective NUBatch · internal</text>
  <text class="small white" x="1232" y="1011">MTP matches NUBatch to NBatch; non-MTP can split the tray.</text>

  <text class="small muted" x="72" y="1068">Most users should keep the 2048-token default. Larger prefill contributions require larger compute buffers.</text>
</svg>
