<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kronk generation request lifecycle</title>
  <desc id="desc">A four-stage flow showing request admission, preparation and IMC session reservation, batch scheduling, execution-slot assignment, model execution, and resource release.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .stage { font: 700 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.5px; }
      .body { font: 500 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .compact { font-size: 16px; }
      .note { font: 600 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="72" y="78">KRONK GENERATION REQUEST LIFECYCLE</text>
  <text class="subtitle" x="72" y="116">A request is admitted, prepared, scheduled, and executed through four distinct stages.</text>

  <!-- Stage connectors -->
  <path d="M 445 405 L 493 405" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 915 405 L 963 405" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1385 405 L 1433 405" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="62" y="164" width="383" height="548" rx="24" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/>
  </g>
  <rect x="62" y="164" width="383" height="68" rx="24" fill="#ccfbf1"/>
  <path d="M 62 208 Q 62 232 86 232 H 421 Q 445 232 445 208" fill="#ccfbf1"/>
  <text class="eyebrow" x="90" y="192" fill="#0f766e">STAGE 1</text>
  <text class="stage" x="90" y="220">ADMIT REQUEST</text>

  <circle cx="98" cy="273" r="16" fill="#0f766e"/>
  <text class="white" x="93" y="280" style="font:700 18px Inter, sans-serif">1</text>
  <text class="body" x="128" y="280">Start route-wide deadline</text>
  <text class="small" x="128" y="307">InferenceTimeout defaults to 60m</text>

  <circle cx="98" cy="351" r="16" fill="#0f766e"/>
  <text class="white" x="93" y="358" style="font:700 18px Inter, sans-serif">2</text>
  <text class="body" x="128" y="358">Authenticate and decode request</text>
  <text class="small" x="128" y="385">Acquire model from the pool</text>

  <circle cx="98" cy="456" r="16" fill="#0f766e"/>
  <text class="white" x="93" y="463" style="font:700 18px Inter, sans-serif">3</text>
  <text class="body" x="128" y="463">Acquire SDK admission permit</text>
  <rect x="88" y="487" width="329" height="73" rx="12" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
  <text class="mono" x="108" y="517">NSeqMax × QueueDepth</text>
  <text class="small" x="108" y="544">QueueDepth defaults to 2</text>

  <rect x="88" y="570" width="329" height="125" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="eyebrow" x="108" y="598" fill="#c2410c">WHEN ADMISSION IS FULL</text>
  <text class="body" x="108" y="626">Caller waits for a permit</text>
  <text class="small" x="108" y="653">Ends on capacity or cancellation</text>
  <text class="small" x="108" y="677">AdmissionTimeout defaults to 3m</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="532" y="164" width="383" height="548" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  </g>
  <rect x="532" y="164" width="383" height="68" rx="24" fill="#dbeafe"/>
  <path d="M 532 208 Q 532 232 556 232 H 891 Q 915 232 915 208" fill="#dbeafe"/>
  <text class="eyebrow" x="560" y="192" fill="#1d4ed8">STAGE 2</text>
  <text class="stage" x="560" y="220">PREPARE + RESERVE</text>

  <text class="body" x="560" y="275">Validate, render, and tokenize prompt</text>
  <text class="small" x="560" y="305">If eligible, reserve before batch submission</text>

  <rect x="558" y="334" width="331" height="74" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow" x="578" y="361" fill="#1d4ed8">IMC SESSION POOL</text>
  <text class="mono" x="578" y="390">NSeqMax × max(3, QueueDepth)</text>

  <rect x="558" y="429" width="98" height="75" rx="12" fill="#bfdbfe"/>
  <rect x="674" y="429" width="98" height="75" rx="12" fill="#bfdbfe"/>
  <rect x="790" y="429" width="98" height="75" rx="12" fill="#bfdbfe"/>
  <text class="mono" x="578" y="460">S0</text>
  <text class="small" x="578" y="485">reserved</text>
  <text class="mono" x="694" y="460">S1</text>
  <text class="small" x="694" y="485">empty</text>
  <text class="mono" x="810" y="460">S2</text>
  <text class="small" x="810" y="485">reusable</text>

  <path d="M 723 518 L 723 550" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="558" y="562" width="331" height="55" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="body" x="578" y="596">Select session; mark reserved</text>

  <rect x="558" y="630" width="331" height="62" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text class="small" x="578" y="655" style="fill:#be123c">All reserved → defensive “server busy”</text>
  <text class="small" x="578" y="679" style="fill:#be123c">Capacity invariant should prevent this</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="1002" y="164" width="383" height="548" rx="24" fill="#ffffff" stroke="#ddd6fe" stroke-width="3"/>
  </g>
  <rect x="1002" y="164" width="383" height="68" rx="24" fill="#ede9fe"/>
  <path d="M 1002 208 Q 1002 232 1026 232 H 1361 Q 1385 232 1385 208" fill="#ede9fe"/>
  <text class="eyebrow" x="1030" y="192" fill="#6d28d9">STAGE 3</text>
  <text class="stage" x="1030" y="220">SCHEDULE + WAIT</text>

  <rect x="1028" y="261" width="331" height="128" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="eyebrow" x="1048" y="288" fill="#6d28d9">CHAT JOB</text>
  <text class="mono" x="1048" y="318">ctx · prompt · params</text>
  <text class="mono" x="1048" y="344">reply channel</text>
  <text class="mono" x="1048" y="370">reserved IMC session</text>

  <path d="M 1193 401 L 1193 424" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1028" y="436" width="331" height="63" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text class="mono compact" x="1048" y="464">requestQ: NSeqMax × QueueDepth</text>
  <text class="small" x="1048" y="488">bounded handoff channel</text>

  <path d="M 1193 511 L 1193 530" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1028" y="542" width="331" height="63" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text class="mono compact" x="1048" y="570">pendingJobs: FIFO waiting list</text>
  <text class="small" x="1048" y="594">scheduler chooses first inactive slot</text>

  <rect x="1028" y="622" width="331" height="70" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="eyebrow" x="1048" y="647" fill="#c2410c">NO SLOT-WAIT TIMER</text>
  <text class="small" x="1048" y="675">Wait ends on slot, ctx, or shutdown</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="1472" y="164" width="383" height="548" rx="24" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
  </g>
  <rect x="1472" y="164" width="383" height="68" rx="24" fill="#dcfce7"/>
  <path d="M 1472 208 Q 1472 232 1496 232 H 1831 Q 1855 232 1855 208" fill="#dcfce7"/>
  <text class="eyebrow" x="1500" y="192" fill="#15803d">STAGE 4</text>
  <text class="stage" x="1500" y="220">EXECUTE + RELEASE</text>

  <text class="body" x="1500" y="272">Exactly NSeqMax execution slots</text>
  <text class="small" x="1500" y="300">Each slot owns one fixed llama seqID</text>

  <rect x="1498" y="329" width="331" height="67" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text class="mono" x="1518" y="357">Slot 0 · seqID 0</text>
  <text class="small" x="1518" y="383">busy: Job A</text>

  <rect x="1498" y="414" width="331" height="82" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
  <text class="mono" x="1518" y="445">Slot 1 · seqID 1</text>
  <text class="body" x="1518" y="477">IDLE ← assign next Job</text>

  <rect x="1498" y="514" width="331" height="67" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text class="mono" x="1518" y="542">Slot 2 · seqID 2</text>
  <text class="small" x="1518" y="568">busy: Job B</text>

  <path d="M 1663 593 L 1663 620" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1498" y="632" width="331" height="54" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="small" x="1518" y="655">Bind reserved session → slot seqID</text>
  <text class="small" x="1518" y="677">restore KV → prefill → generate</text>

  <!-- Semantic distinction -->
  <rect x="62" y="758" width="1793" height="167" rx="22" fill="#0f172a"/>
  <text class="eyebrow" x="92" y="791" fill="#5eead4">THE KEY DISTINCTION</text>

  <rect x="92" y="811" width="505" height="86" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text class="stage white" x="116" y="842">IMC SESSION</text>
  <text class="small white" x="116" y="870">Reusable conversation/KV identity in host storage</text>
  <text class="small" x="116" y="891" style="fill:#bfdbfe">Reserved before scheduling · reusable across slots</text>

  <text x="625" y="866" style="font:700 42px Inter, sans-serif; fill:#94a3b8">≠</text>

  <rect x="682" y="811" width="505" height="86" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text class="stage white" x="706" y="842">EXECUTION SLOT</text>
  <text class="small white" x="706" y="870">One active request and one fixed llama seqID</text>
  <text class="small" x="706" y="891" style="fill:#bbf7d0">Assigned by scheduler; released when request finishes</text>

  <rect x="1272" y="811" width="553" height="86" rx="14" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <text class="stage white" x="1296" y="842">WAITING FOR A SLOT</text>
  <text class="small white" x="1296" y="870">No separate timeout applies to pendingJobs</text>
  <text class="small" x="1296" y="891" style="fill:#fed7aa">Inference deadline and client cancellation bound this wait</text>

  <!-- Completion lane -->
  <path d="M 1664 713 L 1664 738 L 254 738 L 254 716" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <rect x="593" y="720" width="740" height="36" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="note" x="618" y="744">finish: unbind session if used · clear seqID · free slot · release admission permit</text>

  <!-- Footnotes -->
  <text class="small" x="72" y="974">InferenceTimeout (default 60m) starts at route entry and bounds all four stages; AdmissionTimeout (default 3m) bounds only the permit wait.</text>
  <text class="small" x="72" y="1002">The IMC pool is at least as large as admission capacity, so the all-reserved busy branch is defensive rather than expected during normal operation.</text>
  <text class="small muted" x="72" y="1043">Kronk request scheduling semantics · source: sdk/kronk/{admission.go,model/chat.go,model/caching_imc_tokens.go,model/batch_*}</text>
</svg>
