<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Generation Request from Host Planning to Model Execution</title>
  <desc id="desc">A high-level generation lifecycle divided by hardware responsibility. The host CPU receives and admits the request, renders and plans the prompt, reserves a compatible session, submits the job, and waits for a slot. Once assigned, session state is restored into the GPU KV cache, uncached prompt tokens are prefetched, and generation inference runs on the GPU. Parsing and stream delivery run on the host CPU. Cleanup clears GPU model state and releases host resources.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .phase { font: 700 27px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .badge { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.8px; text-anchor: middle; dominant-baseline: middle; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="64" y="70">GENERATION INFERENCE LIFECYCLE</text>
  <text class="subtitle" x="64" y="110">The host CPU plans and schedules. Model weights, KV cache, prefill, and inference live on the GPU.</text>

  <!-- Phase 1: CPU host orchestration. -->
  <rect x="50" y="150" width="1820" height="350" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <rect x="50" y="150" width="1820" height="72" rx="28" fill="#dbeafe"/>
  <path d="M 50 190 Q 50 222 82 222 H 1838 Q 1870 222 1870 190" fill="#dbeafe"/>
  <text class="eyebrow" x="82" y="180" fill="#1d4ed8">PHASE 1 · CPU</text>
  <text class="phase" x="82" y="210">HOST PLANNING + SCHEDULING</text>

  <!-- CPU connectors. -->
  <path d="M 322 353 H 344" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 617 353 H 639" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 912 353 H 934" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1207 353 H 1229" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1502 353 H 1524" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- CPU stage cards. -->
  <g filter="url(#shadow)">
    <rect x="72" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="367" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="662" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="957" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1252" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1547" y="254" width="250" height="198" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <circle cx="104" cy="286" r="18" fill="#2563eb"/><text x="99" y="293" style="font:700 18px Inter,sans-serif" class="white">1</text>
  <text class="heading" x="132" y="283">Receive</text>
  <text class="heading" x="132" y="309">Chat Request</text>
  <text class="body" x="96" y="347">API or SDK call</text>
  <text class="body" x="96" y="377">Carry caller context</text>
  <rect x="96" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="131" y="414" fill="#1d4ed8">CPU</text>

  <circle cx="399" cy="286" r="18" fill="#2563eb"/><text x="394" y="293" style="font:700 18px Inter,sans-serif" class="white">2</text>
  <text class="heading" x="427" y="283">Acquire</text>
  <text class="heading" x="427" y="309">Admission</text>
  <text class="body" x="391" y="347">Wait only when full</text>
  <text class="body" x="391" y="377">Hold permit to finish</text>
  <rect x="391" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="426" y="414" fill="#1d4ed8">CPU</text>

  <circle cx="694" cy="286" r="18" fill="#2563eb"/><text x="689" y="293" style="font:700 18px Inter,sans-serif" class="white">3</text>
  <text class="heading" x="722" y="283">Render + Plan</text>
  <text class="heading" x="722" y="309">Prompt</text>
  <text class="body" x="686" y="347">Jinja template</text>
  <text class="body" x="686" y="377">Tokens or media plan</text>
  <rect x="686" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="721" y="414" fill="#1d4ed8">CPU</text>

  <circle cx="989" cy="286" r="18" fill="#2563eb"/><text x="984" y="293" style="font:700 18px Inter,sans-serif" class="white">4</text>
  <text class="heading" x="1017" y="283">Select IMC</text>
  <text class="heading" x="1017" y="309">Session</text>
  <text class="body" x="981" y="347">Choose reusable state</text>
  <text class="body" x="981" y="377">Reserve before submit</text>
  <rect x="981" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="1016" y="414" fill="#1d4ed8">CPU</text>

  <circle cx="1284" cy="286" r="18" fill="#2563eb"/><text x="1279" y="293" style="font:700 18px Inter,sans-serif" class="white">5</text>
  <text class="heading" x="1312" y="283">Submit</text>
  <text class="heading" x="1312" y="309">Prepared Job</text>
  <text class="body" x="1276" y="347">Handoff to scheduler</text>
  <text class="body" x="1276" y="377">Keep reservation held</text>
  <rect x="1276" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="1311" y="414" fill="#1d4ed8">CPU</text>

  <circle cx="1579" cy="286" r="18" fill="#2563eb"/><text x="1574" y="293" style="font:700 18px Inter,sans-serif" class="white">6</text>
  <text class="heading" x="1607" y="283">Wait for</text>
  <text class="heading" x="1607" y="309">Execution Slot</text>
  <text class="body" x="1571" y="347">First free sequence</text>
  <text class="body" x="1571" y="377">Then execution starts</text>
  <rect x="1571" y="398" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="1606" y="414" fill="#1d4ed8">CPU</text>

  <!-- Handoff between phases. -->
  <path d="M 960 500 V 544" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="820" y="505" width="280" height="34" rx="17" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text class="eyebrow" x="960" y="528" text-anchor="middle" fill="#b45309">SLOT ASSIGNED</text>

  <!-- Phase 2: model execution. -->
  <rect x="50" y="544" width="1820" height="300" rx="28" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <rect x="50" y="544" width="1820" height="72" rx="28" fill="#ccfbf1"/>
  <path d="M 50 584 Q 50 616 82 616 H 1838 Q 1870 616 1870 584" fill="#ccfbf1"/>
  <text class="eyebrow" x="82" y="574" fill="#0f766e">PHASE 2 · GPU MODEL + CPU RESPONSE</text>
  <text class="phase" x="82" y="604">EXECUTE IN THE ASSIGNED SLOT</text>

  <!-- Model connectors. -->
  <path d="M 467 727 H 499" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 907 727 H 939" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 1347 727 H 1379" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="644" width="385" height="166" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
    <rect x="522" y="644" width="385" height="166" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <rect x="962" y="644" width="385" height="166" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <rect x="1402" y="644" width="385" height="166" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <circle cx="116" cy="678" r="18" fill="#7c3aed"/><text x="111" y="685" style="font:700 18px Inter,sans-serif" class="white">7</text>
  <text class="heading" x="146" y="685">Restore Session State</text>
  <text class="body" x="106" y="727">Snapshot → GPU KV cache</text>
  <rect x="106" y="758" width="136" height="32" rx="10" fill="#f5f3ff"/><text class="badge" x="174" y="774" fill="#6d28d9">GPU MEMORY</text>

  <circle cx="556" cy="678" r="18" fill="#0f766e"/><text x="551" y="685" style="font:700 18px Inter,sans-serif" class="white">8</text>
  <text class="heading" x="586" y="685">Prefill Uncached Tokens</text>
  <text class="body" x="546" y="727">Forward pass over new prompt</text>
  <rect x="546" y="758" width="136" height="32" rx="10" fill="#dcfce7"/><text class="badge" x="614" y="774" fill="#15803d">GPU COMPUTE</text>

  <circle cx="996" cy="678" r="18" fill="#0f766e"/><text x="991" y="685" style="font:700 18px Inter,sans-serif" class="white">9</text>
  <text class="heading" x="1026" y="685">Run Generation Inference</text>
  <text class="body" x="986" y="727">Forward pass + sample next token</text>
  <rect x="986" y="758" width="136" height="32" rx="10" fill="#dcfce7"/><text class="badge" x="1054" y="774" fill="#15803d">GPU COMPUTE</text>

  <circle cx="1436" cy="678" r="18" fill="#2563eb"/><text x="1426" y="685" style="font:700 17px Inter,sans-serif" class="white">10</text>
  <text class="heading" x="1466" y="685">Parse + Stream Response</text>
  <text class="body" x="1426" y="727">Tools, reasoning, and events</text>
  <rect x="1426" y="758" width="70" height="32" rx="10" fill="#dbeafe"/><text class="badge" x="1461" y="774" fill="#1d4ed8">CPU</text>

  <!-- Phase 3: cleanup. -->
  <path d="M 960 844 V 872" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="50" y="884" width="1820" height="132" rx="26" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text class="eyebrow" x="82" y="918" fill="#c2410c">PHASE 3 · CPU + GPU</text>
  <text class="phase" x="82" y="954">FINISH + CLEANUP</text>
  <text class="body" x="420" y="932">Clear slot sequence and GPU KV state</text>
  <text class="body" x="420" y="970">Release slot, session reservation, and admission permit</text>
  <text class="body" x="1120" y="932">Close the response stream</text>
  <text class="body" x="1120" y="970">Ready the slot for the next job</text>

  <text class="body" x="64" y="1056">This view assumes model weights and KV cache reside on the GPU. Orchestration, parsing, and stream delivery remain host CPU work.</text>
</svg>
