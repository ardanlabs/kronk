<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kronk inference from architecture to token generation</title>
  <desc id="desc">A seven-step talk roadmap covering Kronk architecture, the generation and inference lifecycle, request movement through admission and scheduling, chat template rendering, IMC session selection, prefill batching, and the token generation loop.</desc>

  <defs>
    <filter id="shadow" x="-12%" y="-8%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.1px; }
      .heading { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .number { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .phase { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; }
      .footer { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="60" y="70">KRONK INFERENCE: FROM ARCHITECTURE TO TOKENS</text>
  <text class="subtitle" x="60" y="108">A seven-step guide from system boundaries to the generation loop.</text>

  <!-- Step connectors -->
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 287 525 H 307"/>
    <path d="M 542 525 H 562"/>
    <path d="M 797 525 H 817"/>
    <path d="M 1052 525 H 1072"/>
    <path d="M 1307 525 H 1327"/>
    <path d="M 1562 525 H 1582"/>
  </g>

  <!-- Step 1: architecture -->
  <g filter="url(#shadow)">
    <rect x="60" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <circle cx="172.5" cy="215" r="29" fill="#2563eb"/>
  <text class="number" x="172.5" y="224" text-anchor="middle">1</text>
  <text class="eyebrow" x="172.5" y="274" text-anchor="middle" fill="#1d4ed8">SYSTEM MAP</text>
  <text class="heading" x="172.5" y="326" text-anchor="middle">
    <tspan x="172.5">KRONK</tspan>
    <tspan x="172.5" dy="30">ARCHITECTURE</tspan>
  </text>
  <rect x="88" y="413" width="169" height="176" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="119" y="446" width="107" height="25" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="104" y="488" width="137" height="25" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="119" y="530" width="107" height="25" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <path d="M 172 471 V 488 M 172 513 V 530" stroke="#2563eb" stroke-width="3"/>
  <text class="body" x="172.5" y="652" text-anchor="middle">
    <tspan x="172.5">Locate APIs, SDKs,</tspan>
    <tspan x="172.5" dy="28">model pools, engines,</tspan>
    <tspan x="172.5" dy="28">and hardware.</tspan>
  </text>

  <!-- Step 2: generation lifecycle -->
  <g filter="url(#shadow)">
    <rect x="315" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
  </g>
  <circle cx="427.5" cy="215" r="29" fill="#7c3aed"/>
  <text class="number" x="427.5" y="224" text-anchor="middle">2</text>
  <text class="eyebrow" x="427.5" y="274" text-anchor="middle" fill="#6d28d9">EXECUTION MAP</text>
  <text class="heading" x="427.5" y="326" text-anchor="middle">
    <tspan x="427.5">GENERATION &amp;</tspan>
    <tspan x="427.5" dy="30">INFERENCE</tspan>
    <tspan x="427.5" dy="30">LIFECYCLE</tspan>
  </text>
  <rect x="343" y="413" width="169" height="176" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="367" y="443" width="121" height="35" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="427.5" y="467" text-anchor="middle" style="font:700 16px Inter, sans-serif; fill:#6d28d9">CPU</text>
  <path d="M 427.5 478 V 500" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="367" y="509" width="121" height="50" rx="9" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="427.5" y="530" text-anchor="middle" style="font:700 15px Inter, sans-serif; fill:#6d28d9">GPU COMPUTE</text>
  <text x="427.5" y="549" text-anchor="middle" style="font:600 13px Inter, sans-serif; fill:#6d28d9">+ MEMORY</text>
  <text class="body" x="427.5" y="652" text-anchor="middle">
    <tspan x="427.5">See where work runs:</tspan>
    <tspan x="427.5" dy="28">CPU, GPU compute,</tspan>
    <tspan x="427.5" dy="28">and GPU memory.</tspan>
  </text>

  <!-- Step 3: request lifecycle -->
  <g filter="url(#shadow)">
    <rect x="570" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#2dd4bf" stroke-width="3"/>
  </g>
  <circle cx="682.5" cy="215" r="29" fill="#0f766e"/>
  <text class="number" x="682.5" y="224" text-anchor="middle">3</text>
  <text class="eyebrow" x="682.5" y="274" text-anchor="middle" fill="#0f766e">REQUEST FLOW</text>
  <text class="heading" x="682.5" y="326" text-anchor="middle">
    <tspan x="682.5">REQUEST</tspan>
    <tspan x="682.5" dy="30">LIFECYCLE</tspan>
  </text>
  <rect x="598" y="413" width="169" height="176" rx="18" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <rect x="620" y="445" width="31" height="31" rx="6" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="667" y="445" width="31" height="31" rx="6" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="714" y="445" width="31" height="31" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <path d="M 635 476 V 512 H 682" stroke="#0f766e" stroke-width="3" fill="none"/>
  <path d="M 682 476 V 512" stroke="#0f766e" stroke-width="3"/>
  <path d="M 729 476 V 512 H 682" stroke="#0f766e" stroke-width="3" fill="none"/>
  <rect x="643" y="512" width="79" height="45" rx="9" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
  <text x="682.5" y="541" text-anchor="middle" style="font:700 15px Inter, sans-serif; fill:#115e59">SLOTS</text>
  <text class="body" x="682.5" y="652" text-anchor="middle">
    <tspan x="682.5">Follow admission,</tspan>
    <tspan x="682.5" dy="28">queues, jobs, and</tspan>
    <tspan x="682.5" dy="28">execution slots.</tspan>
  </text>

  <!-- Step 4: template protocol -->
  <g filter="url(#shadow)">
    <rect x="825" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <circle cx="937.5" cy="215" r="29" fill="#2563eb"/>
  <text class="number" x="937.5" y="224" text-anchor="middle">4</text>
  <text class="eyebrow" x="937.5" y="274" text-anchor="middle" fill="#1d4ed8">PROMPT FORMAT</text>
  <text class="heading" x="937.5" y="326" text-anchor="middle">
    <tspan x="937.5">CHAT TEMPLATE</tspan>
    <tspan x="937.5" dy="30">PROTOCOL</tspan>
  </text>
  <rect x="853" y="413" width="169" height="176" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="872" y="452" width="58" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <path d="M 887 471 H 915 M 887 485 H 915 M 887 499 H 907" stroke="#2563eb" stroke-width="3"/>
  <path d="M 938 484 H 962" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="969" y="452" width="34" height="64" rx="9" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="986" y="491" text-anchor="middle" style="font:700 20px ui-monospace, monospace; fill:#1d4ed8">T</text>
  <text class="body" x="937.5" y="652" text-anchor="middle">
    <tspan x="937.5">Turn messages and</tspan>
    <tspan x="937.5" dy="28">tools into the exact</tspan>
    <tspan x="937.5" dy="28">model prompt.</tspan>
  </text>

  <!-- Step 5: IMC selection -->
  <g filter="url(#shadow)">
    <rect x="1080" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#2dd4bf" stroke-width="3"/>
  </g>
  <circle cx="1192.5" cy="215" r="29" fill="#0f766e"/>
  <text class="number" x="1192.5" y="224" text-anchor="middle">5</text>
  <text class="eyebrow" x="1192.5" y="274" text-anchor="middle" fill="#0f766e">REUSE PLANNING</text>
  <text class="heading" x="1192.5" y="326" text-anchor="middle">
    <tspan x="1192.5">IMC SESSION</tspan>
    <tspan x="1192.5" dy="30">SELECTION</tspan>
  </text>
  <rect x="1108" y="413" width="169" height="176" rx="18" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <rect x="1129" y="451" width="127" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <rect x="1129" y="489" width="93" height="26" rx="6" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="1129" y="527" width="112" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <path d="M 1231 497 L 1239 505 L 1256 486" stroke="#047857" stroke-width="4" fill="none"/>
  <text class="body" x="1192.5" y="652" text-anchor="middle">
    <tspan x="1192.5">Choose the longest</tspan>
    <tspan x="1192.5" dy="28">safe reusable</tspan>
    <tspan x="1192.5" dy="28">prompt prefix.</tspan>
  </text>

  <!-- Step 6: prefill -->
  <g filter="url(#shadow)">
    <rect x="1335" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
  </g>
  <circle cx="1447.5" cy="215" r="29" fill="#7c3aed"/>
  <text class="number" x="1447.5" y="224" text-anchor="middle">6</text>
  <text class="eyebrow" x="1447.5" y="274" text-anchor="middle" fill="#6d28d9">PROMPT COMPUTE</text>
  <text class="heading" x="1447.5" y="326" text-anchor="middle">
    <tspan x="1447.5">PREFILL &amp;</tspan>
    <tspan x="1447.5" dy="30">BATCHING</tspan>
  </text>
  <rect x="1363" y="413" width="169" height="176" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <g fill="#ddd6fe" stroke="#7c3aed" stroke-width="2">
    <rect x="1384" y="455" width="28" height="28" rx="5"/>
    <rect x="1420" y="455" width="28" height="28" rx="5"/>
    <rect x="1456" y="455" width="28" height="28" rx="5"/>
    <rect x="1384" y="491" width="28" height="28" rx="5"/>
    <rect x="1420" y="491" width="28" height="28" rx="5"/>
  </g>
  <path d="M 1487 487 H 1509 V 543 H 1384 V 527" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text class="body" x="1447.5" y="652" text-anchor="middle">
    <tspan x="1447.5">Restore KV tensors,</tspan>
    <tspan x="1447.5" dy="28">then compute the</tspan>
    <tspan x="1447.5" dy="28">missing prompt state.</tspan>
  </text>

  <!-- Step 7: generation loop -->
  <g filter="url(#shadow)">
    <rect x="1590" y="160" width="225" height="710" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <circle cx="1702.5" cy="215" r="29" fill="#2563eb"/>
  <text class="number" x="1702.5" y="224" text-anchor="middle">7</text>
  <text class="eyebrow" x="1702.5" y="274" text-anchor="middle" fill="#1d4ed8">GENERATE</text>
  <text class="heading" x="1702.5" y="326" text-anchor="middle">
    <tspan x="1702.5">TOKEN</tspan>
    <tspan x="1702.5" dy="30">GENERATION</tspan>
    <tspan x="1702.5" dy="30">LOOP</tspan>
  </text>
  <rect x="1618" y="413" width="169" height="176" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <path d="M 1651 510 A 55 55 0 0 1 1747 470" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1754 492 A 55 55 0 0 1 1658 544" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1682" y="480" width="41" height="41" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="1702.5" y="507" text-anchor="middle" style="font:700 18px ui-monospace, monospace; fill:#1d4ed8">T</text>
  <text class="body" x="1702.5" y="652" text-anchor="middle">
    <tspan x="1702.5">Decode, sample,</tspan>
    <tspan x="1702.5" dy="28">parse, stream,</tspan>
    <tspan x="1702.5" dy="28">and repeat.</tspan>
  </text>

  <!-- Story summary -->
  <rect x="60" y="925" width="1755" height="94" rx="20" fill="#0f172a"/>
  <text class="phase" x="92" y="960" fill="#5eead4">THE END-TO-END JOURNEY</text>
  <text class="footer" x="92" y="994">Architecture → execution map → request flow → prompt format → reusable prefix → prompt compute → token generation</text>
</svg>
