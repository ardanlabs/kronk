<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kronk inference from request to tokens</title>
  <desc id="desc">An eight-part inference roadmap that begins with Kronk architecture, follows a request through the four-stage lifecycle and generation inference map, then details Stage 2 chat templating and IMC prompt planning before explaining Stage 4 prefill batching, ordinary token generation, and speculative decoding.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .group { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; }
      .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="72" y="70">KRONK INFERENCE: FROM REQUEST TO TOKENS</text>
  <text class="subtitle" x="72" y="108">Architecture, resource ownership, request preparation, model execution, and throughput optimization.</text>

  <!-- Overview connectors -->
  <path d="M 630 290 H 672" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1240 290 H 1282" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Slide 1 -->
  <g filter="url(#shadow)"><rect x="70" y="150" width="560" height="280" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/></g>
  <circle cx="112" cy="192" r="24" fill="#2563eb"/><text x="105" y="201" style="font:700 22px Inter, sans-serif" class="white">1</text>
  <text class="eyebrow" x="152" y="184" fill="#1d4ed8">SYSTEM CONTEXT</text>
  <text class="heading" x="152" y="216">SYSTEM ARCHITECTURE</text>
  <rect x="100" y="248" width="500" height="74" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="body" x="128" y="280">Apps → APIs / SDK → native engines → models</text>
  <text class="small" x="128" y="307">System boundaries and execution layers.</text>
  <rect x="100" y="346" width="500" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="124" y="377">chapter-01/kronk-architecture.svg</text>

  <!-- Slide 2 -->
  <g filter="url(#shadow)"><rect x="680" y="150" width="560" height="280" rx="24" fill="#ffffff" stroke="#5eead4" stroke-width="3"/></g>
  <circle cx="722" cy="192" r="24" fill="#0f766e"/><text x="715" y="201" style="font:700 22px Inter, sans-serif" class="white">2</text>
  <text class="eyebrow" x="762" y="184" fill="#0f766e">REQUEST OWNERSHIP</text>
  <text class="heading" x="762" y="216">FOUR-STAGE REQUEST LIFECYCLE</text>
  <rect x="710" y="248" width="500" height="74" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="body" x="738" y="280">Admit → prepare → schedule → execute</text>
  <text class="small" x="738" y="307">Timeouts, ownership, sessions, and slots.</text>
  <rect x="710" y="346" width="500" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="734" y="377">chapter-04/request-lifecycle-stages.svg</text>

  <!-- Slide 3 -->
  <g filter="url(#shadow)"><rect x="1290" y="150" width="560" height="280" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/></g>
  <circle cx="1332" cy="192" r="24" fill="#7c3aed"/><text x="1325" y="201" style="font:700 22px Inter, sans-serif" class="white">3</text>
  <text class="eyebrow" x="1372" y="184" fill="#6d28d9">EXECUTION MAP</text>
  <text class="heading" x="1372" y="216">GENERATION INFERENCE LIFECYCLE</text>
  <rect x="1320" y="248" width="500" height="74" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="body" x="1348" y="280">Host planning → scheduling → slot execution</text>
  <text class="small" x="1348" y="307">The map connecting planning to model compute.</text>
  <rect x="1320" y="346" width="500" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="1344" y="377">chapter-04/generation-inference-lifecycle.svg</text>

  <!-- Group panels -->
  <rect x="70" y="530" width="785" height="400" rx="24" fill="#f8fbff" stroke="#60a5fa" stroke-width="3"/>
  <text class="group" x="100" y="568" fill="#1d4ed8">REQUEST PREPARATION · LIFECYCLE STAGE 2</text>
  <rect x="885" y="530" width="965" height="400" rx="24" fill="#faf8ff" stroke="#a78bfa" stroke-width="3"/>
  <text class="group" x="915" y="568" fill="#6d28d9">MODEL EXECUTION · LIFECYCLE STAGE 4</text>

  <!-- Bottom-row connectors -->
  <path d="M 445 735 H 477" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 855 735 H 912" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1192 735 H 1224" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1517 735 H 1549" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Slide 4 -->
  <g filter="url(#shadow)"><rect x="95" y="595" width="350" height="300" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/></g>
  <circle cx="130" cy="630" r="22" fill="#2563eb"/><text x="123" y="638" style="font:700 20px Inter, sans-serif" class="white">4</text>
  <text class="eyebrow" x="168" y="625" fill="#1d4ed8">TEMPLATE RENDERING</text>
  <text class="heading" x="125" y="680">CHAT TEMPLATE PROTOCOL</text>
  <rect x="125" y="708" width="290" height="78" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="body" x="148" y="740">Portable messages → exact</text>
  <text class="body" x="148" y="768">model-specific prompt syntax</text>
  <rect x="125" y="814" width="290" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="148" y="837">stage2-chat-template-</text>
  <text class="mono" x="148" y="855">protocol.svg</text>

  <!-- Slide 5 -->
  <g filter="url(#shadow)"><rect x="480" y="595" width="350" height="300" rx="20" fill="#ffffff" stroke="#5eead4" stroke-width="2"/></g>
  <circle cx="515" cy="630" r="22" fill="#0f766e"/><text x="508" y="638" style="font:700 20px Inter, sans-serif" class="white">5</text>
  <text class="eyebrow" x="553" y="625" fill="#0f766e">CACHE PLANNING</text>
  <text class="heading" x="510" y="680">IMC PROMPT PLANNING</text>
  <rect x="510" y="708" width="290" height="78" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="body" x="533" y="740">Reuse safe state and</text>
  <text class="body" x="533" y="768">reserve a session</text>
  <rect x="510" y="814" width="290" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="533" y="837">stage2-imc-prompt-</text>
  <text class="mono" x="533" y="855">planning.svg</text>

  <!-- Slide 6 -->
  <g filter="url(#shadow)"><rect x="915" y="595" width="277" height="300" rx="20" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/></g>
  <circle cx="950" cy="630" r="22" fill="#7c3aed"/><text x="943" y="638" style="font:700 20px Inter, sans-serif" class="white">6</text>
  <text class="eyebrow" x="988" y="625" fill="#6d28d9">PREFILL</text>
  <text class="heading" x="945" y="674">PREFILL BATCHING</text>
  <rect x="945" y="708" width="217" height="78" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="body" x="968" y="740">nbatch + nubatch</text>
  <text class="small" x="968" y="768">tray + chunks</text>
  <rect x="945" y="814" width="217" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="966" y="837">stage4-prefill-</text>
  <text class="mono" x="966" y="855">batching.svg</text>

  <!-- Slide 7 -->
  <g filter="url(#shadow)"><rect x="1225" y="595" width="292" height="300" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/></g>
  <circle cx="1260" cy="630" r="22" fill="#2563eb"/><text x="1253" y="638" style="font:700 20px Inter, sans-serif" class="white">7</text>
  <text class="eyebrow" x="1298" y="625" fill="#1d4ed8">ORDINARY GENERATION</text>
  <text class="heading" x="1255" y="664">TOKEN GENERATION</text>
  <text class="heading" x="1255" y="688">LOOP</text>
  <rect x="1255" y="708" width="232" height="78" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="body" x="1278" y="740">Decode → sample</text>
  <text class="body" x="1278" y="768">→ emit → repeat</text>
  <rect x="1255" y="814" width="232" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="1278" y="837">stage4-token-</text>
  <text class="mono" x="1278" y="855">generation-loop.svg</text>

  <!-- Slide 8 -->
  <g filter="url(#shadow)"><rect x="1550" y="595" width="275" height="300" rx="20" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/></g>
  <circle cx="1585" cy="630" r="22" fill="#d97706"/><text x="1578" y="638" style="font:700 20px Inter, sans-serif" class="white">8</text>
  <text class="eyebrow" x="1623" y="625" fill="#b45309">OPTIMIZATION</text>
  <text class="heading" x="1580" y="664">SPECULATIVE</text>
  <text class="heading" x="1580" y="688">DECODING</text>
  <rect x="1580" y="708" width="215" height="78" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="body" x="1603" y="740">Draft several;</text>
  <text class="body" x="1603" y="768">target verifies</text>
  <rect x="1580" y="814" width="215" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="mono" x="1601" y="837">stage4-speculative-</text>
  <text class="mono" x="1601" y="855">decoding.svg</text>

  <!-- Inference story -->
  <rect x="70" y="968" width="1780" height="70" rx="20" fill="#0f172a"/>
  <text class="eyebrow" x="104" y="997" fill="#5eead4">INFERENCE STORY</text>
  <text class="body white" x="104" y="1024">Architecture → resource ownership → execution map → request preparation → model mechanics → throughput optimization</text>
  <text class="small" x="1470" y="1013" style="fill:#94a3b8">From request boundary to tokens</text>
</svg>
