<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kronk Architecture</title>
  <desc id="desc">Applications use Kronk directly through its public Go SDKs or through the Kronk model server and shared model pool. The Kronk SDK uses yzma bindings to run GGUF models with llama.cpp. The Bucky SDK uses Bucky bindings to run speech-to-text models with whisper.cpp. Both branches use FFI and purego and run on compatible native compute backends.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <pattern id="modelPattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#86efac" stroke-width="2" opacity="0.25"/>
    </pattern>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .body { font: 500 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .white { fill: #ffffff; }
      .light { fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="960" y="66" text-anchor="middle">KRONK ARCHITECTURE</text>
  <text class="subtitle" x="960" y="104" text-anchor="middle">Two public Go SDKs, two native inference engines, and one shared compute foundation.</text>

  <!-- Connectors are drawn behind the cards. -->
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 485 235 V 258"/>
    <path d="M 1435 235 V 258"/>
    <path d="M 485 395 V 408"/>
    <path d="M 1435 395 V 408"/>
    <path d="M 485 520 V 548"/>
    <path d="M 1435 520 V 548"/>
    <path d="M 485 700 V 728"/>
    <path d="M 1435 700 V 728"/>
    <path d="M 485 815 V 843"/>
    <path d="M 1435 815 V 843"/>
    <path d="M 485 925 V 938"/>
    <path d="M 1435 925 V 938"/>
  </g>

  <!-- Entry points -->
  <g filter="url(#shadow)">
    <rect x="70" y="135" width="830" height="100" rx="20" fill="#ffffff" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="1020" y="135" width="830" height="100" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <rect x="70" y="135" width="12" height="100" rx="6" fill="#0f766e"/>
  <rect x="1020" y="135" width="12" height="100" rx="6" fill="#2563eb"/>
  <text class="eyebrow" x="485" y="164" text-anchor="middle" fill="#0f766e">EMBEDDED</text>
  <text class="heading" x="485" y="197" text-anchor="middle">YOUR GO APPLICATION</text>
  <text class="small" x="485" y="224" text-anchor="middle">Direct SDK calls or an optional shared model pool</text>
  <text class="eyebrow" x="1435" y="164" text-anchor="middle" fill="#1d4ed8">NETWORK SERVICE</text>
  <text class="heading" x="1435" y="197" text-anchor="middle">KRONK MODEL SERVER</text>
  <text class="small" x="1435" y="224" text-anchor="middle">HTTP APIs · browser UI · security · operations</text>

  <!-- Shared application access -->
  <rect x="70" y="270" width="1780" height="125" rx="22" fill="#0f172a"/>
  <text class="eyebrow" x="960" y="299" text-anchor="middle" fill="#5eead4">APPLICATION ACCESS</text>
  <rect x="100" y="310" width="1720" height="74" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text class="heading white" x="535" y="340" text-anchor="middle">DIRECT SDK ACCESS</text>
  <text class="body light" x="960" y="339" text-anchor="middle">OR</text>
  <text class="heading white" x="1385" y="340" text-anchor="middle">SHARED MODEL POOL</text>
  <text class="small light" x="960" y="370" text-anchor="middle">Embedded applications may choose either path; the model server uses the shared pool.</text>

  <!-- Public SDKs -->
  <g filter="url(#shadow)">
    <rect x="70" y="420" width="830" height="100" rx="20" fill="#ecfeff" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="1020" y="420" width="830" height="100" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <text class="eyebrow" x="485" y="449" text-anchor="middle" fill="#0f766e">PUBLIC GO API</text>
  <text class="heading" x="485" y="482" text-anchor="middle">KRONK SDK</text>
  <text class="small" x="485" y="510" text-anchor="middle">Text · vision · embeddings · reranking</text>
  <text class="eyebrow" x="1435" y="449" text-anchor="middle" fill="#1d4ed8">PUBLIC GO API</text>
  <text class="heading" x="1435" y="482" text-anchor="middle">BUCKY SDK</text>
  <text class="small" x="1435" y="510" text-anchor="middle">Speech-to-text · streaming transcription</text>

  <!-- Native binding layers -->
  <rect x="70" y="560" width="830" height="140" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <rect x="1020" y="560" width="830" height="140" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text class="eyebrow" x="485" y="589" text-anchor="middle" fill="#6d28d9">GO → NATIVE BINDINGS</text>
  <text class="heading" x="485" y="623" text-anchor="middle">YZMA</text>
  <text class="small" x="485" y="652" text-anchor="middle">Go bindings for llama.cpp</text>
  <rect x="105" y="662" width="360" height="30" rx="9" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="505" y="662" width="360" height="30" rx="9" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text class="mono" x="285" y="677" text-anchor="middle" dominant-baseline="middle">FFI</text>
  <text class="mono" x="685" y="677" text-anchor="middle" dominant-baseline="middle">PUREGO</text>

  <text class="eyebrow" x="1435" y="589" text-anchor="middle" fill="#6d28d9">GO → NATIVE BINDINGS</text>
  <text class="heading" x="1435" y="623" text-anchor="middle">BUCKY</text>
  <text class="small" x="1435" y="652" text-anchor="middle">Go bindings for whisper.cpp</text>
  <rect x="1055" y="662" width="360" height="30" rx="9" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="1455" y="662" width="360" height="30" rx="9" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text class="mono" x="1235" y="677" text-anchor="middle" dominant-baseline="middle">FFI</text>
  <text class="mono" x="1635" y="677" text-anchor="middle" dominant-baseline="middle">PUREGO</text>

  <!-- Native inference engines -->
  <rect x="70" y="740" width="830" height="75" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <rect x="1020" y="740" width="830" height="75" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text class="eyebrow" x="485" y="768" text-anchor="middle" fill="#c2410c">NATIVE INFERENCE ENGINE</text>
  <text class="heading" x="485" y="801" text-anchor="middle">llama.cpp</text>
  <text class="eyebrow" x="1435" y="768" text-anchor="middle" fill="#c2410c">NATIVE INFERENCE ENGINE</text>
  <text class="heading" x="1435" y="801" text-anchor="middle">whisper.cpp</text>

  <!-- Model artifacts -->
  <rect x="70" y="855" width="830" height="70" rx="16" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/>
  <rect x="1020" y="855" width="830" height="70" rx="16" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/>
  <rect x="70" y="855" width="830" height="70" rx="16" fill="url(#modelPattern)"/>
  <rect x="1020" y="855" width="830" height="70" rx="16" fill="url(#modelPattern)"/>
  <text class="eyebrow" x="485" y="882" text-anchor="middle" fill="#15803d">MODEL ARTIFACTS</text>
  <text class="heading" x="485" y="914" text-anchor="middle">GGUF MODELS</text>
  <text class="eyebrow" x="1435" y="882" text-anchor="middle" fill="#15803d">MODEL ARTIFACTS</text>
  <text class="heading" x="1435" y="914" text-anchor="middle">WHISPER MODELS</text>

  <!-- Shared native compute foundation -->
  <rect x="70" y="950" width="1780" height="110" rx="20" fill="#0f172a"/>
  <text class="eyebrow" x="960" y="977" text-anchor="middle" fill="#86efac">NATIVE COMPUTE BACKENDS</text>
  <text class="heading white" x="960" y="1014" text-anchor="middle">CPU · METAL · CUDA · VULKAN · ROCm</text>
  <text class="small light" x="960" y="1043" text-anchor="middle">Availability depends on the engine, platform, and installed native library bundle.</text>
</svg>
