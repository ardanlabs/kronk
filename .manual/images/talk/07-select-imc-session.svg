<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">One OpenCode Session, Three Requests</title>
  <desc id="desc">Three sequential requests resend a growing conversation. Request one creates an IMC entry for System and User 1. Request two matches all saved token IDs, restores the corresponding model state, computes Assistant 1 and User 2, and saves a larger snapshot. Request three repeats this with Assistant 2 and User 3. Token IDs identify a complete reusable prefix; the saved snapshot contains KV state and, for hybrid models, recurrent state. Assistant replies enter the cache only when sent back as input on the next request. The generation-only tail is omitted. If no working entry matches, Kronk tries a system-only snapshot; if that also misses, it computes the full prompt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      .title{font:700 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a;letter-spacing:.4px}
      .subtitle{font:400 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .heading{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}
      .body{font:500 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334155}
      .small{font:500 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .eyebrow{font:700 20px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#475569}
      .message{font:600 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff;text-anchor:middle}
      .token{font:600 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff;text-anchor:middle}
      .green{fill:#15803d}.blue{fill:#1d4ed8}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="70" y="68">ONE OPENCODE SESSION, THREE REQUESTS</text>
  <text class="subtitle" x="70" y="111">Each request resends the conversation. IMC reuses the work already done.</text>

  <text class="eyebrow" x="300" y="171">COMPARE TOKEN IDs</text>
  <rect x="635" y="150" width="22" height="22" rx="4" fill="#15803d"/>
  <text class="small" x="668" y="170">Saved prefix</text>
  <rect x="830" y="150" width="22" height="22" rx="4" fill="#2563eb"/>
  <text class="small" x="863" y="170">New input</text>
  <text class="eyebrow" x="1300" y="171">SAVE MODEL STATE</text>
  <text class="small" x="1300" y="201">KV + recurrent state for hybrid models</text>

  <!-- Request 1: no existing conversation snapshot. -->
  <rect x="70" y="225" width="1780" height="200" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="105" y="269">REQUEST 1</text>
  <text class="body" x="105" y="310">Start the</text>
  <text class="body" x="105" y="340">conversation</text>
  <rect x="300" y="255" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="366" y="285">System</text><text class="token" x="366" y="319">10 11 …</text>
  <rect x="442" y="255" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="508" y="285">User 1</text><text class="token" x="508" y="319">20 21 …</text>
  <text class="body blue" x="300" y="385">Compute the input → create a cache entry</text>
  <path d="M1180 300H1260" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1290" y="247" width="530" height="156" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="1315" y="283">Snapshot 1</text>
  <rect x="1315" y="302" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1395" y="302" width="72" height="30" rx="5" fill="#0f766e"/>
  <text class="body" x="1315" y="375">State after System + User 1</text>

  <!-- Request 2: all of snapshot 1 matches; append new input. -->
  <rect x="70" y="450" width="1780" height="200" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="105" y="494">REQUEST 2</text>
  <text class="body" x="105" y="535">Continue the</text>
  <text class="body" x="105" y="565">conversation</text>
  <rect x="300" y="480" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="366" y="510">System</text><text class="token" x="366" y="544">10 11 …</text>
  <rect x="442" y="480" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="508" y="510">User 1</text><text class="token" x="508" y="544">20 21 …</text>
  <rect x="584" y="480" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="650" y="510">Assistant 1</text><text class="token" x="650" y="544">30 31 …</text>
  <rect x="726" y="480" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="792" y="510">User 2</text><text class="token" x="792" y="544">40 41 …</text>
  <path d="M300 572V580H574V572" fill="none" stroke="#15803d" stroke-width="2"/>
  <text class="body" x="300" y="610"><tspan class="green">Prefix matches → restore Snapshot 1</tspan><tspan> → compute blue input</tspan></text>
  <path d="M1180 525H1260" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1290" y="472" width="530" height="156" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="1315" y="508">Snapshot 2 · same entry, larger state</text>
  <rect x="1315" y="527" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1395" y="527" width="72" height="30" rx="5" fill="#0f766e"/>
  <rect x="1475" y="527" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1555" y="527" width="72" height="30" rx="5" fill="#0f766e"/>
  <text class="body" x="1315" y="600">State through User 2</text>

  <!-- Request 3: the complete larger prefix matches again. -->
  <rect x="70" y="675" width="1780" height="200" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="105" y="719">REQUEST 3</text>
  <text class="body" x="105" y="760">Continue the</text>
  <text class="body" x="105" y="790">conversation</text>
  <rect x="300" y="705" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="366" y="735">System</text><text class="token" x="366" y="769">10 11 …</text>
  <rect x="442" y="705" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="508" y="735">User 1</text><text class="token" x="508" y="769">20 21 …</text>
  <rect x="584" y="705" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="650" y="735">Assistant 1</text><text class="token" x="650" y="769">30 31 …</text>
  <rect x="726" y="705" width="132" height="83" rx="10" fill="#15803d"/>
  <text class="message" x="792" y="735">User 2</text><text class="token" x="792" y="769">40 41 …</text>
  <rect x="868" y="705" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="934" y="735">Assistant 2</text><text class="token" x="934" y="769">50 51 …</text>
  <rect x="1010" y="705" width="132" height="83" rx="10" fill="#2563eb"/>
  <text class="message" x="1076" y="735">User 3</text><text class="token" x="1076" y="769">60 61 …</text>
  <path d="M300 797V805H858V797" fill="none" stroke="#15803d" stroke-width="2"/>
  <text class="body" x="300" y="835"><tspan class="green">Prefix matches → restore Snapshot 2</tspan><tspan> → compute blue input</tspan></text>
  <path d="M1180 750H1260" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1290" y="697" width="530" height="156" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="1315" y="733">Snapshot 3 · same entry, larger state</text>
  <rect x="1315" y="752" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1395" y="752" width="72" height="30" rx="5" fill="#0f766e"/>
  <rect x="1475" y="752" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1555" y="752" width="72" height="30" rx="5" fill="#0f766e"/>
  <rect x="1635" y="752" width="72" height="30" rx="5" fill="#0f766e"/><rect x="1715" y="752" width="72" height="30" rx="5" fill="#0f766e"/>
  <text class="body" x="1315" y="825">State through User 3</text>

  <text class="small" x="70" y="918">Illustrative token IDs; message blocks include template tokens. Input is saved before generation; the generation-only tail is not shown.</text>
  <rect x="70" y="947" width="1780" height="98" rx="18" fill="#0f172a"/>
  <text class="heading white" x="105" y="985">Tokens decide what matches. Saved state is what Phase I prefill restores.</text>
  <text class="body white" x="105" y="1020">No working prefix matches? → Try system-only state → If that misses too, compute the full prompt.</text>
</svg>
