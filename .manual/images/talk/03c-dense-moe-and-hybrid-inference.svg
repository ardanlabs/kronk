<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Independent Dimensions of Model Design</title>
  <desc id="desc">An educational grid crosses Dense and Mixture-of-Experts parameter activation with attention-only, recurrent/state-space-only, and hybrid sequence processing. All six combinations are conceptually possible; this is not a catalog of supported models. Architecture identifies the specific overall design, not a third mutually exclusive model type.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 700 40px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 27px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .label { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.5px; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="10" fill="#0f766e"/>
  <text class="title" x="54" y="65">MODEL DESIGN: INDEPENDENT DIMENSIONS, NOT THREE TYPES</text>
  <text class="subtitle" x="54" y="108">Ask two separate questions: which weights activate, and how does the model process earlier tokens?</text>

  <g filter="url(#shadow)">
    <rect x="40" y="145" width="1840" height="596" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="470" y="160" width="670" height="120" rx="16" fill="#cffafe"/>
  <rect x="1160" y="160" width="700" height="120" rx="16" fill="#fef3c7"/>
  <text class="label" x="64" y="187" fill="#6d28d9">SEQUENCE PROCESSING ↓</text>
  <text class="label" x="64" y="221" fill="#0e7490">PARAMETER ACTIVATION →</text>
  <text class="heading" x="496" y="201">DENSE</text>
  <text class="small" x="496" y="239">Complete feed-forward network used per token</text>
  <text class="heading" x="1186" y="201">MIXTURE OF EXPERTS (MoE)</text>
  <text class="small" x="1186" y="239">Router selects a subset of feed-forward experts</text>

  <rect x="56" y="296" width="390" height="128" rx="14" fill="#f5f3ff"/>
  <text class="heading" x="78" y="337">Attention-only</text>
  <text class="small" x="78" y="375">Access earlier tokens with</text>
  <text class="small" x="78" y="404">full, windowed, or sparse attention</text>
  <rect x="470" y="296" width="670" height="128" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="heading" x="496" y="343">Attention + dense feed-forward</text>
  <text class="body" x="496" y="387">No routed expert selection</text>
  <rect x="1160" y="296" width="700" height="128" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="heading" x="1186" y="343">Attention + MoE feed-forward</text>
  <text class="body" x="1186" y="387">Expert routing does not make it recurrent</text>

  <rect x="56" y="440" width="390" height="128" rx="14" fill="#f5f3ff"/>
  <text class="heading" x="78" y="478">Recurrent /</text>
  <text class="heading" x="78" y="510">state-space-only</text>
  <text class="small" x="78" y="548">Carry state; no attention layers</text>
  <rect x="470" y="440" width="670" height="128" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="heading" x="496" y="487">Recurrent state + dense activation</text>
  <text class="body" x="496" y="531">Recurrent does not automatically mean hybrid</text>
  <rect x="1160" y="440" width="700" height="128" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="heading" x="1186" y="487">Recurrent state + expert routing</text>
  <text class="body" x="1186" y="531">State mechanism and expert choice are separate</text>

  <rect x="56" y="584" width="390" height="140" rx="14" fill="#ede9fe"/>
  <text class="heading" x="78" y="626">Hybrid</text>
  <text class="small" x="78" y="664">Combine attention with</text>
  <text class="small" x="78" y="695">recurrent / state-space mechanisms</text>
  <rect x="470" y="584" width="670" height="140" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="heading" x="496" y="634">Mixed sequence mechanisms + dense</text>
  <text class="body" x="496" y="681">Hybrid does not require experts</text>
  <rect x="1160" y="584" width="700" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="heading" x="1186" y="634">Mixed sequence mechanisms + MoE</text>
  <text class="body" x="1186" y="681">Example: Qwen 3.6, Gated DeltaNet + attention</text>
  <text class="small" x="64" y="778">Conceptual combinations, not a support matrix. Mixing full and windowed attention alone stays attention-only here.</text>

  <rect x="40" y="811" width="1840" height="112" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="68" y="845" fill="#6d28d9">ARCHITECTURE = SPECIFIC OVERALL DESIGN IDENTIFIER</text>
  <text class="body" x="68" y="880">For example, GGUF general.architecture identifies a concrete layout and operations, not a competing third model type.</text>
  <text class="small" x="68" y="909">Inspect the design and metadata to determine its parameter activation and sequence processing.</text>

  <rect x="40" y="953" width="1840" height="88" rx="20" fill="#0f172a"/>
  <text class="label" x="68" y="987" fill="#5eead4">THE TAKEAWAY</text>
  <text x="68" y="1021" style="font:600 25px Inter, ui-sans-serif, system-ui, sans-serif; fill:#ffffff">A model can be both MoE and hybrid. A recurrent-only model is not hybrid just because it carries state.</text>
</svg>
