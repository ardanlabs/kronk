<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Two Prefill Phases Complete the Prompt State</title>
  <desc id="desc">The complete input consists of a cached prefix and an uncached suffix. Phase I restores the saved prefix model state into the assigned execution slot without model compute. The suffix state is still missing. Phase II processes the suffix tokens through the model using the restored prefix. The same slot now holds state for the complete prompt, and the final prefill step supplies logits for selecting the first output token. State blocks are schematic, not token IDs or a physical memory layout; hybrid snapshots also contain recurrent state. Without a compatible cache hit, Phase II computes the full prompt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      .title{font:700 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a;letter-spacing:.4px}
      .subtitle{font:400 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .heading{font:700 30px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}
      .body{font:500 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334155}
      .small{font:500 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .eyebrow{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#475569}
      .token{font:700 27px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff;text-anchor:middle}
      .green{fill:#15803d}.blue{fill:#1d4ed8}.white{fill:#fff}
    </style>
    <!-- State bars are schematic coverage, not token IDs or memory cells. -->
    <g id="prefix-state" fill="#15803d">
      <rect width="88" height="58" rx="9"/><rect x="102" width="88" height="58" rx="9"/>
      <rect x="204" width="88" height="58" rx="9"/><rect x="306" width="88" height="58" rx="9"/>
    </g>
    <g id="suffix-state" fill="#2563eb">
      <rect width="88" height="58" rx="9"/><rect x="102" width="88" height="58" rx="9"/>
      <rect x="204" width="88" height="58" rx="9"/><rect x="306" width="88" height="58" rx="9"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="70" y="68">TWO PREFILL PHASES → ONE COMPLETE PROMPT STATE</text>
  <text class="subtitle" x="70" y="112">Restore what we saved. Compute what is missing. Then start generation.</text>

  <!-- The entire input is known, but only the prefix has saved state. -->
  <rect x="70" y="150" width="1780" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="110" y="202">Complete input prompt</text>
  <text class="body" x="110" y="244">All token IDs are already known.</text>
  <text class="body" x="110" y="278">Not all model state exists yet.</text>
  <text class="eyebrow green" x="810" y="190">CACHED PREFIX</text>
  <text class="eyebrow blue" x="1240" y="190">UNCACHED SUFFIX</text>
  <use href="#prefix-state" x="810" y="209"/>
  <text class="token" x="854" y="247">5</text><text class="token" x="956" y="247">2</text>
  <text class="token" x="1058" y="247">8</text><text class="token" x="1160" y="247">1</text>
  <use href="#suffix-state" x="1240" y="209"/>
  <text class="token" x="1284" y="247">7</text><text class="token" x="1386" y="247">4</text>
  <text class="token" x="1488" y="247">9</text><text class="token" x="1590" y="247">3</text>
  <text class="small" x="810" y="298">Saved state is available</text>
  <text class="small" x="1240" y="298">Includes the generation-ready tail</text>

  <path d="M1222 324V350" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase I leaves the slot with only the restored prefix. -->
  <rect x="70" y="365" width="1780" height="185" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text class="eyebrow green" x="110" y="405">PHASE I · RESTORE</text>
  <text class="heading" x="110" y="448">Copy saved model state</text>
  <text class="body" x="110" y="487">Saved snapshot → assigned execution slot</text>
  <text class="body" x="110" y="524">No model compute for the restored prefix.</text>
  <text class="eyebrow" x="810" y="405">EXECUTION SLOT AFTER PHASE I</text>
  <use href="#prefix-state" x="810" y="429"/>
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6">
    <rect x="1240" y="429" width="88" height="58" rx="9"/><rect x="1342" y="429" width="88" height="58" rx="9"/>
    <rect x="1444" y="429" width="88" height="58" rx="9"/><rect x="1546" y="429" width="88" height="58" rx="9"/>
  </g>
  <text class="body green" x="810" y="524">Prefix state restored</text>
  <text class="body" x="1240" y="524">Suffix state still missing</text>
  <text class="small" x="1685" y="449">Not ready</text>
  <text class="small" x="1685" y="477">to generate</text>

  <path d="M1222 554V585" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase II completes the same slot, not a second independent state. -->
  <rect x="70" y="600" width="1780" height="190" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow blue" x="110" y="640">PHASE II · COMPUTE</text>
  <text class="heading" x="110" y="683">Run only the suffix through the model</text>
  <text class="body" x="110" y="723">Use the restored prefix as context.</text>
  <text class="body" x="110" y="760">Complete the state in the same execution slot.</text>
  <text class="eyebrow" x="810" y="640">SAME EXECUTION SLOT AFTER PHASE II</text>
  <use href="#prefix-state" x="810" y="664"/>
  <use href="#suffix-state" x="1240" y="664"/>
  <text class="body green" x="810" y="760">Restored prefix state</text>
  <text class="body blue" x="1240" y="760">Newly computed suffix state</text>
  <text class="small" x="1685" y="685">Full prompt</text>
  <text class="small" x="1685" y="713">state ready</text>

  <path d="M1222 794V835" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Completion of prefill is the hand-off to token selection. -->
  <rect x="70" y="850" width="1780" height="115" rx="20" fill="#0f172a"/>
  <text class="heading white" x="110" y="895">READY TO START GENERATION</text>
  <text class="body white" x="110" y="937">Complete prompt state + logits from the final prefill step → select the first output token</text>
  <text class="small" x="70" y="1004">State bars show prompt coverage, not token IDs or a physical layout. Model state includes KV and, for hybrid models, recurrent state.</text>
  <text class="body" x="70" y="1047">No compatible cache hit? Nothing to restore; Phase II computes the entire prompt.</text>
</svg>
