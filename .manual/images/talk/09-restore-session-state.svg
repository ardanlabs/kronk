<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Restore Session State</title>
  <desc id="desc">A complete logical prompt is split into a reusable prefix and an uncached request suffix. Phase one copies a compatible IMC snapshot into the assigned slot without running model decode. Phase two decodes only the missing request tokens and appends their KV state to the restored prefix. If there is no compatible IMC snapshot, phase one restores nothing and phase two computes the full prompt.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.4px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .eyebrow { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
      .token { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: middle; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="72" y="67">PREFILL HAS TWO PHASES</text>
  <text class="subtitle" x="72" y="105">Phase I copies reusable KV state. Phase II computes KV state only for request tokens that are still missing.</text>

  <!-- Complete logical prompt -->
  <g filter="url(#shadow)">
    <rect x="70" y="142" width="1778" height="205" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text class="eyebrow" x="108" y="181" fill="#475569">COMPLETE LOGICAL PROMPT</text>
  <text class="small" x="108" y="212">Full token sequence known before prefill.</text>

  <rect x="520" y="172" width="398" height="142" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="heading" x="719" y="205" text-anchor="middle">Reusable prefix</text>
  <text class="small" x="719" y="232" text-anchor="middle">Already represented by a compatible IMC snapshot</text>
  <g>
    <rect x="579" y="252" width="48" height="48" rx="9" fill="#22c55e"/>
    <rect x="641" y="252" width="48" height="48" rx="9" fill="#22c55e"/>
    <rect x="703" y="252" width="48" height="48" rx="9" fill="#22c55e"/>
    <rect x="765" y="252" width="48" height="48" rx="9" fill="#22c55e"/>
    <text class="token white" x="603" y="276">5</text>
    <text class="token white" x="665" y="276">2</text>
    <text class="token white" x="727" y="276">8</text>
    <text class="token white" x="789" y="276">1</text>
  </g>

  <path d="M 950 243 H 988" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>

  <rect x="1020" y="172" width="398" height="142" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="heading" x="1219" y="205" text-anchor="middle">Uncached request suffix</text>
  <text class="small" x="1219" y="232" text-anchor="middle">Token IDs exist, but their KV state does not</text>
  <g>
    <rect x="1079" y="252" width="48" height="48" rx="9" fill="#3b82f6"/>
    <rect x="1141" y="252" width="48" height="48" rx="9" fill="#3b82f6"/>
    <rect x="1203" y="252" width="48" height="48" rx="9" fill="#3b82f6"/>
    <rect x="1265" y="252" width="48" height="48" rx="9" fill="#3b82f6"/>
    <text class="token white" x="1103" y="276">7</text>
    <text class="token white" x="1165" y="276">4</text>
    <text class="token white" x="1227" y="276">9</text>
    <text class="token white" x="1289" y="276">3</text>
  </g>

  <!-- Phase I -->
  <g filter="url(#shadow)">
    <rect x="70" y="382" width="830" height="438" rx="26" fill="#ffffff" stroke="#4ade80" stroke-width="3"/>
  </g>
  <rect x="70" y="382" width="830" height="67" rx="26" fill="#dcfce7"/>
  <path d="M 70 415 Q 70 449 104 449 H 866 Q 900 449 900 415" fill="#dcfce7"/>
  <text class="eyebrow" x="108" y="422" fill="#15803d">PHASE I · IMC RESTORE</text>
  <text class="section" x="390" y="424">COPY REUSABLE STATE</text>

  <rect x="112" y="493" width="292" height="218" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text class="heading" x="258" y="530" text-anchor="middle">Compatible IMC snapshot</text>
  <text class="small" x="258" y="558" text-anchor="middle">Saved target KV state</text>
  <g>
    <rect x="153" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="210" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="267" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="324" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <text class="token white" x="174" y="611.5">5</text>
    <text class="token white" x="231" y="611.5">2</text>
    <text class="token white" x="288" y="611.5">8</text>
    <text class="token white" x="345" y="611.5">1</text>
  </g>
  <text class="small" x="258" y="676" text-anchor="middle">Session store → assigned slot</text>

  <path d="M 424 600 H 515" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="eyebrow" x="469" y="574" fill="#15803d" text-anchor="middle">COPY</text>

  <rect x="535" y="493" width="322" height="218" rx="18" fill="#f8fafc" stroke="#86efac" stroke-width="2"/>
  <text class="heading" x="696" y="530" text-anchor="middle">Assigned slot KV state</text>
  <text class="small" x="696" y="558" text-anchor="middle">The reusable prefix is now resident</text>
  <g>
    <rect x="591" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="648" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="705" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <rect x="762" y="589" width="42" height="45" rx="8" fill="#22c55e"/>
    <text class="token white" x="612" y="611.5">5</text>
    <text class="token white" x="669" y="611.5">2</text>
    <text class="token white" x="726" y="611.5">8</text>
    <text class="token white" x="783" y="611.5">1</text>
  </g>
  <text class="small" x="696" y="676" text-anchor="middle">Ready for the missing suffix</text>

  <rect x="112" y="743" width="745" height="48" rx="12" fill="#14532d"/>
  <text class="body white" x="484.5" y="773" text-anchor="middle">No model decode · no prompt tokens are recomputed</text>

  <!-- Phase transition -->
  <path d="M 920 601 H 995" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Phase II -->
  <g filter="url(#shadow)">
    <rect x="1020" y="382" width="828" height="438" rx="26" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <rect x="1020" y="382" width="828" height="67" rx="26" fill="#dbeafe"/>
  <path d="M 1020 415 Q 1020 449 1054 449 H 1814 Q 1848 449 1848 415" fill="#dbeafe"/>
  <text class="eyebrow" x="1058" y="422" fill="#1d4ed8">PHASE II · REQUEST PREFILL</text>
  <text class="section" x="1357" y="424">COMPUTE MISSING STATE</text>

  <rect x="1058" y="493" width="220" height="218" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="1168" y="530" text-anchor="middle">Request tokens</text>
  <text class="small" x="1168" y="558" text-anchor="middle">Uncached suffix</text>
  <g>
    <rect x="1082" y="589" width="38" height="45" rx="8" fill="#3b82f6"/>
    <rect x="1128" y="589" width="38" height="45" rx="8" fill="#3b82f6"/>
    <rect x="1174" y="589" width="38" height="45" rx="8" fill="#3b82f6"/>
    <rect x="1220" y="589" width="38" height="45" rx="8" fill="#3b82f6"/>
    <text class="token white" x="1101" y="611.5">7</text>
    <text class="token white" x="1147" y="611.5">4</text>
    <text class="token white" x="1193" y="611.5">9</text>
    <text class="token white" x="1239" y="611.5">3</text>
  </g>
  <text class="small" x="1168" y="676" text-anchor="middle">CPU token IDs</text>

  <path d="M 1292 600 H 1340" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="1360" y="493" width="185" height="218" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow" x="1452.5" y="548" fill="#1d4ed8" text-anchor="middle">MODEL</text>
  <text class="heading" x="1452.5" y="593" text-anchor="middle">Decode</text>
  <text class="small" x="1452.5" y="626" text-anchor="middle">Bounded</text>
  <text class="small" x="1452.5" y="651" text-anchor="middle">contributions</text>

  <path d="M 1559 600 H 1607" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="1627" y="493" width="183" height="218" rx="18" fill="#f8fafc" stroke="#2dd4bf" stroke-width="2"/>
  <text class="heading" x="1718.5" y="530" text-anchor="middle">Complete slot</text>
  <text class="small" x="1718.5" y="558" text-anchor="middle">KV state</text>
  <g>
    <rect x="1644" y="589" width="17" height="43" rx="5" fill="#22c55e"/>
    <rect x="1664" y="589" width="17" height="43" rx="5" fill="#22c55e"/>
    <rect x="1684" y="589" width="17" height="43" rx="5" fill="#22c55e"/>
    <rect x="1704" y="589" width="17" height="43" rx="5" fill="#22c55e"/>
    <rect x="1724" y="589" width="17" height="43" rx="5" fill="#3b82f6"/>
    <rect x="1744" y="589" width="17" height="43" rx="5" fill="#3b82f6"/>
    <rect x="1764" y="589" width="17" height="43" rx="5" fill="#3b82f6"/>
    <rect x="1784" y="589" width="17" height="43" rx="5" fill="#3b82f6"/>
  </g>
  <text class="small" x="1718.5" y="676" text-anchor="middle">Ready to generate</text>

  <rect x="1058" y="743" width="752" height="48" rx="12" fill="#1e3a8a"/>
  <text class="body white" x="1434" y="773" text-anchor="middle">Only missing tokens run through the model</text>

  <!-- Key outcomes -->
  <rect x="70" y="858" width="565" height="150" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="eyebrow" x="104" y="897" fill="#15803d">THE IMC HIT IS OPTIONAL</text>
  <text class="body" x="104" y="932">Compatible IMC hit → restore saved state.</text>
  <text class="body" x="104" y="962">No hit → the assigned slot starts empty.</text>

  <rect x="660" y="858" width="565" height="150" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow" x="694" y="897" fill="#1d4ed8">PHASE II DOES THE COMPUTE</text>
  <text class="body" x="694" y="932">Decode the uncached request suffix.</text>
  <text class="body" x="694" y="962">Without a restore, decode the full prompt.</text>

  <rect x="1250" y="858" width="598" height="150" rx="20" fill="#0f172a"/>
  <text class="eyebrow" x="1284" y="897" fill="#5eead4">THE RESULT</text>
  <text class="body white" x="1284" y="932">One complete slot-local KV sequence,</text>
  <text class="body white" x="1284" y="962">ready to produce the first output token.</text>

  <text class="small muted" x="72" y="1055">Restore copies existing model state. Request prefill computes only the state that does not already exist.</text>
</svg>
