<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Run Generation Inference</title>
  <desc id="desc">After prompt prefill, Kronk repeatedly decodes the previously selected token into per-sequence KV state, obtains vocabulary logits, applies grammar constraints and sampling controls, selects a token, converts it to text, classifies parser output, and streams a content delta. The selected token becomes input to the next decode iteration. Normal completion occurs for vocabulary end-of-generation, parser-signaled completion, or max tokens. Cancellation, decode failure, streaming failure, and shutdown are error exits.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .eyebrow { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .heading { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="12" fill="#0f766e"/>

  <text class="title" x="72" y="70">ORDINARY TOKEN GENERATION LOOP</text>
  <text class="subtitle" x="72" y="108">LIFECYCLE STAGE 4 · MODEL EXECUTION — Decode, sample, emit, and repeat until completion.</text>

  <!-- Primary flow connectors -->
  <path d="M 410 318 H 446" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 730 318 H 766" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1130 318 H 1166" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1325 416 V 462" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M 1325 706 V 752" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow-teal)"/>

  <!-- Stage cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="340" height="276" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="460" y="220" width="270" height="196" rx="24" fill="#ecfeff" stroke="#5eead4" stroke-width="3"/>
    <rect x="780" y="180" width="350" height="276" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <rect x="1180" y="220" width="290" height="196" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <rect x="1120" y="476" width="350" height="230" rx="24" fill="#fffbeb" stroke="#fbbf24" stroke-width="3"/>
    <rect x="1120" y="766" width="350" height="154" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <!-- Stage 1 -->
  <circle cx="108" cy="218" r="21" fill="#2563eb"/>
  <text x="102" y="226" style="font:700 20px Inter, sans-serif" class="white">1</text>
  <text class="eyebrow" x="240" y="211" fill="#1d4ed8" text-anchor="middle">MODEL COMPUTE</text>
  <text class="heading" x="240" y="240" text-anchor="middle">Batched decode</text>
  <text class="body" x="105" y="282">First output:</text>
  <text class="small" x="105" y="309">final prefill row already supplies logits</text>
  <line x1="105" y1="330" x2="375" y2="330" stroke="#bfdbfe" stroke-width="2"/>
  <text class="body" x="105" y="365">Later iterations:</text>
  <text class="small" x="105" y="392">decode the previously selected token</text>
  <text class="small" x="105" y="416">compute and append its KV tensors</text>
  <text class="small" x="105" y="440">to this slot's KV cache</text>

  <!-- Stage 2 -->
  <circle cx="498" cy="258" r="21" fill="#0f766e"/>
  <text x="492" y="266" style="font:700 20px Inter, sans-serif" class="white">2</text>
  <text class="eyebrow" x="595" y="251" fill="#0f766e" text-anchor="middle">MODEL OUTPUT</text>
  <text class="heading" x="595" y="294" text-anchor="middle">Vocabulary logits</text>
  <circle cx="510" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="535" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="560" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="585" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="610" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="635" cy="334" r="6" fill="#2dd4bf"/>
  <circle cx="660" cy="334" r="6" fill="#2dd4bf"/>
  <text class="small" x="492" y="374">raw score for every token</text>
  <text class="tiny" x="492" y="398">read from this slot's logits row</text>

  <!-- Stage 3 -->
  <circle cx="818" cy="218" r="21" fill="#7c3aed"/>
  <text x="812" y="226" style="font:700 20px Inter, sans-serif" class="white">3</text>
  <text class="eyebrow" x="955" y="211" fill="#6d28d9" text-anchor="middle">TOKEN SELECTION</text>
  <text class="heading" x="955" y="240" text-anchor="middle">Constrain and sample</text>
  <text class="body" x="812" y="286">Optional grammar / JSON schema</text>
  <text class="body" x="812" y="322">Sampling chain:</text>
  <text class="small" x="832" y="346">top-k · top-p · min-p · temperature</text>
  <text class="small" x="832" y="372">penalties · XTC / adaptive-p when set</text>
  <rect x="812" y="402" width="286" height="36" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text class="mono" x="955" y="426" text-anchor="middle">sample(logits) → token ID</text>

  <!-- Stage 4 -->
  <circle cx="1218" cy="258" r="21" fill="#059669"/>
  <text x="1212" y="266" style="font:700 20px Inter, sans-serif" class="white">4</text>
  <text class="eyebrow" x="1325" y="251" fill="#047857" text-anchor="middle">NEXT TOKEN</text>
  <text class="heading" x="1325" y="294" text-anchor="middle">Accept selection</text>
  <rect x="1212" y="320" width="226" height="48" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text class="mono" x="1254" y="350">selected token ID</text>
  <text class="tiny" x="1212" y="394">retained as input if the loop continues</text>

  <!-- Stage 5 -->
  <circle cx="1158" cy="514" r="21" fill="#d97706"/>
  <text x="1152" y="522" style="font:700 20px Inter, sans-serif" class="white">5</text>
  <text class="eyebrow" x="1295" y="507" fill="#b45309" text-anchor="middle">OUTPUT PIPELINE</text>
  <text class="heading" x="1295" y="536" text-anchor="middle">Token → text → parser</text>
  <text class="small" x="1155" y="578">Convert token to a text piece</text>
  <text class="small" x="1155" y="612">Buffer incomplete UTF-8 code points</text>
  <text class="small" x="1155" y="646">Classify answer · reasoning · tool output</text>
  <text class="small" x="1155" y="680">Count generated token and check limit</text>

  <!-- Stage 6 -->
  <circle cx="1158" cy="804" r="21" fill="#2563eb"/>
  <text x="1152" y="812" style="font:700 20px Inter, sans-serif" class="white">6</text>
  <text class="eyebrow" x="1295" y="797" fill="#1d4ed8" text-anchor="middle">RESPONSE OUTPUT</text>
  <text class="heading" x="1295" y="826" text-anchor="middle">Accumulate and stream</text>
  <text class="body" x="1155" y="866">Store final response content</text>
  <text class="body" x="1155" y="896">Emit streamable content delta</text>

  <!-- Normal stop panel -->
  <g filter="url(#shadow)">
    <rect x="1510" y="150" width="340" height="366" rx="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  </g>
  <rect x="1510" y="150" width="340" height="70" rx="24" fill="#dcfce7"/>
  <path d="M 1510 192 Q 1510 220 1538 220 H 1822 Q 1850 220 1850 192" fill="#dcfce7"/>
  <circle cx="1552" cy="184" r="22" fill="#15803d"/>
  <path d="M 1541 184 L 1549 192 L 1564 175" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading" x="1586" y="192" style="fill:#166534">Normal completion</text>
  <text class="eyebrow" x="1540" y="258" fill="#15803d">VOCABULARY EOG</text>
  <text class="small" x="1540" y="283">selected token is a vocabulary EOG</text>
  <line x1="1540" y1="305" x2="1820" y2="305" stroke="#bbf7d0" stroke-width="2"/>
  <text class="eyebrow" x="1540" y="340" fill="#15803d">PARSER-SIGNALED EOG</text>
  <text class="small" x="1540" y="365">template parser reports completion</text>
  <line x1="1540" y1="387" x2="1820" y2="387" stroke="#bbf7d0" stroke-width="2"/>
  <text class="eyebrow" x="1540" y="422" fill="#15803d">MAX_TOKENS REACHED</text>
  <text class="small" x="1540" y="447">configured generation limit reached</text>
  <rect x="1540" y="466" width="280" height="30" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="tiny" x="1680" y="487" text-anchor="middle">send final response · release slot</text>

  <!-- Error panel -->
  <g filter="url(#shadow)">
    <rect x="1510" y="556" width="340" height="364" rx="24" fill="#fff7f7" stroke="#ef4444" stroke-width="3"/>
  </g>
  <rect x="1510" y="556" width="340" height="70" rx="24" fill="#fee2e2"/>
  <path d="M 1510 598 Q 1510 626 1538 626 H 1822 Q 1850 626 1850 598" fill="#fee2e2"/>
  <circle cx="1552" cy="590" r="22" fill="#dc2626"/>
  <text x="1546" y="599" style="font:800 25px Inter, sans-serif" class="white">!</text>
  <text class="heading" x="1586" y="598" style="fill:#b91c1c">Error exits</text>
  <text class="eyebrow" x="1540" y="666" fill="#dc2626">CANCELLATION / DEADLINE</text>
  <text class="small" x="1540" y="691">request context ends before completion</text>
  <line x1="1540" y1="714" x2="1820" y2="714" stroke="#fecaca" stroke-width="2"/>
  <text class="eyebrow" x="1540" y="749" fill="#dc2626">CONTEXT / DECODE FAILURE</text>
  <text class="small" x="1540" y="774">context full, decode failure, or invalid input</text>
  <line x1="1540" y1="797" x2="1820" y2="797" stroke="#fecaca" stroke-width="2"/>
  <text class="eyebrow" x="1540" y="832" fill="#dc2626">STREAM / SHUTDOWN FAILURE</text>
  <text class="small" x="1540" y="857">stream fails or engine shuts down</text>
  <rect x="1540" y="876" width="280" height="24" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text class="tiny" x="1680" y="894" text-anchor="middle">finish with an error response</text>

  <!-- Side exit guides -->
  <path d="M 1470 318 H 1490 V 280 H 1508" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <path d="M 1470 590 H 1490 V 390 H 1508" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <path d="M 240 180 V 138 H 1490 V 735 H 1508" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <path d="M 1470 842 H 1490 V 735 H 1508" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="8 7"/>

  <!-- Loop timing invariant -->
  <g filter="url(#shadow)">
    <rect x="70" y="742" width="850" height="178" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  </g>
  <circle cx="128" cy="801" r="35" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="128" cy="801" r="5" fill="#2563eb"/>
  <path d="M 128 801 V 778 M 128 801 L 145 812" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text class="eyebrow" x="188" y="780" fill="#1d4ed8">TIMING INVARIANT</text>
  <text class="heading" x="188" y="814">Sampling selects the next token; the next decode commits it to KV.</text>
  <text class="body" x="188" y="850">The token just selected in step 4 is not yet represented in model state.</text>
  <text class="body" x="188" y="882">If generation continues, it becomes the input token for step 1.</text>

  <!-- Continue-loop return path -->
  <path d="M 1120 846 H 970 V 976 H 45 V 470 H 240 V 458" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <rect x="420" y="950" width="440" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="eyebrow" x="640" y="981" fill="#334155" text-anchor="middle">CONTINUE · RETAIN TOKEN FOR NEXT BATCH</text>

  <text class="small muted" x="72" y="1044">Ordinary non-speculative generation shown. Speculative decoding can verify and accept multiple candidate tokens in one forward pass.</text>
  <text class="small muted" x="72" y="1067">Slots share batched model compute, but each slot keeps isolated sampler, parser, sequence, and response state.</text>
</svg>
