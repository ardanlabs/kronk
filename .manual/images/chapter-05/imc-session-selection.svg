<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">How IMC Selects a Reusable Session</title>
  <desc id="desc">Kronk renders and tokenizes the new request's complete stable prompt once. Each available session already stores the complete token sequence that produced its snapshot. Kronk compares that saved sequence with the same-length prefix of the new stable sequence, rejects longer or divergent sessions, chooses the longest complete match, and reserves it before scheduling. It does not render the template once per candidate, and message count is metadata rather than the matching authority.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .step { font: 700 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.3px; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .tokenText { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; text-anchor: middle; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="72" y="70">HOW IMC SELECTS A SESSION</text>
  <text class="subtitle" x="72" y="108">Render once. Compare each complete saved plan with the same-length prefix. Choose the longest match.</text>

  <!-- Session-selection connectors sit behind the cards. -->
  <path d="M 570 450 H 608" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1220 450 H 1258" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 1: render once. -->
  <g filter="url(#shadow)"><rect x="70" y="160" width="500" height="620" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/></g>
  <rect x="70" y="160" width="500" height="72" rx="26" fill="#dbeafe"/>
  <path d="M 70 204 Q 70 232 98 232 H 542 Q 570 232 570 204" fill="#dbeafe"/>
  <circle cx="110" cy="196" r="20" fill="#2563eb"/>
  <text x="104" y="204" style="font:700 19px Inter, sans-serif" class="white">1</text>
  <text class="step" x="145" y="203">Render the new stable plan once</text>

  <rect x="105" y="270" width="430" height="100" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow" x="130" y="302" fill="#1d4ed8">NEW REQUEST</text>
  <text class="mono" x="130" y="336">messages: [A][B][C][D][E][F]</text>

  <path d="M 320 382 V 408" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="105" y="420" width="430" height="90" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="eyebrow" x="130" y="452" fill="#6d28d9">RUN THE MODEL TEMPLATE ONCE</text>
  <text class="small" x="130" y="481">Use the complete conversation.</text>
  <text class="small" x="130" y="502">Disable the generation marker.</text>

  <path d="M 320 522 V 548" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="105" y="560" width="430" height="112" rx="16" fill="#ecfdf5" stroke="#5eead4" stroke-width="3"/>
  <text class="eyebrow" x="130" y="592" fill="#0f766e">NEW STABLE PLAN</text>
  <text class="mono" x="130" y="628">NR</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="169" y="607" width="26" height="26" rx="5"/><rect x="201" y="607" width="26" height="26" rx="5"/>
    <rect x="233" y="607" width="26" height="26" rx="5"/><rect x="265" y="607" width="26" height="26" rx="5"/>
    <rect x="297" y="607" width="26" height="26" rx="5"/><rect x="329" y="607" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText">
    <text x="182" y="625">7</text><text x="214" y="625">2</text><text x="246" y="625">9</text>
    <text x="278" y="625">4</text><text x="310" y="625">1</text><text x="342" y="625">8</text>
  </g>
  <text class="small" x="130" y="654">Values represent token or ordered plan units.</text>

  <rect x="105" y="702" width="430" height="54" rx="16" fill="#0f172a"/>
  <text class="small white" x="130" y="735">Do not render the template again for each session.</text>

  <!-- Step 2: compare candidates. -->
  <g filter="url(#shadow)"><rect x="620" y="160" width="600" height="620" rx="26" fill="#ffffff" stroke="#5eead4" stroke-width="3"/></g>
  <rect x="620" y="160" width="600" height="72" rx="26" fill="#ccfbf1"/>
  <path d="M 620 204 Q 620 232 648 232 H 1192 Q 1220 232 1220 204" fill="#ccfbf1"/>
  <circle cx="660" cy="196" r="20" fill="#0f766e"/>
  <text x="654" y="204" style="font:700 19px Inter, sans-serif" class="white">2</text>
  <text class="step" x="695" y="203">Compare each available session</text>

  <rect x="650" y="260" width="540" height="74" rx="14" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
  <text class="eyebrow" x="675" y="288" fill="#0e7490">NEW STABLE PLAN</text>
  <text class="mono" x="675" y="320">NR</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="714" y="299" width="26" height="26" rx="5"/><rect x="746" y="299" width="26" height="26" rx="5"/>
    <rect x="778" y="299" width="26" height="26" rx="5"/><rect x="810" y="299" width="26" height="26" rx="5"/>
    <rect x="842" y="299" width="26" height="26" rx="5"/><rect x="874" y="299" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText">
    <text x="727" y="317">7</text><text x="759" y="317">2</text><text x="791" y="317">9</text>
    <text x="823" y="317">4</text><text x="855" y="317">1</text><text x="887" y="317">8</text>
  </g>
  <text class="small" x="925" y="319">6 messages</text>

  <rect x="650" y="354" width="540" height="74" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text class="mono" x="675" y="384">S0 · 4 messages</text>
  <text class="small" x="1070" y="384" style="fill:#047857">MATCH</text>
  <text class="small" x="675" y="412">Saved</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="735" y="392" width="26" height="26" rx="5"/><rect x="767" y="392" width="26" height="26" rx="5"/>
    <rect x="799" y="392" width="26" height="26" rx="5"/><rect x="831" y="392" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText">
    <text x="748" y="410">7</text><text x="780" y="410">2</text><text x="812" y="410">9</text><text x="844" y="410">4</text>
  </g>
  <text class="small" x="875" y="412">equals NR prefix</text>

  <rect x="650" y="446" width="540" height="74" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text class="mono" x="675" y="476">S3 · 2 messages</text>
  <text class="small" x="1070" y="476" style="fill:#047857">MATCH</text>
  <text class="small" x="675" y="504">Saved</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="735" y="484" width="26" height="26" rx="5"/><rect x="767" y="484" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText"><text x="748" y="502">7</text><text x="780" y="502">2</text></g>
  <text class="small" x="811" y="504">equals NR prefix</text>

  <rect x="650" y="538" width="540" height="74" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text class="mono" x="675" y="568">S1 · 7 messages</text>
  <text class="small" x="1040" y="568" style="fill:#be123c">TOO LONG</text>
  <text class="small" x="675" y="596">Saved</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="735" y="576" width="26" height="26" rx="5"/><rect x="767" y="576" width="26" height="26" rx="5"/>
    <rect x="799" y="576" width="26" height="26" rx="5"/><rect x="831" y="576" width="26" height="26" rx="5"/>
    <rect x="863" y="576" width="26" height="26" rx="5"/><rect x="895" y="576" width="26" height="26" rx="5"/>
    <rect x="927" y="576" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText">
    <text x="748" y="594">3</text><text x="780" y="594">8</text><text x="812" y="594">1</text>
    <text x="844" y="594">9</text><text x="876" y="594">2</text><text x="908" y="594">7</text><text x="940" y="594">5</text>
  </g>
  <text class="small" x="970" y="596">longer than NR</text>

  <rect x="650" y="630" width="540" height="74" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text class="mono" x="675" y="660">S2 · 3 messages</text>
  <text class="small" x="1040" y="660" style="fill:#be123c">MISMATCH</text>
  <text class="small" x="675" y="688">Saved</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="735" y="668" width="26" height="26" rx="5"/><rect x="767" y="668" width="26" height="26" rx="5"/>
    <rect x="799" y="668" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText"><text x="748" y="686">7</text><text x="780" y="686">2</text><text x="812" y="686">6</text></g>
  <text class="small" x="843" y="688">does not equal NR prefix</text>

  <rect x="650" y="724" width="540" height="36" rx="12" fill="#0f172a"/>
  <text class="small white" x="675" y="748">Only available, unreserved sessions are compared.</text>

  <!-- Step 3: choose and reserve. -->
  <g filter="url(#shadow)"><rect x="1270" y="160" width="580" height="620" rx="26" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/></g>
  <rect x="1270" y="160" width="580" height="72" rx="26" fill="#fef3c7"/>
  <path d="M 1270 204 Q 1270 232 1298 232 H 1822 Q 1850 232 1850 204" fill="#fef3c7"/>
  <circle cx="1310" cy="196" r="20" fill="#d97706"/>
  <text x="1304" y="204" style="font:700 19px Inter, sans-serif" class="white">3</text>
  <text class="step" x="1345" y="203">Choose the longest match and reserve it</text>

  <rect x="1305" y="280" width="510" height="142" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text class="eyebrow" x="1330" y="314" fill="#047857">SELECT S0</text>
  <text class="mono" x="1330" y="350">S0</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="1369" y="329" width="26" height="26" rx="5"/><rect x="1401" y="329" width="26" height="26" rx="5"/>
    <rect x="1433" y="329" width="26" height="26" rx="5"/><rect x="1465" y="329" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText">
    <text x="1382" y="347">7</text><text x="1414" y="347">2</text><text x="1446" y="347">9</text><text x="1478" y="347">4</text>
  </g>
  <text class="small" x="1330" y="380">S0 and S3 match, but S0 is the longer prefix.</text>
  <text class="small" x="1330" y="406">Reuse S0, then process the remaining</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <rect x="1632" y="386" width="26" height="26" rx="5"/><rect x="1664" y="386" width="26" height="26" rx="5"/>
  </g>
  <g class="tokenText"><text x="1645" y="404">1</text><text x="1677" y="404">8</text></g>

  <rect x="1305" y="460" width="510" height="106" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="eyebrow" x="1330" y="492" fill="#c2410c">IF NOTHING MATCHES</text>
  <text class="small" x="1330" y="522">Choose an empty session first.</text>
  <text class="small" x="1330" y="548">Otherwise choose an available LRU session.</text>

  <rect x="1305" y="604" width="510" height="118" rx="16" fill="#0f172a"/>
  <text class="eyebrow" x="1330" y="638" fill="#fbbf24">RESERVE THE CHOICE</text>
  <text class="small white" x="1330" y="670">Other requests must skip S0 while it is in use.</text>
  <text class="small" x="1330" y="698" style="fill:#c4b5fd">All reserved? Return a retryable busy result.</text>

  <!-- The distinction that prevents message-level matching confusion. -->
  <rect x="70" y="830" width="1780" height="170" rx="24" fill="#0f172a"/>
  <text class="eyebrow" x="100" y="866" fill="#5eead4">WHAT THE COMPARISON MEANS</text>

  <rect x="100" y="892" width="790" height="78" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text class="heading white" x="128" y="924">Compare the rendered plan—not individual messages</text>
  <text class="small" x="128" y="952" style="fill:#99f6e4">Message count is metadata; it is not the prefix test.</text>

  <rect x="930" y="892" width="890" height="78" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text class="heading white" x="958" y="924">Every saved session already has its complete plan</text>
  <text class="small" x="958" y="952" style="fill:#bfdbfe">Text uses saved tokens; media uses ordered text and media-identity units.</text>
</svg>
