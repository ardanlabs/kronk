<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">How IMC populates and selects Working and System caches</title>
  <desc id="desc">A cache-worthy request stores its complete stable conversation in a Working session and its independently rendered System-only prefix in the model System pool. New requests search all Working sessions first. Only when none matches does Kronk search the System pool, copy an exact System hit into a separate empty or least-recently-used Working session, and build the remaining prompt there.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0L12 6L0 12z" fill="#334155"/></marker>
    <style>
      .title{font:700 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a;letter-spacing:.4px}.subtitle{font:400 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .section{font:700 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.heading{font:700 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}
      .body{font:500 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334155}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .eyebrow{font:700 17px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.1px}.token{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle;dominant-baseline:middle}
      .white{fill:#fff}.blue{fill:#1d4ed8}.green{fill:#15803d}.red{fill:#b91c1c}.orange{fill:#c2410c}.muted{fill:#64748b}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/><rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="70" y="67">IMC CACHE POPULATION AND SESSION SELECTION</text>
  <text class="subtitle" x="70" y="105">Working sessions are the normal path. The separate System pool is consulted only after every Working session misses.</text>

  <!-- Population -->
  <text class="section" x="70" y="157">1 · POPULATE BOTH MODEL-OWNED POOLS</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1780" height="225" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g>
  <rect x="105" y="220" width="335" height="135" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="eyebrow muted" x="135" y="255">CACHE-WORTHY REQUEST</text>
  <rect x="135" y="278" width="100" height="48" rx="9" fill="#16a34a"/><rect x="245" y="278" width="90" height="48" rx="9" fill="#3b82f6"/><rect x="345" y="278" width="65" height="48" rx="9" fill="#3b82f6"/>
  <text class="token white" x="185" y="302">SYSTEM A</text><text class="token white" x="290" y="302">USER 1</text><text class="token white" x="377" y="302">…</text>

  <path d="M440 287H535" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="small blue" x="487" y="265" text-anchor="middle">stable</text>
  <rect x="555" y="205" width="560" height="175" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow blue" x="590" y="245">WORKING SESSION POOL · N ENTRIES</text>
  <text class="body" x="590" y="278">Save the complete stable conversation.</text>
  <rect x="590" y="305" width="100" height="46" rx="8" fill="#16a34a"/><rect x="700" y="305" width="90" height="46" rx="8" fill="#3b82f6"/><rect x="800" y="305" width="65" height="46" rx="8" fill="#3b82f6"/>
  <text class="token white" x="640" y="328">SYSTEM A</text><text class="token white" x="745" y="328">USER 1</text><text class="token white" x="832" y="328">…</text><text class="small blue" x="895" y="334">Working 2</text>

  <path d="M440 330C500 395 1060 395 1130 330" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="small green" x="820" y="395" text-anchor="middle">independent System-only render</text>
  <rect x="1150" y="205" width="665" height="175" rx="18" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text class="eyebrow green" x="1185" y="245">SYSTEM CACHE POOL · N ENTRIES · RAM ONLY</text>
  <text class="body" x="1185" y="278">Save only the exact rendered System boundary.</text>
  <rect x="1185" y="305" width="100" height="46" rx="8" fill="#16a34a"/>
  <text class="token white" x="1235" y="328">SYSTEM A</text><text class="small green" x="1315" y="334">System 0 · immutable · shared</text>
  <rect x="1580" y="294" width="200" height="64" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text class="small" x="1680" y="320" text-anchor="middle">Not [SYSTEM][USER]</text><text class="small green" x="1680" y="345" text-anchor="middle">[SYSTEM] only</text>

  <!-- Working selection -->
  <text class="section" x="70" y="460">2 · START A REQUEST — SEARCH EVERY AVAILABLE WORKING SESSION FIRST</text>
  <g filter="url(#shadow)"><rect x="70" y="485" width="1780" height="260" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g>
  <rect x="105" y="525" width="320" height="175" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="eyebrow muted" x="135" y="562">NEW STABLE PLAN</text>
  <rect x="135" y="588" width="92" height="44" rx="8" fill="#0f766e"/><rect x="237" y="588" width="80" height="44" rx="8" fill="#0f766e"/><rect x="327" y="588" width="68" height="44" rx="8" fill="#0f766e"/>
  <text class="token white" x="181" y="610">SYSTEM A</text><text class="token white" x="277" y="610">USER X</text><text class="token white" x="361" y="610">…</text>
  <text class="small muted" x="135" y="670">Reserved sessions are skipped.</text>
  <path d="M425 612H505" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="525" y="525" width="330" height="175" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow blue" x="555" y="562">WORKING 0</text><text class="body" x="555" y="594">[SYSTEM A][USER 1]…</text>
  <text class="small red" x="555" y="628">Diverges · reject</text><text class="small muted" x="555" y="666">No partial-prefix trimming</text>
  <rect x="885" y="525" width="330" height="175" rx="18" fill="#eff6ff" stroke="#22c55e" stroke-width="4"/>
  <text class="eyebrow green" x="915" y="562">WORKING 1 · SELECTED</text><text class="body" x="915" y="594">[SYSTEM A][USER X]</text>
  <text class="small green" x="915" y="628">Complete prefix · longest hit</text><text class="small" x="915" y="666">Restore and append normally</text>
  <rect x="1245" y="525" width="270" height="175" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow blue" x="1275" y="562">WORKING 2</text><text class="body" x="1275" y="594">[SYSTEM A]</text>
  <text class="small green" x="1275" y="628">Complete prefix · shorter</text><text class="small muted" x="1275" y="666">Usable, not selected</text>
  <rect x="1545" y="525" width="270" height="175" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="eyebrow muted" x="1575" y="562">WORKING 3</text><text class="body muted" x="1575" y="594">Reserved</text>
  <text class="small muted" x="1575" y="628">Another request owns it</text><text class="small muted" x="1575" y="666">Do not inspect or reset</text>

  <!-- System selection -->
  <text class="section" x="70" y="800">3 · ONLY WHEN ALL WORKING SESSIONS MISS — SEARCH SYSTEM, THEN CHOOSE A WORKING DESTINATION</text>
  <g filter="url(#shadow)"><rect x="70" y="825" width="1780" height="180" rx="24" fill="#fff" stroke="#fbbf24" stroke-width="2"/></g>
  <rect x="105" y="855" width="300" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="eyebrow orange" x="135" y="892">ALL WORKING MISS</text><text class="body" x="135" y="927">Now inspect System pool</text><text class="small muted" x="135" y="956">Never search System earlier</text>
  <path d="M405 915H480" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="500" y="855" width="355" height="120" rx="16" fill="#ecfdf5" stroke="#22c55e" stroke-width="4"/>
  <text class="eyebrow green" x="530" y="892">SYSTEM 0 · EXACT HIT</text><text class="body" x="530" y="927">[SYSTEM A] token sequence</text><text class="small green" x="530" y="956">Reserve immutable source during copy</text>
  <path d="M855 915H930" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="950" y="855" width="380" height="120" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow blue" x="980" y="892">SELECT EMPTY OR AVAILABLE LRU</text><text class="body" x="980" y="927">Copy System 0 → Working destination</text><text class="small blue" x="980" y="956">Prefill suffix; publish complete Current</text>
  <text class="eyebrow orange" x="1378" y="921" text-anchor="middle">OR</text>
  <rect x="1425" y="855" width="390" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="eyebrow orange" x="1455" y="892">NO EXACT SYSTEM HIT</text><text class="body" x="1455" y="927">Build Working from the beginning</text><text class="small" x="1455" y="956">Publish System; rotate oldest available if full</text>

  <rect x="70" y="1025" width="1780" height="40" rx="12" fill="#0f172a"/>
  <text class="body white" x="960" y="1051" text-anchor="middle">Current-first invariant: a Working hit always wins. System is a shared preload source, never the Working destination and never a user-turn cache.</text>
</svg>
