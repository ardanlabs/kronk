<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Stage 2 IMC prompt planning</title>
  <desc id="desc">Kronk renders stable and generation-ready forms of the complete conversation, builds a canonical token or media plan, finds the longest complete safe reusable prefix, chooses exact, append, anchor, or rebuild, and reserves the selected IMC session before batch scheduling.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .step { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.3px; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="12" fill="#0f766e"/>
  <text class="title" x="72" y="70">IMC PROMPT PLANNING</text>
  <text class="subtitle" x="72" y="108">LIFECYCLE STAGE 2 · Plan exact model work, reuse only safe state, and reserve it before scheduling.</text>

  <!-- Flow connectors -->
  <path d="M 355 420 H 385" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 715 420 H 745" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1075 420 H 1105" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1435 420 H 1465" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)"><rect x="70" y="160" width="285" height="590" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/></g>
  <rect x="70" y="160" width="285" height="72" rx="24" fill="#dbeafe"/>
  <path d="M 70 204 Q 70 232 98 232 H 327 Q 355 232 355 204" fill="#dbeafe"/>
  <circle cx="108" cy="196" r="20" fill="#2563eb"/><text x="102" y="204" style="font:700 19px Inter, sans-serif" class="white">1</text>
  <text class="step" x="140" y="203">Complete context</text>
  <text class="eyebrow" x="100" y="272" fill="#1d4ed8">PORTABLE REQUEST DATA</text>
  <rect x="100" y="292" width="225" height="220" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="body" x="122" y="330">Messages + roles</text>
  <text class="body" x="122" y="370">Tools + results</text>
  <text class="body" x="122" y="410">Text + media</text>
  <text class="body" x="122" y="450">Thinking controls</text>
  <text class="body" x="122" y="490">Generation flag</text>
  <rect x="100" y="545" width="225" height="140" rx="16" fill="#0f172a"/>
  <text class="eyebrow" x="122" y="578" fill="#5eead4">IMPORTANT</text>
  <text class="small white" x="122" y="610">The model does not</text>
  <text class="small white" x="122" y="638">consume message objects.</text>
  <text class="small" x="122" y="670" style="fill:#93c5fd">They must be rendered.</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)"><rect x="390" y="160" width="325" height="590" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/></g>
  <rect x="390" y="160" width="325" height="72" rx="24" fill="#ede9fe"/>
  <path d="M 390 204 Q 390 232 418 232 H 687 Q 715 232 715 204" fill="#ede9fe"/>
  <circle cx="428" cy="196" r="20" fill="#7c3aed"/><text x="422" y="204" style="font:700 19px Inter, sans-serif" class="white">2</text>
  <text class="step" x="460" y="203">Render two forms</text>
  <rect x="420" y="272" width="265" height="150" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow" x="444" y="304" fill="#1d4ed8">STABLE RENDERING</text>
  <text class="body" x="444" y="340">Complete conversation</text>
  <text class="small" x="444" y="372">Generation prompt disabled</text>
  <text class="small" x="444" y="400">Reusable cache target</text>
  <rect x="420" y="446" width="265" height="178" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="eyebrow" x="444" y="478" fill="#6d28d9">GENERATION-READY</text>
  <text class="body" x="444" y="514">Complete conversation</text>
  <text class="body" x="444" y="546">+ generation-only tail</text>
  <text class="small" x="444" y="580">Exact prompt for inference</text>
  <text class="small" x="444" y="608">Stable form must prefix it</text>
  <rect x="420" y="650" width="265" height="55" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text class="small" x="442" y="683">Render both complete prompts.</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)"><rect x="750" y="160" width="325" height="590" rx="24" fill="#ffffff" stroke="#5eead4" stroke-width="3"/></g>
  <rect x="750" y="160" width="325" height="72" rx="24" fill="#ccfbf1"/>
  <path d="M 750 204 Q 750 232 778 232 H 1047 Q 1075 232 1075 204" fill="#ccfbf1"/>
  <circle cx="788" cy="196" r="20" fill="#0f766e"/><text x="782" y="204" style="font:700 19px Inter, sans-serif" class="white">3</text>
  <text class="step" x="820" y="203">Canonical plan</text>
  <text class="eyebrow" x="780" y="272" fill="#0f766e">AUTHORITATIVE MODEL INPUT</text>
  <rect x="780" y="292" width="265" height="76" rx="14" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
  <text class="mono" x="802" y="324">[A][B][C][D][G]</text>
  <text class="small" x="802" y="352">text token IDs + tail</text>
  <rect x="780" y="390" width="265" height="125" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="mono" x="802" y="424">[token][image]</text>
  <text class="mono" x="802" y="454">[token][audio][token]</text>
  <text class="small" x="802" y="487">ordered media identities</text>
  <rect x="780" y="542" width="265" height="163" rx="14" fill="#0f172a"/>
  <text class="eyebrow" x="802" y="574" fill="#5eead4">PLAN ALSO TRACKS</text>
  <text class="small white" x="802" y="610">Logical positions</text>
  <text class="small white" x="802" y="640">Stable boundary</text>
  <text class="small white" x="802" y="670">Physical snapshot state</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)"><rect x="1110" y="160" width="325" height="590" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/></g>
  <rect x="1110" y="160" width="325" height="72" rx="24" fill="#dbeafe"/>
  <path d="M 1110 204 Q 1110 232 1138 232 H 1407 Q 1435 232 1435 204" fill="#dbeafe"/>
  <circle cx="1148" cy="196" r="20" fill="#2563eb"/><text x="1142" y="204" style="font:700 19px Inter, sans-serif" class="white">4</text>
  <text class="step" x="1180" y="190">Find longest safe</text><text class="step" x="1180" y="216">complete prefix</text>
  <text class="eyebrow" x="1140" y="272" fill="#1d4ed8">AVAILABLE SESSIONS</text>
  <text class="mono" x="1140" y="312">S0  [A B]</text>
  <rect x="1140" y="326" width="235" height="16" rx="8" fill="#cbd5e1"/><rect x="1140" y="326" width="80" height="16" rx="8" fill="#60a5fa"/>
  <text class="mono" x="1140" y="380">S1  [A B C D]</text>
  <rect x="1140" y="394" width="235" height="16" rx="8" fill="#cbd5e1"/><rect x="1140" y="394" width="160" height="16" rx="8" fill="#2563eb"/>
  <text class="mono" x="1140" y="448">S2  [A B X]</text>
  <rect x="1140" y="462" width="235" height="16" rx="8" fill="#cbd5e1"/><rect x="1140" y="462" width="62" height="16" rx="8" fill="#f87171"/>
  <rect x="1140" y="510" width="265" height="195" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="eyebrow" x="1164" y="544" fill="#1d4ed8">REUSE RULES</text>
  <text class="body" x="1164" y="582">Complete boundary</text>
  <text class="body" x="1164" y="620">Compatible snapshot</text>
  <text class="body" x="1164" y="658">Available, not reserved</text>
  <text class="small" x="1164" y="688">Longest safe match wins.</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)"><rect x="1470" y="160" width="380" height="590" rx="24" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/></g>
  <rect x="1470" y="160" width="380" height="72" rx="24" fill="#fef3c7"/>
  <path d="M 1470 204 Q 1470 232 1498 232 H 1822 Q 1850 232 1850 204" fill="#fef3c7"/>
  <circle cx="1508" cy="196" r="20" fill="#d97706"/><text x="1502" y="204" style="font:700 19px Inter, sans-serif" class="white">5</text>
  <text class="step" x="1540" y="190">Choose action</text><text class="step" x="1540" y="216">and reserve session</text>
  <rect x="1500" y="268" width="150" height="92" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="eyebrow" x="1522" y="300" fill="#1d4ed8">EXACT</text><text class="small" x="1522" y="334">Plan matches</text>
  <rect x="1670" y="268" width="150" height="92" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text class="eyebrow" x="1692" y="300" fill="#047857">APPEND</text><text class="small" x="1692" y="334">Text extension</text>
  <rect x="1500" y="380" width="150" height="92" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="eyebrow" x="1522" y="412" fill="#6d28d9">ANCHOR</text><text class="small" x="1522" y="446">Media-safe tail</text>
  <rect x="1670" y="380" width="150" height="92" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="eyebrow" x="1692" y="412" fill="#c2410c">REBUILD</text><text class="small" x="1692" y="446">No safe prefix</text>
  <path d="M 1660 490 V 525" stroke="#d97706" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1500" y="540" width="320" height="130" rx="16" fill="#0f172a"/>
  <text class="eyebrow" x="1526" y="575" fill="#fbbf24">RESERVE WHILE LOCKED</text>
  <text class="body white" x="1526" y="611">Protect selected state</text>
  <text class="body white" x="1526" y="641">until execution or release</text>
  <rect x="1500" y="688" width="320" height="40" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="small" x="1524" y="714">Reserved session ID + state version</text>

  <!-- Principles -->
  <rect x="70" y="800" width="1780" height="200" rx="24" fill="#0f172a"/>
  <text class="eyebrow" x="104" y="836" fill="#5eead4">STAGE 2 OUTPUT: AN EXECUTION CONTRACT</text>
  <rect x="104" y="860" width="520" height="104" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text class="step white" x="132" y="895">Exact work</text>
  <text class="small white" x="132" y="926">Rendered tokens, media identities, positions, and tail.</text>
  <text class="small" x="132" y="950" style="fill:#bfdbfe">The batch engine executes this plan.</text>
  <rect x="654" y="860" width="520" height="104" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text class="step white" x="682" y="895">Safest minimum work</text>
  <text class="small white" x="682" y="926">Reuse only complete, committed, compatible state.</text>
  <text class="small" x="682" y="950" style="fill:#99f6e4">Never trim to a coincidental internal overlap.</text>
  <rect x="1204" y="860" width="612" height="104" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="step white" x="1232" y="895">Session ≠ execution slot</text>
  <text class="small white" x="1232" y="926">Reusable state is reserved before Stage 3 scheduling.</text>
  <text class="small" x="1232" y="950" style="fill:#ddd6fe">Stage 4 can restore it into any assigned slot.</text>

  <text class="small muted" x="72" y="1048">Text and media plans share the same safety principle; media anchors add stricter identity, order, placement, and text-only-tail rules.</text>
</svg>
