services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: openwebui
    restart: always
    pull_policy: never
    environment:
      - WEBUI_AUTH=false
      - GLOBAL_LOG_LEVEL="DEBUG"
      - ENABLE_PERSISTENT_CONFIG=false
      - OPENAI_API_BASE_URL=http://host.docker.internal:11435/v1
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      - WHISPER_MODEL_AUTO_UPDATE=false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8081:11435"
    volumes:
      - ./openwebui:/app/backend/data

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: always
    pull_policy: never
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_HTTP_PORT=3100
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/dashboards/kronk.json
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/dashboards
    networks:
      - kronk-net
    depends_on:
      - loki
      - prometheus
      - tempo

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    restart: always
    pull_policy: never
    command: -config.file=/loki-conf/loki.yaml -config.expand-env
    ports:
      - "3101:3101"
    volumes:
      - ./loki:/loki-conf
    networks:
      - kronk-net

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: always
    pull_policy: never
    command:
      - "--storage.tsdb.retention.time=1h"
      - "--config.file=/prom-conf/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus/"
      - "--log.level=debug"
      - "--web.enable-remote-write-receiver"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/prom-conf
    networks:
      - kronk-net

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: always
    pull_policy: never
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:3102
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "3102:3102"
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kronk-net
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    restart: always
    pull_policy: never
    command: -config.file=/tempo-conf/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
      - "14268:14268"
    volumes:
      - ./tempo:/tempo-conf
    networks:
      - kronk-net

networks:
  kronk-net:
    driver: bridge

volumes:
  alloy-data:
