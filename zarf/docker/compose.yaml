services:
  docling:
    image: quay.io/docling-project/docling-serve:v1.38.1@sha256:c632ab38b69a923c33b4d0c7dea4b8d3b8128bd19b94f710c3ee7db89dde8d34
    container_name: moxie-docling
    restart: unless-stopped
    labels:
      com.ardanlabs.moxie.service: docling
      com.ardanlabs.moxie.extraction-profile: docling-v1.38.1-dlparse_v4-accurate-v1
    environment:
      - DOCLING_SERVE_ENABLE_UI=0
      - DOCLING_SERVE_QUEUE_MAX_SIZE=4
      - DOCLING_SERVE_OCR_BATCH_SIZE=1
      - DOCLING_SERVE_LAYOUT_BATCH_SIZE=1
      - DOCLING_SERVE_TABLE_BATCH_SIZE=1
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./docling:/scratch

  # Shared PostgreSQL instance for the temporal and moxiedb databases.
  postgres:
    image: postgres:16
    container_name: moxie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MOXIE_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moxie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot dependencies keep initialization out of the make recipe.
  postgres-init:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${MOXIE_POSTGRES_PASSWORD:-}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${PGPASSWORD:?Export MOXIE_POSTGRES_PASSWORD first}"
        : "$${TEMPORAL_DB_PASSWORD:?Export TEMPORAL_DB_PASSWORD first}"
        psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
        \getenv temporal_password TEMPORAL_DB_PASSWORD
        SELECT format(
          'CREATE ROLE %I LOGIN PASSWORD %L', name, :'temporal_password'
        )
        FROM (VALUES ('temporal'), ('temporal_visibility')) AS roles(name)
        WHERE NOT EXISTS (
          SELECT FROM pg_roles WHERE rolname = name
        )
        \gexec
        SELECT 'CREATE DATABASE temporal OWNER temporal'
        WHERE NOT EXISTS (
          SELECT FROM pg_database WHERE datname = 'temporal'
        )
        \gexec
        SELECT 'CREATE DATABASE moxiedb'
        WHERE NOT EXISTS (
          SELECT FROM pg_database WHERE datname = 'moxiedb'
        )
        \gexec
        SQL
        psql -d temporal -v ON_ERROR_STOP=1 \
          -c 'GRANT CREATE ON DATABASE temporal TO temporal_visibility' \
          -c 'CREATE SCHEMA IF NOT EXISTS visibility AUTHORIZATION temporal_visibility' \
          -c 'ALTER ROLE temporal_visibility IN DATABASE temporal SET search_path = visibility'
        # Recompute from PostgreSQL on each start; this file is only a handoff.
        psql -d temporal -v ON_ERROR_STOP=1 -At > /bootstrap/schema-state.tmp <<'SQL'
        SELECT CASE
          WHEN NOT EXISTS (
            SELECT FROM pg_tables
            WHERE schemaname IN ('public', 'visibility')
          ) THEN 'empty'
          WHEN to_regclass('public.schema_version') IS NOT NULL
            AND to_regclass('visibility.schema_version') IS NOT NULL
            THEN 'existing'
          ELSE 'incomplete'
        END;
        SQL
        chmod 644 /bootstrap/schema-state.tmp
        mv /bootstrap/schema-state.tmp /bootstrap/schema-state
    volumes:
      - temporal-bootstrap:/bootstrap
    depends_on:
      postgres:
        condition: service_healthy

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    restart: "no"
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$(cat /bootstrap/schema-state)" in
          empty) ;;
          existing) echo "Temporal schemas already exist; skipping initialization and upgrades."; exit 0 ;;
          *) echo "Temporal schemas are incomplete or unrecognized; explicit inspection/repair is required. No Temporal migrations applied."; exit 1 ;;
        esac
        for schema in temporal visibility; do
          user=temporal
          if [ "$$schema" = visibility ]; then user=temporal_visibility; fi
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 \
            -u "$$user" --db temporal setup-schema -v 0.0
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 \
            -u "$$user" --db temporal update-schema \
            -d "/etc/temporal/schema/postgresql/v12/$$schema/versioned"
        done
    volumes:
      - temporal-bootstrap:/bootstrap:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # PostgreSQL-backed server; separate from the disposable tmprl test container.
  temporal:
    image: temporalio/server:1.32.2
    container_name: moxie-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-}
      DBNAME: temporal
      # Workflow search uses a separate schema in the same temporal database.
      VISIBILITY_DBNAME: temporal
      VISIBILITY_POSTGRES_USER: temporal_visibility
      ENABLE_ES: "false"
      # Use default settings without requiring a separate dynamic-config file.
      DYNAMIC_CONFIG_FILE_PATH: /dev/null
      BIND_ON_IP: 0.0.0.0
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Moxie SQL only: dataset files/indexing stay in the native datasets package.
  moxie-schema:
    image: postgres:16
    profiles: ["setup"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${MOXIE_POSTGRES_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${PGPASSWORD:?Export MOXIE_POSTGRES_PASSWORD first}"
        checksum=$$(sha256sum /schema/001_init.sql)
        export MOXIE_SCHEMA_CHECKSUM=$${checksum%% *}
        psql -d moxiedb -v ON_ERROR_STOP=1 <<'SQL'
        \getenv schema_checksum MOXIE_SCHEMA_CHECKSUM
        SELECT pg_advisory_lock(705990121);
        SELECT NOT EXISTS (
          SELECT FROM pg_tables WHERE schemaname = 'public'
        ) AS empty \gset
        \if :empty
          BEGIN;
          \i /schema/001_init.sql
          INSERT INTO schema_migrations (version, checksum)
          VALUES (1, :'schema_checksum');
          COMMIT;
          \echo 'Moxie schema initialized.'
        \else
          SELECT to_regclass('public.schema_migrations') IS NOT NULL AS recognized \gset
          \if :recognized
            SELECT count(*) = 1
              AND bool_and(version = 1 AND checksum = :'schema_checksum')
              AND NOT EXISTS (
                SELECT FROM (VALUES
                  ('catalog_initialization'), ('datasets'), ('dataset_versions'),
                  ('dataset_version_documents'), ('dataset_publications'),
                  ('jobs'), ('job_attempts'), ('job_intents')
                ) AS expected(name)
                WHERE to_regclass('public.' || name) IS NULL
              ) AS compatible
            FROM schema_migrations \gset
            \if :compatible
              \echo 'Moxie schema already exists; skipping initialization and upgrades.'
            \else
              DO $$$$ BEGIN
                RAISE EXCEPTION 'Moxie schema is incompatible; no upgrades applied.';
              END $$$$;
            \endif
          \else
            DO $$$$ BEGIN
              RAISE EXCEPTION 'Moxie schema is unrecognized; no initialization applied.';
            END $$$$;
          \endif
        \endif
        SQL
    volumes:
      - ../../cmd/server/app/sdk/tmprl/moxiedb/migrations/001_init.sql:/schema/001_init.sql:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    profiles: ["setup"]
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        namespaces=$$(temporal --address temporal:7233 operator namespace list --output json)
        if ! printf '%s\n' "$$namespaces" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"default"'; then
          temporal --address temporal:7233 operator namespace create --namespace default --retention 1d
        fi
    depends_on:
      temporal:
        condition: service_healthy

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: openwebui
    restart: always
    pull_policy: never
    environment:
      - WEBUI_AUTH=false
      - GLOBAL_LOG_LEVEL="DEBUG"
      - ENABLE_PERSISTENT_CONFIG=false
      # Native kronk on the host by default. For the containerised kronk
      # (zarf/docker/kronk/compose.yaml) set KRONK_OWU_API_URL=http://kronk:11435/v1.
      - OPENAI_API_BASE_URL=${KRONK_OWU_API_URL:-http://host.docker.internal:11435/v1}
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      - WHISPER_MODEL_AUTO_UPDATE=false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8081:11435"
    volumes:
      - ./openwebui:/app/backend/data
    networks:
      - kronk-net

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: always
    pull_policy: never
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_HTTP_PORT=3100
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/dashboards/kronk.json
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/dashboards
    networks:
      - kronk-net
    depends_on:
      - loki
      - prometheus
      - tempo

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    restart: always
    pull_policy: never
    command: -config.file=/loki-conf/loki.yaml -config.expand-env
    ports:
      - "3101:3101"
    volumes:
      - ./loki:/loki-conf
    networks:
      - kronk-net

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: always
    pull_policy: never
    command:
      - "--storage.tsdb.retention.time=1h"
      - "--config.file=/prom-conf/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus/"
      - "--log.level=debug"
      - "--web.enable-remote-write-receiver"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/prom-conf
    networks:
      - kronk-net

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: always
    pull_policy: never
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:3102
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "3102:3102"
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kronk-net
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    restart: always
    pull_policy: never
    command: -config.file=/tempo-conf/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
      - "14268:14268"
    volumes:
      - ./tempo:/tempo-conf
    networks:
      - kronk-net

# Fixed name so zarf/docker/kronk/compose.yaml joins the same network and
# Prometheus can reach the containerised kronk as kronk:11445. Keep this
# block identical to the one in zarf/docker/kronk/compose.yaml.
networks:
  kronk-net:
    name: kronk-net
    driver: bridge

volumes:
  alloy-data:
  moxie-postgres-data:
  temporal-bootstrap:
