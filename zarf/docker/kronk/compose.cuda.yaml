# NVIDIA GPU override. Requires the NVIDIA Container Toolkit on the host.
#
#   docker compose -f compose.yaml -f compose.cuda.yaml up -d
#
# Equivalent to `docker run --runtime=nvidia --gpus all` in the Dockerfile
# header. To use specific cards, replace `count: all` with
# `device_ids: ["0", "1"]` (indices or UUIDs from `nvidia-smi -L`).

services:
  kronk:
    image: ghcr.io/ardanlabs/kronk:${KRONK_IMAGE_VERSION:-latest}-${KRONK_IMAGE_VARIANT:-cuda}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
