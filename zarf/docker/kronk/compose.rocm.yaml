# Kronk model server — Docker Compose, AMD GPU using ROCm (linux/amd64 only).
#
#   docker compose -f compose.rocm.yaml up -d
#
# Equivalent to the ROCm `docker run` in the Dockerfile header. The image
# resolves `render` to GID 110; if the host's render group differs, set
# KRONK_RENDER_GID="$(getent group render | cut -d: -f3)" (same for video).
#
# Optional pass-through variables (only set in the container when set on
# the host):
#   HIP_VISIBLE_DEVICES       pick GPUs, e.g. 0,1
#   HSA_OVERRIDE_GFX_VERSION  for GPUs ROCm does not list and fails to
#                             detect, e.g. 10.3.0 (RDNA2) or 11.0.0 (RDNA3)
#
# Variables, the volume and the network are described in compose.yaml. This
# file repeats its settings; keep them in sync.

name: kronk

services:
  kronk:
    image: ghcr.io/ardanlabs/kronk:${KRONK_IMAGE_VERSION:-latest}-rocm
    container_name: kronk
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - ${KRONK_VIDEO_GID:-video}
      - ${KRONK_RENDER_GID:-render}
    security_opt:
      - seccomp=unconfined
    environment:
      - KRONK_DOWNLOAD_ENABLED=${KRONK_DOWNLOAD_ENABLED:-true}
      # The debug server (metrics, pprof, statsviz) defaults to 127.0.0.1
      # inside the container, which makes the published port unreachable.
      - KRONK_WEB_DEBUG_HOST=0.0.0.0:11445
      # Optional pass-through, only set in the container when set on the host.
      - KRONK_TEMPO_HOST
      - HIP_VISIBLE_DEVICES
      - HSA_OVERRIDE_GFX_VERSION
    ports:
      - "${KRONK_BIND_ADDR:-127.0.0.1}:11435:11435"
      - "${KRONK_BIND_ADDR:-127.0.0.1}:11445:11445"
    volumes:
      - kronk-data:/kronk
    networks:
      - kronk-net

# Shared with zarf/docker/compose.yaml so Prometheus can scrape kronk:11445
# when both stacks run. Either stack can be started first. Keep this block
# identical to the one in zarf/docker/compose.yaml: some Compose versions
# recreate a network whose definition differs, which fails while the other
# stack is still attached.
networks:
  kronk-net:
    name: kronk-net
    driver: bridge

volumes:
  kronk-data:
    name: kronk-data
