version: 1

# ==============================================================================
# SERVER OPTIONS
#
# Kronk Model Server settings. Environment variables and `kronk server start`
# flags override values configured here. See Chapter 8 of the manual for the
# complete schema and precedence rules.
#
# Replace `kms: {}` below with the settings that need an override. For example:
# kms:
#   web:
#     api-host: 127.0.0.1:11435
#     debug-host: 127.0.0.1:11445
#     read-timeout: 30s
#     write-timeout: 61m
#     inference-timeout: 60m
#     idle-timeout: 1m
#     shutdown-timeout: 1m
#     cors-allowed-origins: ["*"]
#     admin:
#       enabled: true
#       password-sha-256: <64 hexadecimal characters>
#   auth:
#     host: ""
#     admin-enabled: false
#     tls:
#       enabled: false
#       ca-file: ""
#       server-name: ""
#     local:
#       issuer: kronk project
#       enabled: false
#   authorization:
#     mode: open  # open, management, authenticated, full-protected
#   mcp:
#     enabled: true
#     host: ""
#     auth-enabled: false
#     brave-api-key: ""
#   download:
#     enabled: false
#   tempo:
#     host: localhost:4317
#     service-name: kronk
#     probability: 0.25
#   pool:
#     budget-percent: 95
#     models-in-pool: 10
#     ttl: 0m
#   base-path: ""
#   lib-path: ""
#   bucky-lib-path: ""
#   lib-version: ""
#   arch: ""
#   os: ""
#   processor: ""
#   allow-upgrade: false
#   insecure-logging: false
#   hf-token: ""
#   llama-log: 1

# ==============================================================================
# MODEL OPTIONS
#
# KMS runs AutoTune by default. An explicit context-window or nseq-max is a
# fixed sizing constraint and is never silently reduced. Leave cache-type-k and
# cache-type-v unset to let AutoTune try f16 first, then q8_0 for that exact
# context and concurrency. AutoTune never selects a cache type below q8_0. If
# q8_0 still does not fit, the requested context and concurrency are retained
# and the recommendation is reported as not fitting.
#
# example-model:
#   cache-min-tokens: 100                # Min tokens before IMC caches a message (default: 100)
#   admission-timeout: 3m                # Maximum wait for an SDK admission permit (default: 3m)
#   queue-depth: 2                       # Generation admission capacity multiplier (default: 2)
#   cache-type-k: q8_0                   # Explicit KV key type; omit for AutoTune (f16, then q8_0)
#   cache-type-v: q8_0                   # Explicit KV value type; omit for AutoTune (f16, then q8_0)
#   chat-template-kwargs:                # Model-level Jinja defaults; wire requests use chat_template_kwargs
#     preserve_thinking: true            # Template-only; configure here rather than under sampling-parameters
#   context-window: 8192                 # Per-sequence token capacity; explicit value is fixed
#   devices: [CUDA0, CUDA1]              # Devices to use (run `kronk devices` to list)
#   flash-attention: auto                # Flash Attention: enabled, disabled, auto (default: auto)
#   imc-session-capacity: 8              # Reusable IMC identities (default: nseq-max * max(3, queue-depth))
#   incremental-cache: true              # Incremental message caching (IMC) for agentic workflows (default: true)
#   insecure-logging: false              # Log potentially sensitive data like message content (debug only)
#   main-gpu: 0                          # Primary GPU index for single-GPU mode
#   ngpu-layers: 0                       # GPU layers to offload (0 = all, -1 = none, N = specific count)
#   nseq-max: 2                          # Parallel sequences; explicit value is fixed
#   nthreads: 0                          # Threads for generation (0 = llama.cpp default)
#   nthreads-batch: 0                    # Threads for batch processing (0 = llama.cpp default)
#   prefill-batch-size: 2048             # Prompt tokens processed per prefill decode contribution (default: 2048)
#   numa: distribute                     # NUMA strategy: "" (off), distribute, isolate, numactl, mirror
#   offload-kqv: true                    # Offload KV cache to GPU (false = keep on CPU)
#   op-offload: true                     # Offload tensor operations to GPU (false = keep on CPU)
#   op-offload-min-batch: 0              # Min batch size before host tensor ops are offloaded (0 = default)
#   proj-on-cpu: true                    # Force multimodal projector (mmproj) onto CPU
#   proj-device: CUDA1                    # Explicit mmproj device; omit for automatic (conflicts with proj-on-cpu: true)
#   rope-freq-base: 1000000              # RoPE base frequency (nil = from model, e.g., 10000 Llama, 1000000 Qwen)
#   rope-freq-scale: 0.25                # RoPE frequency scale (nil = auto-calculated)
#   rope-scaling-type: yarn              # RoPE scaling: none, linear, yarn
#   session-store-kind: ram              # IMC session storage backend (currently ram only)
#   speculation: auto                    # auto, disabled, classic, or mtp
#   split-mode: row                      # Multi-GPU split: none, layer, row (row recommended for MoE models)
#   swa-full: true                       # Full KV cache for SWA layers (unset = llama.cpp default; false = compact SWA)
#   template: qwen3.jinja                # Jinja template file override (from templates dir)
#   tensor-buft-overrides: [all-ffn]     # Force tensors to CPU: all-ffn, block:N, or regex
#   tensor-split: [0.6, 0.4]             # Per-device tensor distribution (must match device count)
#   load-mode: auto                      # Model loading: auto (default), mmap, none, mlock, mmap+mlock, direct-io
#   yarn-attn-factor: 1.0                # YaRN attention magnitude scaling (nil = default 1.0)
#   yarn-beta-fast: 32.0                 # YaRN low correction dimension (nil = default 32.0)
#   yarn-beta-slow: 1.0                  # YaRN high correction dimension (nil = default 1.0)
#   yarn-ext-factor: 1.0                 # YaRN extrapolation mix factor (nil = auto, 0 = disable)
#   yarn-orig-ctx: 32768                 # Original training context size (nil = from model)
#
#   # Mixture of Experts (MoE) tensor placement (nested):
#   moe:
#     mode: experts_cpu                  # auto, experts_cpu, experts_gpu, keep_top_n, custom
#     keep-experts-top-n: 4              # Keep experts on GPU for top N layers (only when mode: keep_top_n)
#
#   # Fixed load-time LoRA adapters. Set exactly one of id or path per entry.
#   # An id omits .gguf and resolves under <base-path>/lora; path is absolute.
#   # Kronk does not download adapter files. Scale defaults to 1.0.
#   adapters:
#     - id: org/support                  # Resolves to <base-path>/lora/org/support.gguf
#       scale: 1.0                       # Finite non-negative scale, fixed until model reload
#     - path: /opt/adapters/concise.gguf # Existing llama.cpp-compatible adapter GGUF
#       scale: 0.5
#
#   # Speculative decoding (nested). Set model-id for a separate draft GGUF
#   # (requires nseq-max: 1); omit model-id and set only ndraft to override the
#   # draft-token count for an auto-detected MTP head on the target.
#   draft-model:
#     model-id: org/Draft-Model.Q8_0     # Draft model id (separate-GGUF drafter; requires nseq-max: 1)
#     ndraft: 5                          # Tokens to draft per step (separate-GGUF default 5, MTP default 3)
#     devices: [CUDA0]                   # Devices for the draft model
#     main-gpu: 0                        # Primary GPU index for the draft model
#     ngpu-layers: 0                     # GPU layers for the draft model (0 = all)
#     tensor-split: [1.0]                # Per-device tensor split for the draft model
#
#   # Per-request default sampling parameters (nested):
#   sampling-parameters:
#     temperature: 0.6                   # Sampling temperature
#     top_k: 20                          # Top-K sampling
#     top_p: 0.95                        # Top-P (nucleus) sampling
#     min_p: 0.0                         # Min-P sampling
#     seed: 42                           # Sampling seed (unset = random)
#     max_tokens: 0                      # Max tokens to generate (0 = until stop/EOS)
#     repeat_penalty: 1.0                # Repetition penalty
#     repeat_last_n: 64                  # Tokens to consider for repetition penalty
#     dry_multiplier: 0.0                # DRY repetition penalty multiplier
#     dry_base: 1.75                     # DRY repetition penalty base
#     dry_allowed_length: 2              # DRY allowed sequence length
#     dry_penalty_last_n: -1             # DRY tokens to scan (-1 = context size)
#     xtc_probability: 0.0               # XTC sampling probability
#     xtc_threshold: 0.1                 # XTC sampling threshold
#     xtc_min_keep: 1                    # XTC minimum tokens to keep
#     frequency_penalty: 0.0             # Frequency penalty
#     presence_penalty: 0.0              # Presence penalty
#     enable_thinking: false             # Thinking mode for supported models (default: true)
#     reasoning_effort: low              # Top-level request parameter: none, minimal, low, medium, or high
#     grammar: ""                        # GBNF grammar constraint

# ==============================================================================

kms:
  download:
    enabled: true
  insecure-logging: true

models:
  # nseq-max: 1  ~81GB VRAM
  # nseq-max: 2  NOT SUPPORTED BY LLAMA.CPP YET
  unsloth/GLM-4.5-Air-Q4_K_M/AGENT:
    nseq-max: 1
    context-window: 65536
    sampling-parameters:
      max_tokens: 16384

  # nseq-max: 1  ~54GB VRAM
  # nseq-max: 2  ~82GB VRAM
  unsloth/gemma-4-26B-A4B-it-UD-Q8_K_XL/AGENT:
    context-window: 131072
    chat-template-kwargs:
      preserve_thinking: true
    sampling-parameters:
      max_tokens: 16384

  # nseq-max: 1  ~44GB VRAM
  # nseq-max: 2  ~47GB VRAM
  ornith-ai/Ornith-1.5-35B-Q8_0/AGENT:
    nseq-max: 2
    context-window: 262144
    chat-template-kwargs:
      preserve_thinking: true
    sampling-parameters:
      max_tokens: 16384

  # nseq-max: 1  ~40GB VRAM
  # nseq-max: 2  ~43GB VRAM
  unsloth/mtp-Qwen3.6-35B-A3B-UD-Q8_K_XL/AGENT:
    nseq-max: 2
    context-window: 131072
    chat-template-kwargs:
      preserve_thinking: true
    sampling-parameters:
      max_tokens: 16384

  # nseq-max: 1  ~26GB VRAM
  # nseq-max: 2  ~35GB VRAM
  unsloth/Qwen3.8-27B-UD-Q4_K_XL/AGENT:
    nseq-max: 2
    context-window: 131072
    sampling-parameters:
      max_tokens: 16384
      temperature: 0.7
      top_p: 0.80
      top_k: 20
      enable_thinking: false

  # nseq-max: 1  ~9GB VRAM
  ornith-ai/Ornith-1.5-9B-Q4_K_M/AGENT:
    context-window: 65536
    sampling-parameters:
      max_tokens: 8192
      temperature: 1
      top_k: 20
      top_p: 0.95

  # nseq-max: 1  ~7GB VRAM
  mradermacher/Qwopus3.5-4B-Coder.Q8_0/AGENT:
    context-window: 65536
    sampling-parameters:
      max_tokens: 8192
      temperature: 1
      top_k: 20
      top_p: 0.95
