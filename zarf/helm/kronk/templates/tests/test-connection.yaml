apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kronk.fullname" . }}-test
  labels:
    {{- include "kronk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: liveness
      image: {{ include "kronk.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["curl", "--fail", "--silent", "--show-error", "--connect-timeout", "5", "--max-time", "30", "--retry", "5", "--retry-connrefused"]
      args:
        - http://{{ include "kronk.fullname" . }}:{{ .Values.service.port }}/v1/liveness
