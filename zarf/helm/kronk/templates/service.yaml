apiVersion: v1
kind: Service
metadata:
  name: {{ include "kronk.fullname" . }}
  labels:
    {{- include "kronk.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "kronk.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kronk.fullname" . }}-headless
  labels:
    {{- include "kronk.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 11435
      targetPort: http
  selector:
    {{- include "kronk.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kronk.fullname" . }}-metrics
  labels:
    {{- include "kronk.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "kronk.selectorLabels" . | nindent 4 }}
{{- end }}
