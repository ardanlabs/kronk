{{- if and (include "kronk.keysEnabled" .) (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kronk.keysSecretName" . }}
  labels:
    {{- include "kronk.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.auth.masterPem }}
  master.pem: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.auth.masterJwt }}
  master.jwt: {{ . | b64enc }}
  {{- end }}
{{- end }}
