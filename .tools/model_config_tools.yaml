# Dedicated configuration for the Go reliability, quick-check, and lifecycle tools.
# Start the current source with:
#
#   make server-for-tools
#
# Keep these model IDs and slot counts aligned with .make/tools.mk. The tools
# validate the active settings and fail rather than changing server state.
version: 1

kms:
  download:
    enabled: false
  insecure-logging: false

models:
  # Quick-check fixtures: single-slot text/image workloads with IMC.
  # Separate aliases keep the reliability fixtures' slot counts unchanged.
  unsloth/mtp-Qwen3.6-35B-A3B-UD-Q2_K_XL/QUICK-CHECK: &quick
    nseq-max: 1
    context-window: 32768
    queue-depth: 2
    incremental-cache: true
    speculation: mtp

  unsloth/mtp-Qwen3.6-35B-A3B-UD-Q2_K_XL/QUICK-CHECK-NO-MTP:
    <<: *quick
    speculation: disabled

  unsloth/Qwen3.8-27B-UD-Q4_K_XL/QUICK-CHECK:
    <<: *quick

  # Embedded MTP, four-slot batch load, and multimodal probes.
  unsloth/mtp-Qwen3.6-35B-A3B-UD-Q8_K_XL/AGENT:
    nseq-max: 4
    context-window: 131072
    queue-depth: 2
    incremental-cache: true

  # Companion own-KV MTP probe.
  unsloth/Qwen3.8-27B-UD-Q4_K_XL/AGENT:
    nseq-max: 2
    context-window: 131072
    queue-depth: 2
    incremental-cache: true

  # Single-slot hybrid-state and long-context probes.
  unsloth/Qwen3.8-Flash-Next-UD-Q2_K_XL/AGENT:
    nseq-max: 1
    context-window: 131072
    queue-depth: 2
    incremental-cache: true

  # Separate lifecycle probe; intentionally excluded from test-load-all.
  unsloth/Qwen3-0.6B-Q8_0:
    nseq-max: 1
    context-window: 8192
    queue-depth: 2
    admission-timeout: 100ms
    incremental-cache: true
