name: Promote to Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Intended release label (vX.Y.Z); no tag required
        required: true
        type: string
      commit:
        description: Full tested SHA from an available nightly artifact (normally latest main)
        required: true
        type: string

# Promote the selected nightly evidence before publishing the next day's release.
# Share the measurement lock while reading evidence and updating release storage.
concurrency:
  group: quick-check-pacha
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  GOTOOLCHAIN: local

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version

      - name: Promote tested evidence and save release baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: bash .github/scripts/quick-check.sh promote
