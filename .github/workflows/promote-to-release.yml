name: Promote to Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Intended release label (vX.Y.Z); no tag required
        required: true
        type: string
      commit:
        description: Full tested SHA available in both macOS and Linux Vulkan evidence
        required: true
        type: string

# Serializes promotions only. Nightly workflows read immutable artifacts and
# independently fetch either the outgoing or incoming baseline.
concurrency:
  group: quick-check-promotion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  GOTOOLCHAIN: local

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version

      # Prepare both platforms completely before either results branch is written.
      - name: Prepare both release baselines
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          QUICK_CHECK_PLATFORM=macos-metal bash .github/scripts/quick-check.sh stage-promotion
          QUICK_CHECK_PLATFORM=linux-vulkan bash .github/scripts/quick-check.sh stage-promotion

      - name: Publish macOS Metal baseline and history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
          QUICK_CHECK_PLATFORM: macos-metal
        run: bash .github/scripts/quick-check.sh publish-promotion

      - name: Publish Linux Vulkan baseline and history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
          QUICK_CHECK_PLATFORM: linux-vulkan
        run: bash .github/scripts/quick-check.sh publish-promotion
