name: Promote to Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Intended release label (vX.Y.Z); no tag required
        required: true
        type: string
      commit:
        description: Full tested commit SHA in the retained queue
        required: true
        type: string

# Share the measurement queue lock, including while restoring and replacing it.
concurrency:
  group: quick-check-pacha
  cancel-in-progress: false

permissions:
  # Queue and history are separate commits on quick-check-results, never main.
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version

      - name: Restore retained run queue
        run: bash .github/scripts/quick-check.sh restore

      - name: Promote tested evidence
        id: promote
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: bash .github/scripts/quick-check.sh promote

      - name: Save compact retained run queue
        run: bash .github/scripts/quick-check.sh save-queue

      - name: Commit updated release history
        # Also saves an initialized first-baseline entry, but never before queue.
        env:
          RELEASE: ${{ inputs.release }}
        run: bash .github/scripts/quick-check.sh save-history

      # Preserve recovery/download copies even if a queue/history push failed.
      - name: Package retained run queue
        id: snapshot
        if: ${{ !cancelled() && steps.promote.outcome == 'success' }}
        run: bash .github/scripts/quick-check.sh snapshot

      - name: Upload downloadable reports
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quick-check-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check-baselines.tgz
          retention-days: 90
          if-no-files-found: error
