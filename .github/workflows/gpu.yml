name: GPU

# The model suites again on real GPUs — the coverage no hosted runner can
# provide. One workflow rather than a job in each of linux.yml / macos.yml
# so the suite list at the bottom exists once instead of three times, and
# so every backend is gated by the same rules.
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".github/workflows/gpu.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/test-models.txt"
      - ".github/test-models-gpu.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".github/workflows/gpu.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/test-models.txt"
      - ".github/test-models-gpu.txt"
  workflow_dispatch:

# Same grouping as linux.yml / macos.yml: `head_ref || ref` collapses the
# duplicate runs a PR branch gets from both push and pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GOTOOLCHAIN=local so a dependency that raises its `go` directive above
# .go-version fails loudly instead of pulling a toolchain. KRONK_PROCESSOR
# is per-matrix-entry, not here — picking the backend is this workflow's
# entire job.
env:
  GOTOOLCHAIN: local

jobs:
  # Every backend Kronk ships a GPU bundle for and we own hardware to run:
  #
  #   Vulkan — what bucky lands on regardless (whisper.cpp publishes no
  #            ROCm bundle) and what non-ROCm AMD hosts use.
  #   ROCm   — what detectHostFallback picks whenever rocminfo reports a
  #            GPU (sdk/tools/libs/runtime_selection.go:313), so it is the
  #            default path for a user with an AMD box.
  #   Metal  — what every macOS user runs.
  #
  # A matrix rather than a job per backend so the suite list cannot drift
  # between them. fail-fast is off: one backend regressing must not cancel
  # the others, or the report can't say which broke.
  #
  # runs-on comes from the matrix, so each leg lands on the fleet built for
  # it — a runner image is built for one backend and labelled for that one
  # alone (zarf/docker/runner/Dockerfile for the Linux fleets; the macOS
  # runners are Sand-managed and carry `sand,metal`).
  #
  # THE COST: an unmatched runs-on does not fail, it queues, silently,
  # until the 24h run limit. Every backend listed here needs a fleet
  # claiming its label. Retiring a fleet means dropping its entry in the
  # same change.
  #
  # KRONK_PROCESSOR is strict (sdk/tools/libs/libs.go:234), so a missing
  # bundle fails here instead of silently degrading to CPU. Only llama is
  # strict: `kronk bucky libs --local` maps rocm to vulkan on its own,
  # since whisper.cpp has no ROCm build.
  #
  # Fork PRs are skipped outright. kronk is public and none of these
  # runners are ephemeral, so untrusted code must never land on them.
  # Skipped counts as passing for branch protection, so these stay safe to
  # mark required; linux.yml's hosted fallback is what covers forks.
  gpu-tests:
    name: GPU tests (${{ matrix.backend }})
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `processor` is both KRONK_PROCESSOR's value and the runner
          # label, because the runner images use Kronk's own backend names.
          # `device` is the TYPE column `kronk devices` prints for that
          # backend (cmd/kronk/devices/cmd.go deviceType).
          - backend: Vulkan
            processor: vulkan
            device: GPU (Vulkan)
            runs_on: [self-hosted, Linux, X64, gpu, vulkan]
            extra_models: .github/test-models-gpu.txt
          - backend: ROCm
            processor: rocm
            device: GPU (ROCm)
            runs_on: [self-hosted, Linux, X64, gpu, rocm]
            extra_models: .github/test-models-gpu.txt
          - backend: Metal
            processor: metal
            device: GPU (Metal)
            runs_on: [self-hosted, macOS, ARM64, sand, metal]
            # Empty for now, deliberately. The macOS runners are ephemeral
            # VMs; setup-kronk redirects their models onto a persistent host
            # mount, so the download is no longer per-job — but those models
            # are then read over virtiofs, and nothing has yet measured what
            # mmap-ing a 35B GGUF across that share costs. The base 6.6 GiB
            # set will answer that. Until it does, the extra 26B/35B targets
            # stay on the Linux legs, where they cover the MTP path on two
            # backends already. Flip this to the GPU list once the Metal
            # timings look sane.
            extra_models: ""
    env:
      KRONK_PROCESSOR: ${{ matrix.processor }}
    steps:
      # Both GPU probes, not just this leg's: when the assertion below
      # fails, the first question is whether the other backend saw the
      # device either (driver/permission problem) or not (bundle problem).
      - name: Runner specs (Linux)
        if: runner.os == 'Linux'
        run: |
          nproc
          free -h
          vulkaninfo --summary 2>/dev/null | head -20 || echo "vulkaninfo unavailable"
          rocminfo 2>/dev/null | grep -Ei 'Name:|Marketing|gfx' | head -20 || echo "rocminfo unavailable"

      - name: Runner specs (macOS)
        if: runner.os == 'macOS'
        run: |
          sysctl -n machdep.cpu.brand_string
          echo "cores : $(sysctl -n hw.ncpu)"
          echo "memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || echo "SPDisplaysDataType unavailable"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          # Same key the CPU workflows use, so all jobs on a given OS share
          # one models cache. The GPU-only list is folded in so the key still
          # tracks every model these jobs need; it changes nothing today
          # because every leg here is self-hosted and setup-kronk gates its
          # cache layers on hosted runners.
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt', '.github/test-models-gpu.txt') }}
          # Models too large for the base list — see that file's header.
          extra-models-file: ${{ matrix.extra_models }}

      # Raises the Metal capabilities the guest reports to what real Apple
      # Silicon has, so the suites below run the kernels users actually run
      # rather than the Apple5 fallback path. Host-side setup (build the
      # dylib, mount kronk-tools) is zarf/macos/build-metal-shim.sh and the
      # sand.yml stanza documented beside it.
      #
      # Copied to RUNNER_TEMP rather than injected straight off the share:
      # dyld loading a dylib over virtiofs is a question nobody needs to
      # answer at 3am.
      - name: Stage Metal capability shim
        if: matrix.processor == 'metal'
        run: |
          src="/Volumes/My Shared Files/kronk-tools/LumeMetalCapabilities.dylib"
          if [[ ! -f "$src" ]]; then
            echo "::error::$src is missing. On the runner host, build it with zarf/macos/build-metal-shim.sh and add the kronk-tools mount to ~/sand.yml."
            exit 1
          fi
          cp "$src" "$RUNNER_TEMP/LumeMetalCapabilities.dylib"

          # DYLD_INSERT_LIBRARIES reaches every child process, and /usr/bin is
          # arm64e: a single-slice arm64 dylib aborts `tee`, `sw_vers` and
          # everything else in the tree with "incompatible architecture".
          if [[ "$(lipo -archs "$RUNNER_TEMP/LumeMetalCapabilities.dylib")" != *arm64e* ]]; then
            echo "::error::staged shim has no arm64e slice; rebuild it on the host with zarf/macos/build-metal-shim.sh"
            exit 1
          fi

      # KRONK_PROCESSOR only guarantees the library bundle. ggml can load
      # the Vulkan, HIP or Metal build and still enumerate zero devices of
      # that type, in which case every suite below runs on the CPU backend
      # and passes.
      # The shim is scoped to `kronk devices` alone here, not set for the
      # whole step. DYLD_INSERT_LIBRARIES is inherited by children, and
      # `kronk diagnose` shells out to sw_vers/sysctl/vm_stat and parses
      # their COMBINED output (sdk/tools/diagnose/system_darwin.go:15), so an
      # injected process writing a banner to stderr lands in the field that
      # parser reads and turns cpuModel and ramBytes into nonsense. Keeping
      # diagnose unshimmed keeps the first thing you read when a runner
      # misbehaves trustworthy.
      #
      # A shell prefix rather than `env`, and `>` rather than `tee`, so no
      # extra process joins the shimmed environment just to move bytes.
      - name: Verify ${{ matrix.backend }} backend
        env:
          DEVICE_TYPE: ${{ matrix.device }}
          METAL_SHIM: ${{ matrix.processor == 'metal' && format('{0}/LumeMetalCapabilities.dylib', runner.temp) || '' }}
        run: |
          kronk diagnose --no-bench --format json

          if [[ -n "$METAL_SHIM" ]]; then
            DYLD_INSERT_LIBRARIES="$METAL_SHIM" \
            LUME_METAL_APPLE_FAMILY_MAX=1009 \
            LUME_METAL_MAX_THREADGROUP_MEMORY=32768 \
              kronk devices > "$RUNNER_TEMP/devices.txt" 2>&1
          else
            kronk devices > "$RUNNER_TEMP/devices.txt" 2>&1
          fi
          cat "$RUNNER_TEMP/devices.txt"
          if ! grep -qF "$DEVICE_TYPE" "$RUNNER_TEMP/devices.txt"; then
            echo "::error::no $DEVICE_TYPE device enumerated; the suites would run on CPU"
            exit 1
          fi

          # The shim fails OPEN: a guest image bump that moves the private
          # Metal internals it hooks leaves every process untouched, and the
          # leg then runs llama.cpp's Apple5 fallback kernels — which no real
          # Mac uses — while staying green. These checks are what notice.
          #
          # Deliberately asymmetric: an explicit `false` fails the leg, an
          # ABSENT line only warns. Neither line is guaranteed to reach this
          # log. ggml's banner appears only when device init logs here, and
          # the shim announces itself through NSLog, which reaches stderr when
          # attached to a terminal and the unified log otherwise — a CI step
          # is not a terminal. Treating "missing" as "broken" would fail the
          # leg for a logging detail rather than a capability regression.
          # Tighten to a hard requirement once a real run shows both lines
          # present.
          if [[ "${{ matrix.processor }}" == "metal" ]]; then
            if grep -qE 'simdgroup reduction *= *false' "$RUNNER_TEMP/devices.txt"; then
              echo "::error::Metal capability shim is not in effect: llama.cpp resolved simdgroup reduction = false, so the suites would run the Apple5 fallback path. See zarf/macos/README.md."
              exit 1
            fi

            if ! grep -qE 'simdgroup reduction *= *true' "$RUNNER_TEMP/devices.txt"; then
              echo "::warning::could not confirm Metal capabilities from this log; ggml printed no simdgroup line. Check whether the shim is live before trusting this leg."
            fi

            if ! grep -q 'LumeMetalCapabilities. Enabled' "$RUNNER_TEMP/devices.txt"; then
              echo "::notice::shim activation banner absent from this log (expected if NSLog went to the unified log rather than stderr); the capability check above is authoritative."
            fi
          fi

      - name: Run model suites on GPU
        env:
          # The macOS runners are VMs whose paravirtual GPU reports
          # MTLGPUFamilyApple5, below llama.cpp's Apple7/Metal3 gate, so
          # without this the Metal leg exercises CPU fallbacks no real Mac
          # ever takes. See zarf/macos/README.md. Empty on the Linux legs.
          DYLD_INSERT_LIBRARIES: ${{ matrix.processor == 'metal' && format('{0}/LumeMetalCapabilities.dylib', runner.temp) || '' }}
          LUME_METAL_APPLE_FAMILY_MAX: ${{ matrix.processor == 'metal' && '1009' || '' }}
          # Pinned to what real Apple Silicon reports. The shim defaults to
          # 65536, which no shipping Mac has.
          LUME_METAL_MAX_THREADGROUP_MEMORY: ${{ matrix.processor == 'metal' && '32768' || '' }}
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 10m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 10m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid

      # The MTP speculation path, which the classic drafter above does not
      # cover. Separate step because it needs the 26B/35B targets in
      # .github/test-models-gpu.txt, which only the legs with a persistent
      # ~/.kronk pull — see the matrix's extra_models. Longer timeout: those
      # targets are far larger than the 1.7B the other suites load.
      - name: Run MTP suites on GPU
        if: matrix.extra_models != ''
        # Skipped on Metal today (extra_models is empty), but carried here so
        # that flipping the matrix on cannot silently drop the shim.
        env:
          DYLD_INSERT_LIBRARIES: ${{ matrix.processor == 'metal' && format('{0}/LumeMetalCapabilities.dylib', runner.temp) || '' }}
          LUME_METAL_APPLE_FAMILY_MAX: ${{ matrix.processor == 'metal' && '1009' || '' }}
          LUME_METAL_MAX_THREADGROUP_MEMORY: ${{ matrix.processor == 'metal' && '32768' || '' }}
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -count=1 -timeout 20m -run '^(TestSuite|TestSuiteMultiSlot)$' ./sdk/kronk/tests/mtp
          go test -v -count=1 -timeout 20m -run '^(TestSuite|TestSuiteMultiSlot)$' ./sdk/kronk/tests/gemma4mtp
