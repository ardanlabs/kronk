name: macOS

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/macos.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/macos.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job is skipped on a fork PR. kronk is public and this runner is
# not ephemeral, so untrusted code must never land on it. There is no
# hosted fallback: macos-latest cannot hold the 6.6 GiB model set.
# Forks are covered by linux.yml. Skipped counts as passing for branch
# protection, so these stay safe to mark required.
#
# KRONK_PROCESSOR=metal, and it is not a choice: it is the truth this gate
# spent a while denying. It read `cpu` before, on the theory that Metal was
# gpu.yml's business alone. But darwin/arm64 publishes exactly ONE llama.cpp
# artifact — `cpu` and `metal` both resolve to llama-<tag>-bin-macos-arm64
# (yzma pkg/download/resolver.go:202-217) — so the bundle always contains
# libggml-metal, libggml.dylib links it at load time, and NGpuLayers defaults
# to all-layers-on-GPU (sdk/kronk/model/model.go:522-523). Every job below
# that loads a model ran Metal regardless of this value; run 33859967144
# printed `MTLGPUFamilyApple5 (1005)` and `simdgroup reduction = false` while
# claiming to be a CPU gate.
#
# So name it. Not to fix the test suites' idea of the backend — testlib's
# Processor() asks ggml which devices it enumerated, so it answers "metal"
# whatever this says — but because the log, the bundle directory and the
# install path all carry this value, and every one of them lied. Setting it
# at all also bypasses host detection (sdk/tools/libs/libs.go:234), so a
# darwin/arm64 metal bundle that stops publishing fails here rather than
# degrading quietly to something else.
#
# Naming it also obliges us to make it representative: setup-kronk stages the
# Metal capability shim on every macOS job, and the steps that run models
# inject it. Without that, this gate is a strictly worse copy of gpu.yml's
# Metal leg — same backend, minus the thing that makes the VM's paravirtual
# GPU behave like the hardware users have. See zarf/macos/README.md.
env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: metal

jobs:
  static:
    name: Static checks
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version
          # Hosted only: on self-hosted the module and build caches
          # already persist in a local volume, so the upload is pure
          # cost and fails once the cache budget is exhausted.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: gofmt
        run: |
          fmt="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$fmt" ]]; then
            printf '%s\n' "$fmt"
            echo "::error::Go files need gofmt -s -w"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck -checks=all ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: go fix
        run: |
          fix_diff="$(go fix -diff ./...)"
          if [[ -n "$fix_diff" ]]; then
            printf '%s\n' "$fix_diff"
            echo "::error::go fix would modify files"
            exit 1
          fi

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: check

  race:
    name: Race detector (sdk unit packages)
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      # Not shimmed, deliberately. -short skips every test here that loads a
      # model, so nothing in this job reaches a Metal kernel — run
      # 33859967144's race job printed no ggml_metal_device_init at all. If a
      # test here starts loading a model, inject the shim the way api-tests
      # and sdk-tests below do; otherwise it would quietly run the Apple5
      # fallback path.
      - name: go test -race -short (sdk unit packages)
        run: |
          go test -race -short -count=1 -timeout 10m \
            $(go list ./sdk/... \
              | grep -v '/sdk/kronk/tests' \
              | grep -v '/sdk/kronk/pool' \
              | grep -v '/sdk/bucky/tests')

  api-tests:
    name: api/service tests
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # actions/cache/save uses the actions API
    steps:
      - name: Runner specs
        run: |
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory bytes: $(sysctl -n hw.memsize)"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        id: setup
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: Run api/service tests
        env:
          # The shim setup-kronk staged. Injected per-step, never through
          # $GITHUB_ENV, so it reaches neither checkout nor cleanup nor any
          # `kronk diagnose` invocation — that parser reads the combined
          # output of the commands it shells out to, and the shim's NSLog
          # banner would become the CPU model. Whole-step injection is safe
          # here because the only shell-out under test is ffmpeg
          # (sdk/bucky/ffmpeg/ffmpeg.go:95), which carries its data on stdout
          # and reads stderr only for an error tail. See zarf/macos/README.md.
          DYLD_INSERT_LIBRARIES: ${{ runner.temp }}/LumeMetalCapabilities.dylib
          LUME_METAL_APPLE_FAMILY_MAX: "1009"
          # Pinned to what real Apple Silicon reports. The shim defaults to
          # 65536, which no shipping Mac has.
          LUME_METAL_MAX_THREADGROUP_MEMORY: "32768"
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -p=1 -count=1 -timeout 20m ./cmd/kronk/...
          go test -v -p=1 -count=1 -timeout 20m ./cmd/server/...

      - name: Save models cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.setup.outputs.models-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.kronk/models
            ~/.kronk/bucky-models
          key: ${{ steps.setup.outputs.models-cache-key }}

  sdk-tests:
    name: sdk tests
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: Run sdk tests
        env:
          # The shim setup-kronk staged. Injected per-step, never through
          # $GITHUB_ENV, so it reaches neither checkout nor cleanup nor any
          # `kronk diagnose` invocation — that parser reads the combined
          # output of the commands it shells out to, and the shim's NSLog
          # banner would become the CPU model. Whole-step injection is safe
          # here because the only shell-out under test is ffmpeg
          # (sdk/bucky/ffmpeg/ffmpeg.go:95), which carries its data on stdout
          # and reads stderr only for an error tail. See zarf/macos/README.md.
          DYLD_INSERT_LIBRARIES: ${{ runner.temp }}/LumeMetalCapabilities.dylib
          LUME_METAL_APPLE_FAMILY_MAX: "1009"
          # Pinned to what real Apple Silicon reports. The shim defaults to
          # 65536, which no shipping Mac has.
          LUME_METAL_MAX_THREADGROUP_MEMORY: "32768"
        run: |
          export RUN_IN_PARALLEL=no
          go -C examples test -v -count=1 -timeout 2m ./session-store
          go test -v -p=1 -count=1 -timeout 20m $(go list ./sdk/... | grep -v '/sdk/kronk/tests')
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 6m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 6m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid
