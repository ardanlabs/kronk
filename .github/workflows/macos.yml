name: macOS

# Darwin/Apple-Silicon coverage on the self-hosted mac (kronk-runner-1).
#
# This workflow was previously `workflow_dispatch`-only, so nothing on a PR
# ever exercised the macOS build or the Metal backend. It now gates pushes to
# main and same-repo pull requests, matching linux.yml.
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/macos.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/macos.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  workflow_dispatch:

# There is exactly one macOS runner, so cancelling superseded runs is what
# keeps a burst of pushes from queueing behind itself. `head_ref || ref`
# collapses the duplicate push+pull_request runs on a PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Fork policy
#
# Unlike linux.yml, which falls back to `ubuntu-latest` for fork PRs, every
# job here is SKIPPED on a fork PR. There is no hosted fallback in play:
# `macos-latest` is a ~3-core / 7 GiB machine with ~14 GiB free disk, and the
# model suites alone pull ~6.6 GiB of GGUFs, so routing forks there would buy
# flaky OOM/disk-full failures rather than signal. Fork contributors are
# covered by the Linux workflow on hosted runners.
#
# Never remove the `if:` guard without adding a hosted fallback. kronk is a
# public repository and the mac runner is not ephemeral — a fork PR scheduled
# onto it would run untrusted code against a $HOME that persists into every
# later job.
#
# Skipped jobs report as "skipped", which GitHub counts as passing for branch
# protection, so these can safely be marked required.
# ---------------------------------------------------------------------------

# KRONK_PROCESSOR=cpu pins the four gating jobs to the CPU llama.cpp bundle.
# This is a deliberate change from the previous behavior, where every macOS
# job silently ran on Metal via host auto-detection: the gate is now
# byte-for-byte comparable with the Linux gate, and Metal gets its own
# explicit, clearly-labeled job below rather than being an implicit default
# nobody could see in the logs. Net coverage goes up, not down — both run on
# every PR.
#
# An explicit processor is strict; Kronk does not substitute another runtime
# (sdk/tools/libs/libs.go:234). Both `darwin/arm64/cpu` and `darwin/arm64/metal`
# are published combinations (sdk/tools/libs/combinations.go).
env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: cpu

jobs:
  static:
    name: Static checks
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version

      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: gofmt
        run: |
          fmt="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$fmt" ]]; then
            printf '%s\n' "$fmt"
            echo "::error::Go files need gofmt -s -w"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck -checks=all ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: go fix
        run: |
          fix_diff="$(go fix -diff ./...)"
          if [[ -n "$fix_diff" ]]; then
            printf '%s\n' "$fix_diff"
            echo "::error::go fix would modify files"
            exit 1
          fi

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: check

  race:
    name: Race detector (sdk unit packages)
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: go test -race -short (sdk unit packages)
        run: |
          go test -race -short -count=1 -timeout 10m \
            $(go list ./sdk/... \
              | grep -v '/sdk/kronk/tests' \
              | grep -v '/sdk/kronk/pool' \
              | grep -v '/sdk/bucky/tests')

  api-tests:
    name: api/service tests
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # actions/cache/save uses the actions API
    steps:
      - name: Runner specs
        run: |
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory bytes: $(sysctl -n hw.memsize)"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        id: setup
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      # NOTE: this job used to re-run the exact `go test -race -short` command
      # that the `race` job above already runs. With a single macOS runner the
      # jobs execute back to back rather than in parallel, so the duplicate was
      # pure added wall-clock on the critical path. Removed.

      - name: Run api/service tests
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -p=1 -count=1 -timeout 20m ./cmd/kronk/...
          go test -v -p=1 -count=1 -timeout 20m ./cmd/server/...

      - name: Save models cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.models-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.kronk/models
            ~/.kronk/bucky-models
          key: ${{ steps.setup.outputs.models-cache-key }}

  sdk-tests:
    name: sdk tests
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: Run sdk tests
        run: |
          export RUN_IN_PARALLEL=no
          go -C examples test -v -count=1 -timeout 2m ./session-store
          go test -v -p=1 -count=1 -timeout 20m $(go list ./sdk/... | grep -v '/sdk/kronk/tests')
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 6m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 6m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid

  # ---------------------------------------------------------------------------
  # gpu-tests
  #
  # The Metal counterpart to linux.yml's ROCm job, and the reason the mac
  # runner is worth gating on: Apple Silicon GPU inference is what most Kronk
  # users on macOS actually run, and no hosted runner can exercise it.
  #
  # KRONK_PROCESSOR=metal overrides the workflow-level `cpu` pin and is
  # strict, so a missing Metal bundle fails this job instead of quietly
  # degrading to CPU and reporting green.
  #
  # Library bundles install per-triple (<root>/<os>/<arch>/<processor>/), so
  # the metal bundle coexists with the cpu bundle the gating jobs use.
  # ---------------------------------------------------------------------------
  gpu-tests:
    name: GPU tests (Metal)
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, macOS, ARM64, sand]
    timeout-minutes: 45
    env:
      KRONK_PROCESSOR: metal
    steps:
      - name: Runner specs
        run: |
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory bytes: $(sysctl -n hw.memsize)"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      # Fail fast with a readable message if the Metal bundle did not land,
      # instead of letting every suite below time out.
      - name: Verify Metal backend
        run: |
          kronk diagnose --no-bench --format json
          kronk devices

      - name: Run model suites on GPU
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 10m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 10m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid
