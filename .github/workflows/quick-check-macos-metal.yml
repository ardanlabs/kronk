name: Quick-check macOS Metal

on:
  workflow_dispatch:
  schedule:
    # Miami local time; GitHub advances a skipped spring-forward hour to 03:00.
    - cron: '0 2 * * *'
      timezone: America/New_York

# Serializes macOS measurements only; Linux has a separate lock.
# Do not cancel an existing measurement when another invocation is queued.
concurrency:
  group: quick-check-macos-metal
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: metal
  QUICK_CHECK_PLATFORM: macos-metal

jobs:
  matrix:
    runs-on: [self-hosted, macOS, ARM64, sand, metal]
    timeout-minutes: 180
    steps:
      - name: Checkout tested code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check latest finalized nightly evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/quick-check.sh prepare

      - name: Set up Kronk
        if: steps.prepare.outputs.skip == 'false'
        uses: ./.github/actions/setup-kronk

      - name: Download quick-check models
        if: steps.prepare.outputs.skip == 'false'
        run: |
          kronk model pull --local unsloth/mtp-Qwen3.6-35B-A3B-UD-Q2_K_XL
          kronk model pull --local ornith-ai/Ornith-1.5-9B-Q8_0

      - name: Build and start tools server
        if: steps.prepare.outputs.skip == 'false'
        env:
          # Scope injection to the server, not quick-check's machine probes.
          DYLD_INSERT_LIBRARIES: ${{ runner.temp }}/LumeMetalCapabilities.dylib
          LUME_METAL_APPLE_FAMILY_MAX: "1009"
          LUME_METAL_MAX_THREADGROUP_MEMORY: "32768"
        run: bash .github/scripts/quick-check.sh start

      - name: Run complete matrix
        id: check
        if: steps.prepare.outputs.skip == 'false'
        run: make quick-check-this-code QUICK_CHECK_ARGS='-out .tools/quick-check/output/macos-metal'

      # All artifact preparation and transfers happen outside server/tool time.
      - name: Stop server and collect diagnostics
        if: ${{ always() && steps.prepare.outputs.skip == 'false' }}
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          RUNNER_IDENTITY: ${{ runner.name }}
        run: bash .github/scripts/quick-check.sh finish

      - name: Compare release baseline
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        run: bash .github/scripts/quick-check.sh compare

      # Preserve full finalized evidence, including failed/interrupted results.
      - name: Package nightly evidence
        id: snapshot
        if: ${{ always() && steps.check.outcome != 'skipped' && steps.check.outcome != '' }}
        run: bash .github/scripts/quick-check.sh package

      - name: Save nightly evidence
        id: upload
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quick-check-macos-metal-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check-run.tgz
          retention-days: 90
          if-no-files-found: error

      - name: Keep latest two platform artifacts
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: bash .github/scripts/quick-check.sh prune
