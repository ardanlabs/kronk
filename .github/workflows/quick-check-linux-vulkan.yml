name: Quick-check Linux Vulkan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
      timezone: America/New_York

# Independent of macOS; unrelated Linux jobs can still use the same GPU.
concurrency:
  group: quick-check-linux-vulkan
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: vulkan
  QUICK_CHECK_PLATFORM: linux-vulkan
  QUICK_CHECK_BENCHMARK_ID: linux-vulkan-runner

jobs:
  matrix:
    runs-on: [self-hosted, Linux, X64, gpu, vulkan]
    timeout-minutes: 180
    steps:
      - name: Checkout tested code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check workflow tools
        run: |
          for tool in gh jq unzip; do command -v "$tool"; done

      - name: Check latest finalized nightly evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/quick-check.sh prepare

      - name: Set up Kronk
        if: steps.prepare.outputs.skip == 'false'
        uses: ./.github/actions/setup-kronk

      - name: Download quick-check models
        if: steps.prepare.outputs.skip == 'false'
        run: |
          kronk model pull --local unsloth/mtp-Qwen3.6-35B-A3B-UD-Q2_K_XL
          kronk model pull --local ornith-ai/Ornith-1.5-9B-Q8_0

      - name: Build and start tools server
        if: steps.prepare.outputs.skip == 'false'
        run: bash .github/scripts/quick-check.sh start

      - name: Run complete matrix
        id: check
        if: steps.prepare.outputs.skip == 'false'
        run: make quick-check-this-code QUICK_CHECK_ARGS='-out .tools/quick-check/output/linux-vulkan'

      - name: Stop server and collect diagnostics
        if: ${{ always() && steps.prepare.outputs.skip == 'false' }}
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          RUNNER_IDENTITY: ${{ runner.name }}
        run: bash .github/scripts/quick-check.sh finish

      - name: Compare release baseline
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        run: bash .github/scripts/quick-check.sh compare

      - name: Package nightly evidence
        id: snapshot
        if: ${{ always() && steps.check.outcome != 'skipped' && steps.check.outcome != '' }}
        run: bash .github/scripts/quick-check.sh package

      - name: Save nightly evidence
        id: upload
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quick-check-linux-vulkan-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check-run.tgz
          retention-days: 90
          if-no-files-found: error

      - name: Keep latest two platform artifacts
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: bash .github/scripts/quick-check.sh prune
