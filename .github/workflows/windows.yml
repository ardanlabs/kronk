name: Windows

# Build and vet only: the suites need native bundles and setup-kronk has no
# Windows path. `go vet` type-checks _test.go, so uncompilable tests still fail.
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".github/workflows/windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build and vet
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: .go-version

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Build kronk CLI
        run: go build -o "${RUNNER_TEMP}/kronk.exe" ./cmd/kronk
