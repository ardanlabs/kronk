name: Linux
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/linux.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/linux.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/test-models.txt"
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new commit
# arrives. Using `head_ref || ref` collapses the duplicate runs that
# otherwise fire from both the `push` and `pull_request` events on a PR
# branch (they have different github.ref values and would not cancel
# each other if grouped by ref alone).
#
# This matters more now than it did on hosted runners: there is a single
# self-hosted Linux runner, so a superseded run that is not cancelled
# occupies the only executor and delays the run that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Minimum-required token scopes per job. Nothing in this workflow
# writes to the repo, modifies issues/PRs, publishes packages, or
# talks to OIDC. The api-tests / sdk-tests jobs need `actions: write`
# only to be able to save the models cache (actions/cache/save uses
# the actions API).
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Runner selection
#
# `runs-on` below resolves to the self-hosted Linux runner for anything
# originating in this repository (pushes to main, same-repo PR branches,
# manual dispatch) and to `ubuntu-latest` for pull requests opened from a
# fork.
#
# The fork carve-out is not optional. kronk is a PUBLIC repository and does
# receive fork PRs, and the self-hosted runners are NOT ephemeral: a fork PR
# scheduled onto one would execute attacker-controlled code on hardware we
# own, with a $HOME that persists into every subsequent job (models, library
# bundles, Go module cache, and the runner's own credentials). GitHub's
# guidance is explicit that self-hosted runners must not be used with public
# repositories for this reason. Routing forks to hosted runners keeps outside
# contributors fully covered by CI without ever touching our hardware.
#
# The expression reads as "the head repo, defaulting to this repo when the
# event has no head repo at all". For push/workflow_dispatch the left side is
# empty and collapses to github.repository, so the comparison is trivially
# true; for a same-repo PR both sides are `ardanlabs/kronk`; for a fork PR the
# left side is the fork and the comparison is false.
#
#   ${{ (github.event.pull_request.head.repo.full_name || github.repository)
#        == github.repository && fromJSON('[...]') || 'ubuntu-latest' }}
#
# Note the labels requested for the CPU jobs are only `self-hosted, Linux,
# X64` — deliberately NOT `gpu`/`rocm`. Those jobs do not need a GPU, so
# they stay schedulable on any future Linux runner that gets added. Only the
# `gpu-tests` job pins the accelerator labels.
# ---------------------------------------------------------------------------

# The workflow runs four independent jobs in parallel on hosted runners.
# They all use `actions/setup-go@v6` pinned to `go-version-file: .go-version`,
# which gives them an identical setup-go cache key (OS + Go version + go.sum
# hash) so the Go module download cache and the build cache ($GOCACHE)
# are shared across jobs and across runs.
#
# CI's toolchain version lives in /.go-version (not go.mod) so that
# contributors building locally with any supported Go release don't get
# silently dragged into a toolchain auto-download by the build system.
# go.mod's `go` directive declares the minimum language version only.
#
#   static     — vet / staticcheck / govulncheck / go fix / gofmt /
#                go mod tidy / goreleaser check. No models, no kronk
#                binary, no libs, no test run. Finishes fast.
#   race       — `go test -race -short` on the SDK unit packages.
#                Uses setup-kronk so unit tests that read real GGUFs
#                (e.g. sdk/tools/models) can run under -race. Split out
#                from static so a flaky/slow race run never gates fast
#                lint feedback.
#   api-tests  — full kronk + libs + models setup, runs cmd/server/...
#                Owns the models-cache save so the two test jobs don't
#                race on save.
#   sdk-tests  — full kronk + libs + models setup, runs sdk/...
#   gpu-tests  — the model-backed capability suites again, but with the
#                ROCm llama.cpp bundle on the AMD GPU. Self-hosted only.
#
# SERIALIZATION WARNING: a self-hosted runner executes ONE job at a time, and
# there is currently a single Linux runner (kronk-linux-gpu-1). The five jobs
# below therefore run back to back rather than in parallel, so wall-clock time
# for a PR is roughly their sum. Registering additional runner processes on
# the same host restores the parallelism.
#
# On the rare cache miss both test jobs download the models in parallel.
# That's wasted CPU but no wall-clock penalty, and avoids a serial
# "prepare-models" job that would slow the common cache-hit case.
#
# GOTOOLCHAIN=local is set on every job so a transitive dependency that
# bumps its `go` directive above .go-version cannot silently force a
# toolchain auto-download in CI — better to fail loudly and bump
# .go-version + check-go-version.sh together.
#
# KRONK_PROCESSOR=cpu pins the llama.cpp bundle for the four gating jobs.
# Without it, `kronk libs --local` probes the host (sdk/tools/libs/
# runtime_selection.go:312 runs `rocminfo`) and would silently pick ROCm on
# the GPU runner, making the gate's results depend on which runner picked up
# the job. An explicit processor is strict — Kronk does not substitute
# another runtime — so the gate stays byte-for-byte comparable with the
# hosted-runner path that fork PRs take. GPU coverage is the separate
# `gpu-tests` job's responsibility.
#
# `kronk bucky libs --local` is intentionally left on auto-detect: whisper.cpp
# publishes no ROCm bundle (sdk/tools/bucky/libs/combinations.go), so bucky
# already degrades rocm -> vulkan -> cpu on its own.
env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: cpu

jobs:
  static:
    name: Static checks
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Guard: catch the case where someone bumps the `go` directive in
      # go.mod (or .go-version) but forgets the other file. Patch-level
      # drift is allowed; minor-level drift fails the workflow.
      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: .go-version

      # Pinned to specific tags (not @latest) so a tool release that
      # raises its required Go version doesn't silently bump our CI
      # toolchain or, with GOTOOLCHAIN=local, fail the install. Renovate
      # / Dependabot bumps these intentionally.
      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: gofmt
        # `git ls-files '*.go'` ignores generated files that are
        # gitignored. We deliberately don't run gofmt on vendored or
        # generated code.
        run: |
          fmt="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$fmt" ]]; then
            printf '%s\n' "$fmt"
            echo "::error::Go files need gofmt -s -w"
            exit 1
          fi

      - name: go mod tidy
        # If `tidy` mutates go.mod or go.sum, the diff is non-empty and
        # the step exits non-zero. Keeps the module graph honest.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck -checks=all ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: go fix
        # `go fix -diff` only prints; it does not fail. Capture the diff
        # and fail if it had rewritten anything.
        run: |
          fix_diff="$(go fix -diff ./...)"
          if [[ -n "$fix_diff" ]]; then
            printf '%s\n' "$fix_diff"
            echo "::error::go fix would modify files"
            exit 1
          fi

      # Validates .goreleaser.yaml on every PR/main run, instead of
      # discovering syntax errors only when cutting a release tag.
      # No artifacts are produced — pure config lint.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          version: "~> v2"
          args: check

  race:
    name: Race detector (sdk unit packages)
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Same setup as api-tests / sdk-tests so unit tests that read real
      # GGUFs on disk (e.g. sdk/tools/models TestModelMetadata) can
      # exercise their full code path under the race detector. The libs
      # + models caches are shared across all three jobs, so on a cache
      # hit this adds only seconds.
      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      # Race detector pass on SDK unit packages. The model/library-heavy
      # integration suites still belong to sdk-tests; this job stays
      # scoped to fast unit tests so the race walltime doesn't approach
      # the integration job's:
      #   /sdk/kronk/tests     — integration suite owned by sdk-tests.
      #   /sdk/kronk/pool      — boots the llama runtime + real models.
      #   /sdk/bucky/tests     — boots the whisper runtime + real models.
      - name: go test -race -short (sdk unit packages)
        run: |
          go test -race -short -count=1 -timeout 10m \
            $(go list ./sdk/... \
              | grep -v '/sdk/kronk/tests' \
              | grep -v '/sdk/kronk/pool' \
              | grep -v '/sdk/bucky/tests')

  api-tests:
    name: api/service tests
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # actions/cache/save uses the actions API
    steps:
      - name: Runner specs
        run: |
          nproc
          free -h
          cat /proc/cpuinfo | grep "model name" | head -1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        id: setup
        uses: ./.github/actions/setup-kronk
        with:
          # The models cache key is bound to the model manifest's hash
          # so adding/removing a model in .github/test-models.txt
          # automatically invalidates the cache. Old keys age out via
          # GHA's 7-day-unused eviction policy (also see
          # cache-cleanup.yml).
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: Run api/service tests
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -p=1 -count=1 -timeout 20m ./cmd/kronk/...
          go test -v -p=1 -count=1 -timeout 20m ./cmd/server/...

      # Only one of the two test jobs (api-tests) saves the cache so
      # they can't race. Save only on main branch and only on a cache
      # miss — PR builds and cache hits don't need to re-save.
      - name: Save models cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.models-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.kronk/models
            ~/.kronk/bucky-models
          key: ${{ steps.setup.outputs.models-cache-key }}

  sdk-tests:
    name: sdk tests
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      - name: Run sdk tests
        run: |
          export RUN_IN_PARALLEL=no
          go -C examples test -v -count=1 -timeout 2m ./session-store
          go test -v -p=1 -count=1 -timeout 20m $(go list ./sdk/... | grep -v '/sdk/kronk/tests')
          # Run the model-backed capability suites that fit the CPU-only runner.
          # Additional standalone stress and cache tests remain deliberate local runs.
          # Embeddings remain covered by cmd/server; its SDK model load is
          # omitted because it triggered Go heap corruption on the Linux runner.
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 6m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 6m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid

  # ---------------------------------------------------------------------------
  # gpu-tests
  #
  # The reason the self-hosted Linux runner exists. kronk ships a `rocm`
  # Docker variant (see docker.yml) that until now had no test coverage at
  # all, because GitHub's hosted runners have no GPU. This job runs the
  # model-backed capability suites against the ROCm llama.cpp bundle on
  # kronk-linux-gpu-1's AMD GPU.
  #
  # Self-hosted only, by construction: there is no hosted fallback that could
  # run it, so the job is skipped outright on fork PRs rather than routed.
  #
  # KRONK_PROCESSOR=rocm overrides the workflow-level `cpu` pin. It is strict
  # (sdk/tools/libs/libs.go:234 skips host detection entirely when the
  # variable is set), so if the ROCm bundle is missing or the GPU is not
  # visible this job FAILS rather than quietly falling back to CPU and
  # reporting green. That is the intended behavior — a silent CPU fallback
  # here would mean the rocm path is untested while claiming otherwise.
  #
  # Library bundles install per-triple (<root>/<os>/<arch>/<processor>/), so
  # the rocm bundle coexists with the cpu bundle the other jobs use; they do
  # not overwrite each other despite sharing the libs cache key.
  # ---------------------------------------------------------------------------
  gpu-tests:
    name: GPU tests (ROCm)
    if: (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    runs-on: [self-hosted, Linux, X64, gpu, rocm]
    timeout-minutes: 45
    env:
      KRONK_PROCESSOR: rocm
    steps:
      - name: Runner specs
        run: |
          nproc
          free -h
          rocminfo 2>/dev/null | grep -Ei 'Marketing Name|gfx' | head -10 || echo "rocminfo unavailable"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk
        with:
          models-cache-key: ${{ runner.os }}-models-${{ hashFiles('.github/test-models.txt') }}

      # Fail fast with a readable message if the ROCm bundle did not land or
      # the GPU is invisible, instead of letting every suite below time out.
      - name: Verify ROCm backend
        run: |
          kronk diagnose --no-bench --format json
          kronk devices

      - name: Run model suites on GPU
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 10m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 10m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 10m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 10m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid
