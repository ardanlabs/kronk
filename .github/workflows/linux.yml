name: Linux
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/linux.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/scripts/pull-models.sh"
      - ".github/test-models.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".go-version"
      - ".goreleaser.yaml"
      - ".github/workflows/linux.yml"
      - ".github/actions/setup-kronk/**"
      - ".github/scripts/check-go-version.sh"
      - ".github/scripts/pull-models.sh"
      - ".github/test-models.txt"
  workflow_dispatch:

# Cancel in-progress runs for the same branch. `head_ref || ref` collapses the
# duplicate runs a PR branch gets from both push and pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Minimum-required token scopes: nothing here writes to the repo, issues,
# packages or OIDC.
permissions:
  contents: read

# Four independent jobs — static, race, api-tests, sdk-tests — sharing one
# setup-go cache key via .go-version. The GPU suites are gpu.yml's.
#
# GOTOOLCHAIN=local so a dependency that bumps its `go` directive above
# .go-version fails loudly instead of auto-downloading a toolchain.
#
# Self-hosted for this repo, ubuntu-latest for fork PRs: kronk is public and
# these runners are not ephemeral, so untrusted code must never reach them.
#
# KRONK_PROCESSOR=cpu keeps results independent of which runner took the job;
# `kronk libs --local` would otherwise pick a GPU backend. Bucky auto-detects.
env:
  GOTOOLCHAIN: local
  KRONK_PROCESSOR: cpu

jobs:
  static:
    name: Static checks
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Catches a bump to go.mod's `go` directive without .go-version, or the
      # reverse. Patch-level drift is allowed; minor-level drift fails.
      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: .go-version
          # Hosted only: on self-hosted the module and build caches already
          # persist locally, so the upload is pure cost.
          cache: ${{ runner.environment == 'github-hosted' }}

      # Pinned tags, not @latest: a tool release that raises its required Go
      # version would otherwise fail the install under GOTOOLCHAIN=local.
      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: gofmt
        # `git ls-files` skips gitignored files: vendored and generated code
        # is deliberately not gofmt'd.
        run: |
          fmt="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$fmt" ]]; then
            printf '%s\n' "$fmt"
            echo "::error::Go files need gofmt -s -w"
            exit 1
          fi

      - name: go mod tidy
        # If `tidy` mutates go.mod or go.sum the diff is non-empty and the
        # step exits non-zero.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck -checks=all ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: go fix
        # `go fix -diff` only prints; it does not fail. Capture the diff and
        # fail if it would have rewritten anything.
        run: |
          fix_diff="$(go fix -diff ./...)"
          if [[ -n "$fix_diff" ]]; then
            printf '%s\n' "$fix_diff"
            echo "::error::go fix would modify files"
            exit 1
          fi

      # Lints .goreleaser.yaml on every run instead of at tag time. No
      # artifacts are produced.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          version: "~> v2"
          args: check

  race:
    name: Race detector (sdk unit packages)
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Same setup as api-tests / sdk-tests so unit tests that read real GGUFs
      # (sdk/tools/models) exercise their full path under -race.
      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk

      # Fast unit tests only. The excluded trees boot the llama/whisper
      # runtimes against real models and belong to sdk-tests.
      - name: go test -race -short (sdk unit packages)
        run: |
          go test -race -short -count=1 -timeout 10m \
            $(go list ./sdk/... \
              | grep -v '/sdk/kronk/tests' \
              | grep -v '/sdk/kronk/pool' \
              | grep -v '/sdk/bucky/tests')

  api-tests:
    name: api/service tests
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Runner specs
        run: |
          nproc
          free -h
          cat /proc/cpuinfo | grep "model name" | head -1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk

      - name: Run api/service tests
        run: |
          export RUN_IN_PARALLEL=no
          go test -v -p=1 -count=1 -timeout 20m ./cmd/kronk/...
          go test -v -p=1 -count=1 -timeout 20m ./cmd/server/...

  sdk-tests:
    name: sdk tests
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Kronk
        uses: ./.github/actions/setup-kronk

      - name: Run sdk tests
        run: |
          export RUN_IN_PARALLEL=no
          go -C examples test -v -count=1 -timeout 2m ./session-store
          go test -v -p=1 -count=1 -timeout 20m $(go list ./sdk/... | grep -v '/sdk/kronk/tests')
          # The model-backed suites that fit a CPU-only runner. Embeddings stay
          # covered by cmd/server; its SDK model load caused heap corruption here.
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCounting|Test_BatchChatConcurrent)$' ./sdk/kronk/tests/qwen3
          go test -v -count=1 -timeout 6m -run '^TestLengthTerminatedToolCallBecomesContent$' ./sdk/kronk/tests/qwen06
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/draft
          go test -v -count=1 -timeout 6m -run '^(TestSuite|Test_PooledVision)$' ./sdk/kronk/tests/vision
          go test -v -count=1 -timeout 6m -run '^TestSuite$' ./sdk/kronk/tests/vision_imc
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestConcurrentRerank)$' ./sdk/kronk/tests/rerank
          go test -v -count=1 -timeout 6m -run '^(TestSuite|TestUsageCountingHybrid)$' ./sdk/kronk/tests/hybrid
