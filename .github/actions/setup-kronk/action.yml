name: Set up Kronk test environment
description: >
  Frees disk space on hosted Linux, installs Go pinned to .go-version,
  restores the shared libraries cache, builds the kronk CLI, installs the
  llama.cpp + whisper.cpp libraries and pulls every model listed in
  .github/test-models.txt. On macOS it also stages and verifies the Metal
  capability shim, which every macOS job needs because darwin/arm64 has one
  llama.cpp bundle and it always carries Metal
  (zarf/docker/runner/macos/README.md). Re-used by the Linux, macOS and GPU
  workflows so every job starts from an identical environment.

runs:
  using: composite
  steps:
    - name: Free disk space
      # Only the hosted images ship the toolchains this reclaims. The
      # self-hosted runner has 800+ GB free and none of these paths.
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    # CI's Go toolchain is pinned in .go-version, not go.mod: contributors keep
    # their local toolchain, CI stays on a known-patched one for govulncheck.
    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version-file: .go-version
        # Hosted only: self-hosted already persists the module and build
        # caches in a local volume, so the upload is pure cost.
        cache: ${{ runner.environment == 'github-hosted' }}

    # Hosted-only: self-hosted persists ~/.kronk itself. Keyed on the installer
    # packages' version constants; must restore before the build/install step.
    - name: Restore libraries cache
      id: cache-libs
      if: runner.environment == 'github-hosted'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: |
          ~/.kronk/libraries
          ~/.kronk/bucky-libraries
        key: ${{ runner.os }}-kronk-libs-${{ hashFiles('sdk/tools/libs/libs.go', 'sdk/tools/bucky/libs/**/*.go') }}

    # Must precede every step below that shells out to kronk. The libraries
    # root is $HOME/.kronk, the same tree the cache above restores into.
    #
    # GOBIN is per-job, not the default $GOPATH/bin. The Linux fleet shares one
    # kronk-runner-go volume across all four containers, and every job on
    # [self-hosted, Linux, X64] — linux.yml alone schedules four — installs the
    # same $GOPATH/bin/kronk. Two overlapping jobs then have one rewriting the
    # binary while the other executes it, and the reader dies with ETXTBSY
    # ("Text file busy", exit 126) somewhere unrelated: seen in run 33931520288
    # from pull-models.sh, several steps after the install that clobbered it.
    #
    # $RUNNER_TEMP is per-job on every runner here, so the binary stops being
    # shared while $GOPATH/pkg/mod — the reason the volume is shared at all —
    # still is. GITHUB_PATH prepends, so later steps and pull-models.sh resolve
    # this kronk ahead of any stale copy; this step predates that and calls it
    # by absolute path.
    - name: Build kronk + install libs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.kronk/libraries"

        export GOBIN="$RUNNER_TEMP/gobin"
        mkdir -p "$GOBIN"
        go install ./cmd/kronk
        echo "$GOBIN" >> "$GITHUB_PATH"

        "$GOBIN/kronk" libs --local
        "$GOBIN/kronk" bucky libs --local

    # The macOS runners are VMs whose paravirtual GPU reports
    # MTLGPUFamilyApple5, below ggml-metal's Apple7 gate, so every unshimmed
    # macOS job runs fallback kernels (zarf/docker/runner/macos/README.md).
    #
    # Staging is not injecting. DYLD_INSERT_LIBRARIES is inherited by every
    # child, so each workflow scopes it to steps whose output no parser reads.
    - name: Stage Metal capability shim
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        src="/Volumes/My Shared Files/kronk-tools/LumeMetalCapabilities.dylib"
        if [[ ! -f "$src" ]]; then
          echo "::error::$src is missing. On the runner host, build it with zarf/docker/runner/macos/build-metal-shim.sh and add the kronk-tools mount to ~/sand.yml."
          exit 1
        fi
        cp "$src" "$RUNNER_TEMP/LumeMetalCapabilities.dylib"

        # /usr/bin is arm64e while Go emits plain arm64, and the dylib loads
        # into every child: a single-slice arm64 build aborts `tee`, `sw_vers`
        # and the rest with "incompatible architecture".
        if [[ "$(lipo -archs "$RUNNER_TEMP/LumeMetalCapabilities.dylib")" != *arm64e* ]]; then
          echo "::error::staged shim has no arm64e slice; rebuild it on the host with zarf/docker/runner/macos/build-metal-shim.sh"
          exit 1
        fi

    # The shim fails OPEN: a guest image bump that moves the internals it hooks
    # leaves jobs green on the Apple5 fallback path, so this step is the notice.
    #
    # Two probes. llama-bench prints ggml's capability banner, which `kronk
    # devices` cannot (LogSilent, sdk/kronk/init.go:134-141); `kronk devices`
    # proves injection reaches a plain-arm64 Go binary.
    #
    # Scoped with a shell prefix, never exported nor set in $GITHUB_ENV: the
    # banner would land in the combined output `kronk diagnose` parses as the
    # CPU model (sdk/tools/diagnose/system_darwin.go:15).
    - name: Verify Metal capability shim
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        # kronk's own answer for the active bundle, so this cannot drift from
        # what the suites load. Libraries root is $HOME/.kronk, as above.
        read -r bos barch bproc <<< "$(kronk libs --local --list-installs | awk '/\(active\)/{print $1, $2, $3; exit}')"
        bench="$HOME/.kronk/libraries/$bos/$barch/$bproc/llama-bench"
        if [[ ! -x "$bench" ]]; then
          echo "::error::no llama-bench in the active bundle ($bos/$barch/$bproc); expected $bench"
          exit 1
        fi

        # rc captured rather than left to `set -e`, so the log still prints on
        # failure — that output is the only thing that explains why.
        rc=0
        DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/LumeMetalCapabilities.dylib" \
        LUME_METAL_APPLE_FAMILY_MAX=1009 \
        LUME_METAL_MAX_THREADGROUP_MEMORY=32768 \
          "$bench" --list-devices > "$RUNNER_TEMP/shim-caps.txt" 2>&1 || rc=$?
        cat "$RUNNER_TEMP/shim-caps.txt"
        if [[ "$rc" -ne 0 ]]; then
          echo "::error::llama-bench --list-devices failed (exit=$rc) under the Metal shim"
          exit "$rc"
        fi

        if grep -qE 'simdgroup reduction *= *false' "$RUNNER_TEMP/shim-caps.txt"; then
          echo "::error::Metal capability shim is not in effect: ggml resolved simdgroup reduction = false, so this job would run the Apple5 fallback path. See zarf/docker/runner/macos/README.md."
          exit 1
        fi

        if ! grep -qE 'simdgroup reduction *= *true' "$RUNNER_TEMP/shim-caps.txt"; then
          echo "::error::ggml printed no 'simdgroup reduction' line at all. It has printed one on every run to date, so either the probe never initialized Metal or ggml renamed the banner — read the output above and fix this check rather than deleting it."
          exit 1
        fi

        rc=0
        DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/LumeMetalCapabilities.dylib" \
        LUME_METAL_APPLE_FAMILY_MAX=1009 \
        LUME_METAL_MAX_THREADGROUP_MEMORY=32768 \
          kronk devices > "$RUNNER_TEMP/shim-devices.txt" 2>&1 || rc=$?
        cat "$RUNNER_TEMP/shim-devices.txt"
        if [[ "$rc" -ne 0 ]]; then
          echo "::error::kronk devices failed (exit=$rc) under the Metal shim"
          exit "$rc"
        fi

        if ! grep -q 'LumeMetalCapabilities. Enabled' "$RUNNER_TEMP/shim-devices.txt"; then
          echo "::error::the shim did not attach to kronk, a plain-arm64 Go binary, so it will not attach to the test binaries either. Check the staged dylib's slices (lipo -archs) before anything else."
          exit 1
        fi

    # sand recreates the macOS VM per job, so ~/.kronk never survives; the host
    # mount makes that a one-time cost. Only models: their renames stay in-tree.
    - name: Persist models on ephemeral macOS VMs
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        share="/Volumes/My Shared Files/kronk-models"
        if [[ ! -d "$share" ]]; then
          echo "::warning::$share is not mounted; models will not persist between jobs"
          exit 0
        fi
        mkdir -p "$HOME/.kronk"
        if [[ -L "$HOME/.kronk/models" ]]; then
          echo "already linked: $HOME/.kronk/models -> $(readlink "$HOME/.kronk/models")"
        else
          rm -rf "$HOME/.kronk/models"
          ln -s "$share" "$HOME/.kronk/models"
          echo "linked: $HOME/.kronk/models -> $share"
        fi
        echo "persisted models: $(du -sh "$share" 2>/dev/null | cut -f1 || echo unknown)"

    # Unconditional: the pull short-circuits on verified files, so a warm
    # ~/.kronk costs a verify pass (sdk/tools/models/download.go).
    - name: Download test models
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.kronk/models"
        ./.github/scripts/pull-models.sh .github/test-models.txt
