name: Set up Kronk test environment
description: >
  Frees disk space on Linux, installs Go pinned to .go-version, restores the
  shared libraries + models caches, builds the kronk CLI, installs the
  llama.cpp + whisper.cpp libraries and (on cache miss) pulls every
  model listed in .github/test-models.txt. Re-used by the Linux and macOS
  test workflows so jobs start from an identical environment and share
  setup-go's Go module + build cache via the common cache key.

  Wall-clock note: the models cache contains ~6.6 GiB of uncompressed
  artifacts. The `go install ./cmd/kronk` + native-libs install path is
  ~25 s on a Go-module cache miss. The two are independent (the kronk binary
  doesn't need any models on disk, and the libs install only needs
  the libraries cache), so on Linux this action overlaps them: it kicks
  off the kronk build + libs install in the background after the libs
  cache restore, then restores the models cache in the foreground, then
  joins the background work before any downstream step that needs the
  kronk binary on PATH. On a typical Linux run this hides the full
  go-install cost behind the models-cache restore.

inputs:
  models-cache-key:
    description: >
      The cache key for the kronk + bucky model directories. Callers
      should bake hashFiles('.github/test-models.txt') into the key so
      that adding or changing a required model automatically
      invalidates the cache instead of silently reusing a stale set.
    required: true
  extra-models-file:
    description: >
      Optional second model list, pulled after .github/test-models.txt and
      in the same `<backend> <model-id>` format. It exists because the base
      list is bounded by GitHub's 10 GB cache quota (the cache layers here
      run on hosted runners only), while a self-hosted fleet has hundreds of
      GB of persistent volume and can host models no hosted runner could.
      Callers that pass this should bake it into models-cache-key too.
    required: false
    default: ""

outputs:
  models-cache-hit:
    description: "Whether the models cache was a hit."
    value: ${{ steps.cache-models.outputs.cache-hit }}
  models-cache-key:
    description: "The resolved models-cache key (echoed back so the caller can re-use it for the save step)."
    value: ${{ inputs.models-cache-key }}

runs:
  using: composite
  steps:
    - name: Free disk space
      # Only the hosted images ship the toolchains this reclaims. The
      # self-hosted runner has 800+ GB free and none of these paths.
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    # CI's Go toolchain lives in /.go-version (not go.mod) so that
    # contributors on any 1.27.x release build with their local toolchain
    # — no auto-download — while CI stays pinned to a known-patched
    # version for govulncheck. The .go-version file is also picked up
    # automatically by asdf, mise, goenv, gvm, and direnv's use_go.
    # setup-go's cache key includes the resolved Go version, so all jobs
    # using this file share the same Go module + build cache.
    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version-file: .go-version
        # setup-go defaults this to true, which pushes the module and build
        # caches through the same GitHub cache service. On a self-hosted
        # runner those directories already persist in a local volume, so the
        # upload is pure cost — and it fails outright once the cache budget
        # is exhausted.
        cache: ${{ runner.environment == 'github-hosted' }}

    # CACHING, hosted vs self-hosted
    #
    # actions/cache is a GitHub-hosted service: a self-hosted runner still
    # uploads and downloads over the network, and is billed for it. Two
    # things make it the wrong tool on our own hardware:
    #
    #   * It records paths relative to the workspace. ~/.kronk sits two
    #     levels above the workspace on a hosted runner and nowhere near it
    #     on ours (HOME=/root, workspace under /_work), so an archive saved
    #     on one cannot be restored onto the other.
    #   * ~/.kronk and ~/go already persist between jobs in Docker volumes,
    #     which is the same cache without the transfer or the bill.
    #
    # So the cache layers run on hosted runners only. Self-hosted skips
    # straight to the install/pull steps, which short-circuit on files the
    # volume already holds. Hosted keeps its original cache keys so the
    # existing entries stay valid.
    #
    # Native llama.cpp + whisper.cpp library cache. Keyed on the version
    # constants in their installer packages, so a defaultVersion bump in
    # code invalidates this cache without bumping any cache-key suffix
    # by hand. Separate from the models cache because libs change far
    # less often.
    #
    # Must complete BEFORE the platform-specific build/install step below,
    # because `kronk libs --local` and `kronk bucky libs --local` read/write
    # the on-disk library trees that this cache restores.
    - name: Restore libraries cache
      id: cache-libs
      if: runner.environment == 'github-hosted'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: |
          ~/.kronk/libraries
          ~/.kronk/bucky-libraries
        key: ${{ runner.os }}-kronk-libs-${{ hashFiles('sdk/tools/libs/libs.go', 'sdk/tools/bucky/libs/**/*.go') }}

    # Kick off the kronk build + native-libs install in the background
    # so it runs concurrently with the (much slower) models-cache
    # restore below. The runner does NOT reap orphaned processes
    # between composite-action steps, so setsid + nohup + disown is
    # enough to keep the child alive across the step boundary.
    #
    # Exit code, log, and pid are written to ${RUNNER_TEMP}/setup-kronk-bg.* so
    # the "Wait for background kronk install" step can surface
    # failures (and the build log) without losing the kronk install
    # being the actual cause of a downstream "command not found".
    # RUNNER_TEMP, not /tmp: the self-hosted runner persists /tmp across
    # jobs, so two runs would read each other's stale .exit/.pid files.
    #
    # Why all three commands run in one background shell:
    #   - `go install ./cmd/kronk` produces the kronk binary on PATH
    #     (setup-go added GOPATH/bin to PATH for subsequent steps).
    #   - `kronk libs --local` and `kronk bucky libs --local` need
    #     the binary AND the libraries cache (already restored).
    #   - All three are pure CPU+disk work that doesn't touch the
    #     models cache, so chaining them inside the background lets
    #     the whole sequence overlap the models restore.
    - name: Build kronk + install libs (background)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.kronk/libraries"
        rm -f "${RUNNER_TEMP}/setup-kronk-bg.exit" "${RUNNER_TEMP}/setup-kronk-bg.log" "${RUNNER_TEMP}/setup-kronk-bg.pid"

        # setsid detaches from the controlling terminal; nohup + the
        # explicit fd redirections make the child immune to SIGHUP
        # and prevent it from holding the step's stdout/stderr pipes
        # open (which would block the step from completing).
        # NOTE: do NOT wrap the chain in `{ set -e; ... } || rc=$?` —
        # bash suppresses `set -e` inside a compound command on the LHS
        # of `||`, so a failing `go install` would be swallowed and
        # the next command would still run. A plain `&&` chain stops
        # at the first failure and propagates its exit status via $?.
        setsid nohup bash -c '
          go install ./cmd/kronk \
            && kronk libs --local \
            && kronk bucky libs --local
          echo "$?" > "${RUNNER_TEMP}/setup-kronk-bg.exit"
        ' </dev/null >"${RUNNER_TEMP}/setup-kronk-bg.log" 2>&1 &
        echo $! > "${RUNNER_TEMP}/setup-kronk-bg.pid"
        disown
        echo "Started background kronk install (pid $(cat "${RUNNER_TEMP}/setup-kronk-bg.pid"))"

    # macOS does not provide setsid, so perform the same setup in the
    # foreground. The self-hosted runner keeps its Go build cache between
    # jobs, making the lost overlap less important than portable process
    # management here.
    - name: Build kronk + install libs
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.kronk/libraries"
        go install ./cmd/kronk
        kronk libs --local
        kronk bucky libs --local

    # On Linux, restore the multi-GB model cache in the foreground while the
    # background step above builds kronk and installs the native libs. On a
    # typical Linux run the background work finishes before this step does,
    # so the join below is effectively free. macOS reaches this step after
    # its foreground build/install completes.
    - name: Restore models cache
      id: cache-models
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: |
          ~/.kronk/models
          ~/.kronk/bucky-models
        key: ${{ inputs.models-cache-key }}

    # Join the background work before any downstream step needs the
    # kronk binary on PATH (either the conditional model-download
    # step below, or the test runs in the caller workflow). Polls
    # the pid since `wait` only works on children of the current
    # shell — and the background process was spawned in a previous
    # step's shell.
    - name: Wait for background kronk install
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        PID="$(cat "${RUNNER_TEMP}/setup-kronk-bg.pid")"
        echo "Waiting for background kronk install (pid $PID)..."
        # `kill -0 PID` is a portable existence probe (Linux runners
        # are the only place this composite is consumed today, but
        # the same idiom works on macOS for local debugging).
        # Belt-and-braces: stop polling as soon as the exit file
        # appears, so we don't keep watching a recycled PID in the
        # (vanishingly small) window between the child writing its
        # result and the kernel reaping it.
        while [[ ! -f "${RUNNER_TEMP}/setup-kronk-bg.exit" ]] && kill -0 "$PID" 2>/dev/null; do
          sleep 1
        done
        echo "::group::Background kronk install log"
        cat "${RUNNER_TEMP}/setup-kronk-bg.log"
        echo "::endgroup::"
        EXIT="$(cat "${RUNNER_TEMP}/setup-kronk-bg.exit" 2>/dev/null || echo 1)"
        if [[ "$EXIT" != "0" ]]; then
          echo "::error::Background kronk install failed (exit=$EXIT)"
          exit "$EXIT"
        fi

    # Deliberately NOT gated on the cache hit. actions/cache records paths
    # relative to the workspace, and ~/.kronk sits at a different depth on a
    # hosted runner (HOME=/home/runner, workspace two levels below) than on a
    # self-hosted one (HOME=/root, workspace under /_work). A hit restored
    # across that boundary reports success while the files land somewhere the
    # tests never look, and gating the download on the hit turned that into a
    # green run that tested nothing. The pull loop short-circuits on verified
    # files (sdk/tools/models/download.go), so running it unconditionally
    # costs a verification pass and repairs any such mismatch.
    # The macOS runners are ephemeral VMs — sand recreates one per job — so
    # ~/.kronk never survives and every run would re-download the whole model
    # set (6.6 GiB, ~4m30s measured). sand mounts a persistent host directory
    # at the share below (the `mounts` block in sand.yml), so pointing the
    # models directory at it makes the download a one-time cost per runner.
    #
    # Only the models are redirected. KRONK_BASE_PATH would move the whole
    # base directory, but that drags badger and the library bundles onto
    # virtiofs for no real gain — the libraries are ~30 MiB and the models are
    # three orders of magnitude bigger. Every rename in the download path
    # stays inside the models tree (sdk/tools/models/download.go), so the
    # symlink introduces no cross-device rename.
    #
    # A missing share is a warning, not an error: a macOS runner without the
    # mount still works, it just re-downloads like before.
    - name: Persist models on ephemeral macOS VMs
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        share="/Volumes/My Shared Files/kronk-models"
        if [[ ! -d "$share" ]]; then
          echo "::warning::$share is not mounted; models will not persist between jobs"
          exit 0
        fi
        mkdir -p "$HOME/.kronk"
        if [[ -L "$HOME/.kronk/models" ]]; then
          echo "already linked: $HOME/.kronk/models -> $(readlink "$HOME/.kronk/models")"
        else
          rm -rf "$HOME/.kronk/models"
          ln -s "$share" "$HOME/.kronk/models"
          echo "linked: $HOME/.kronk/models -> $share"
        fi
        echo "persisted models: $(du -sh "$share" 2>/dev/null | cut -f1 || echo unknown)"

    - name: Download test models
      shell: bash
      # The model list lives in .github/test-models.txt (one
      # `<backend> <model-id>` per line). The same file is hashed into
      # the cache key by the caller, so any change here forces a
      # download on the next run instead of silently reusing a stale
      # cache that's missing the new entry.
      env:
        EXTRA_MODELS_FILE: ${{ inputs.extra-models-file }}
      run: |
        set -euo pipefail
        mkdir -p $HOME/.kronk/models

        # One function over both lists so the backend dispatch and the
        # comment/blank stripping cannot drift between them.
        pull_list() {
          local list="$1"
          if [[ ! -f "$list" ]]; then
            echo "::error::model list '$list' not found"
            exit 1
          fi
          echo "::group::models from $list"
          while IFS= read -r line || [[ -n "$line" ]]; do
            # Strip comments / blanks.
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [[ -z "$line" ]] && continue
            # shellcheck disable=SC2086  # intentional word-splitting on the space.
            set -- $line
            backend="$1"; model="$2"
            case "$backend" in
              kronk) kronk model pull --local "$model" ;;
              bucky) kronk bucky model pull --local "$model" ;;
              *)
                echo "::error file=${list}::Unknown backend '$backend' (expected 'kronk' or 'bucky')"
                exit 1
                ;;
            esac
          done <"$list"
          echo "::endgroup::"
        }

        pull_list .github/test-models.txt

        if [[ -n "${EXTRA_MODELS_FILE}" ]]; then
          pull_list "${EXTRA_MODELS_FILE}"
        fi
